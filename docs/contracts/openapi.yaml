                    error:
                      code: plugin_not_approved
                      message: 该插件版本尚未通过权限审批
                      requestId: 0192f0c4-7000-7abc-8def-0123456789ab
        "422":
          $ref: "#/components/responses/ChannelValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [channels]
      operationId: deleteChannel
      summary: 删除渠道
      description: |
        仅所有者或持有 `channels.manage`（不可见 → `404`，无管理权 → `403`）。物理删除渠道、模型映射、共享与密钥；
        已有请求日志保留渠道名快照。写审计 `channel.delete`。
      x-required-permission: channels.read
      x-resource-check: 所有者或 channels.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
