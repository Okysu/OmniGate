        未知的分组或字段、取值不合法 → `422 validation_failed`，`details` 的键为 `"<group>.<field>"`。字符串会去掉首尾空格，
        `allowedEmailDomains` 转为小写并去重，`signupCredit` 规范化为十进制字符串。`version` 必须等于当前版本，成功后加 1
        （`settings` 为空时不修改、版本不变）。写审计 `settings.update`，`metadata.before` / `metadata.after` 为出现的字段修改前后的生效值。
      x-required-permission: settings.write
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, settings]
              properties:
                version:
                  type: integer
                settings:
                  $ref: "#/components/schemas/SystemSettingsPatch"
            example: { version: 3, settings: { site: { name: Acme AI, announcement: null }, gateway: { maxAttempts: 2 } } }
      responses:
        "200":
          description: 修改后的系统设置
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettingsView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/affinity/stats:
