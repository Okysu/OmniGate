  /api/channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: 渠道列表
      description: |
        可见范围：自己拥有的 + `scope=global` 的 + `scope=shared` 且自己已接受共享（或按组共享给自己所在用户组）的（待接受的邀请见 `GET /api/channel-shares`）；持有 `channels.manage` 时为全部渠道。
        每一项按调用者身份返回完整的 `Channel`（所有者或持有 `channels.manage`）或精简的 `ChannelSummary`（其余可见用户）。
        排序：`priority` 降序，其次 `createdAt` 降序。`health` 为当前进程内的熔断状态（重启后归零）。
        列表中的完整视图另带 `badges`：由所固定插件版本的 `channel.list.badge` 贡献点从最新能力结果解析得到（没有可显示的值时省略该字段；详情接口不返回）。
