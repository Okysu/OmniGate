              schema:
                $ref: "#/components/schemas/ResetCardUseResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          description: "`not_found`：卡或订阅不存在，或属于别人"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`card_used` / `card_expired` / `card_revoked` / `subscription_not_active`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`validation_failed`（缺少 `subscriptionId`）/ `card_not_applicable`（订阅没有匹配的规则）/ `card_plan_not_allowed`（不在限定套餐内）；卡未被消耗"
