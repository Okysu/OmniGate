            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
