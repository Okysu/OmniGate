          description: "`account_disabled` 或 `permission`"
        "404":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`model_not_found`"
        "413":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: 请求体超过 32 MiB
        "429":
          $ref: "#/components/responses/OpenAIRateLimitedResponse"
        "500":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`internal`"
        "502":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`upstream_unavailable` / `upstream_authentication` / `upstream_invalid_response`"
        "504":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`upstream_timeout`"

  /v1/completions:
    post:
      tags: [gateway]
      operationId: createCompletion
      summary: OpenAI 兼容：文本补全（含 FIM，Round 14）
      description: |
        请求 / 响应正文与 [OpenAI Completions](https://platform.openai.com/docs/api-reference/completions/create) 兼容，`suffix` 用于 FIM 补全
        （`docs/contracts/phase14-api.md`）。**只直通、从不转换**，只路由到 `config.supportsCompletions = true` 的 openai 渠道，
        转发到 `{baseUrl}/completions`（只改写 `model`；流式时强制 `stream_options.include_usage = true`，客户端未要求时过滤只含 usage 的分片）。
        没有这样的渠道时返回 `404 model_not_found`，消息为
        `model "<name>" is not available for this API key (completions are served by OpenAI-compatible channels with Completions support enabled only)`。
        用量取上游 `usage`：`prompt_tokens_details.cached_tokens` 或 DeepSeek 的 `prompt_cache_hit_tokens` 计为缓存读取（与输入分开计价），
        `completion_tokens` 为输出。路由、档位、回退、熔断、Key 策略、套餐配额、限额与计费规则与 `/v1/chat/completions` 相同；
        会话亲和的 `anchor` 来源与 `inject_*` 选项不作用于该接口。每个请求写一条请求日志（`inbound = openai.completions`）。错误使用 OpenAI 格式。
      security:
        - gatewayKey: []
        - gatewayApiKey: []
      x-required-permission: null
      externalDocs:
        description: OpenAI Completions API
        url: https://platform.openai.com/docs/api-reference/completions
      requestBody:
        required: true
        description: |
          OmniGate 只解析 `model`（必填）、`stream`、`stream_options.include_usage` 与 `max_tokens`（预留余额用），不解析 `prompt`
          （字符串、字符串数组与 token 数组都原样转发），其余字段（`suffix`、`echo`、`best_of`、`logit_bias`、`seed` 及未知字段）原样转发。
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatibleRequestBody"
            example:
              model: deepseek-flash
              prompt: "def fib(n):\n    a, b = 0, 1\n"
              suffix: "\n    return a\n"
              max_tokens: 128
      responses:
        "200":
          description: "上游响应原文（`model` 为上游模型名）；`stream: true` 时为 `text/event-stream`"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: "OpenAI 兼容的 `text_completion` 对象（`choices[].text`、`usage`），结构见官方规范。"
              example:
                id: cmpl-1
                object: text_completion
                created: 1760000000
                model: deepseek-flash
                choices:
                  - { text: "    for _ in range(n):\n        a, b = b, a + b", index: 0, logprobs: null, finish_reason: stop }
                usage: { prompt_tokens: 24, completion_tokens: 16, total_tokens: 40, prompt_cache_hit_tokens: 0, prompt_cache_miss_tokens: 24 }
            text/event-stream:
              schema:
                type: string
                description: "SSE：`data: {text_completion 分片}` … `data: [DONE]`"
        "400":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`invalid_request`（JSON 非法、缺少 `model`）或 `upstream_bad_request`"
        "401":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`authentication`"
        "402":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`insufficient_balance`"
        "403":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`account_disabled` 或 `permission`"
        "404":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`model_not_found`：没有提供该模型且开启了 Completions 的 openai 渠道，或所有尝试都得到上游 404"
        "413":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: 请求体超过 32 MiB
        "429":
          $ref: "#/components/responses/OpenAIRateLimitedResponse"
        "500":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`internal`"
        "502":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`upstream_unavailable` / `upstream_authentication` / `upstream_invalid_response`"
        "504":
          $ref: "#/components/responses/OpenAIErrorResponse"
          description: "`upstream_timeout`"

