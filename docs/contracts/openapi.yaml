        渠道没有（非内置的）插件或插件没有声明该能力 → `404 capability_not_found`；插件已停用 → `409 plugin_disabled`。
        在渠道的网络策略下执行（`og.fetch` 走与渠道相同的防 SSRF 客户端），结果保存为该（渠道，能力）的最新结果并写审计 `capability.invoke`
