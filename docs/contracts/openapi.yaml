    post:
      tags: [billing]
      operationId: grantSubscription
      summary: 为用户开通或续期套餐
      description: |
        `userId`、`planId`、`periods`（1–120）必填。套餐必须为 `active`（否则 `409 plan_archived`）；用户或套餐不存在 → `404 not_found`。
        - 套餐 `stackable=false` 且该用户已有该套餐的有效订阅（未取消、未到期）→ **续期**：`endsAt += duration × periods`，规则快照不变，
          返回 `200`，写审计 `subscription.renew`。
        - 否则 → **新开通**：从当前时间开始，`endsAt = now + duration × periods`，快照套餐当前的 `models` 与 `rules`，`source=admin`，
          返回 `201`，写审计 `subscription.grant`。
        同一用户的开通 / 续期（含兑换套餐码）用事务级 advisory lock 串行化。
      x-required-permission: billing.manage
      parameters:
