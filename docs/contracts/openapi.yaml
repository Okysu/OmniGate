  /api/admin/users/batch:
    post:
      tags: [admin]
      operationId: batchUsers
      summary: 批量停用 / 启用 / 强制下线 / 修改用户组
      description: |
        对 1–200 个用户逐个执行同一操作，规则与单个操作相同；单个用户失败不影响其他用户，整体总是返回 `200`（请求本身不合法时除外）。
        - `disable`：`reason` 必填（去除首尾空白后 1–200 个字符），`until` 可选（必须晚于当前时间，null = 永久）；已停用的用户更新原因与期限；
          吊销会话、清空 Key 缓存与通知同 `PATCH /api/admin/users/{id}`。**批量操作不做乐观锁检查**。
        - `enable`：已是启用状态的用户视为成功（不做修改）；启用时清空停用原因与期限。
        - `logout`：同 `POST /api/admin/users/{id}/logout`。
        - `set_group`（Round 6）：同 `PUT /api/admin/users/{id}/group`（`groupId` 必填）；已在该组的用户视为成功（不做修改）。
        - 每项失败的 `code`：`not_found`（不是合法 UUID 或用户不存在）、`cannot_disable_self`（停用 / 强制下线自己）、
          `last_admin`（停用最后一位启用状态的系统管理员）；其他内部错误为 `internal_error`。重复的 id 只处理一次（只出现一次在结果中）。

        `422 validation_failed`：`ids` 数量不在 1–200（`details.ids`）、`action` 非法（`details.action`）、停用缺少原因 / 原因过长
        （`details.reason`）或 `until` 不晚于当前时间（`details.until`）。
        审计：一条 `user.batch`（metadata `action`、`ids`、`reason`、`until`、`succeeded`、`failed`），另为每个成功的用户写
        `user.update`（disable / enable）或 `user.logout`。
      x-required-permission: users.write
      parameters:
