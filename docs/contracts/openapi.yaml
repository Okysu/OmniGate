  /api/billing/reset-cards/{id}/use:
    post:
      tags: [billing]
      operationId: useResetCard
      summary: 使用重置卡（Round 11）
      description: |
        在一个事务内（`docs/contracts/phase11-api.md` §2.3）：以条件更新认领卡（可用、属于调用者、未过期；并发使用同一张卡只有一个成功）→ 锁定并校验订阅
        （属于调用者、有效、在限定套餐内）→ 找出窗口时长匹配的 session / rolling 规则 → 锚定式重置（session 从现在起重新计时，rolling 清空分桶）→
        记录使用的订阅并写审计 `reset_card.use`。任何一步失败整体回滚，卡不会被消耗。
      x-required-permission: billing.own
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subscriptionId]
              properties:
                subscriptionId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: 使用成功；`subscription` 为重置后的订阅视图
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
