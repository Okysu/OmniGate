        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
            examples:
              openai:
                summary: OpenAI 兼容渠道（baseUrl 含 /v1）
                value:
                  name: OpenAI 主账号
                  type: openai
                  baseUrl: https://api.openai.com/v1
                  apiKey: sk-xxxxxxxxxxxxxxxx
                  models:
                    - { model: gpt-4o, upstreamModel: gpt-4o }
                    - { model: gpt-4o-mini }
                    - { model: gpt-6-pro, upstreamProtocol: responses }
                    - { model: text-embedding-3-small }
                  config: { supportsResponses: true, maxTokensField: max_completion_tokens }
              anthropic:
                summary: Anthropic 渠道（baseUrl 不含 /v1）
                value:
                  name: Anthropic
                  type: anthropic
                  baseUrl: https://api.anthropic.com
                  apiKey: sk-ant-xxxxxxxx
                  scope: global
                  models:
                    - { model: claude-sonnet, upstreamModel: claude-sonnet-4-5 }
              plugin:
                summary: 使用插件版本（type / baseUrl / models 取自插件）
                value:
                  name: DeepSeek
                  pluginVersionId: 0192f0c4-7000-7abc-8def-0123456789ab
                  apiKey: sk-xxxxxxxxxxxxxxxx
                  pluginConfig: { currency: CNY, lowBalance: 20 }
      responses:
        "201":
          description: 已创建（完整视图；`scope` 不为 `shared` 时 `sharedWith` 为空数组）
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          $ref: "#/components/responses/PluginBindingConflict"
        "422":
          $ref: "#/components/responses/ChannelValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

