      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: unread
          in: query
          description: "`true`：只返回未读"
          schema: { type: boolean }
        - name: type
          in: query
          description: 逗号分隔的事件类型（精确匹配），如 `wallet.balance_low,wallet.credited`
          schema: { type: string }
      responses:
        "200":
          description: 通知列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/notifications/unread-count:
    get:
      tags: [notifications]
