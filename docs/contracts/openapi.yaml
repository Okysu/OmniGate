  /api/billing/redeem:
    post:
      tags: [billing]
      operationId: redeemCode
      summary: 兑换码（钱包充值或开通套餐）
      description: |
        输入忽略大小写、空格与连字符，`OG` 前缀可省略，并按 Crockford 规则把 `I`/`L` 视为 `1`、`O` 视为 `0`。
        限流：每用户每分钟 5 次（进程内，先于校验执行，超出 → `429 rate_limited`）。
        不存在或格式错误 → `422 redeem_invalid`；码存在但不可用 → `409`（`redeem_batch_disabled` / `redeem_not_started` /
        `redeem_expired` / `redeem_used_up` / `redeem_user_limit`）。写审计 `billing.redeem`（不记录明文码）。

        响应按批次类型用 `kind` 区分：
        - `wallet_credit`：写一条 `grant` 账本，返回 `{kind, amount, wallet}`。
        - `plan`：开通或续期批次指定的套餐（`periods` 份，规则同 `POST /api/admin/billing/subscriptions`，`source=redeem`），不写账本，
          返回 `{kind, subscription}`（含当前用量）。套餐已下架 → `409 plan_archived`。审计 metadata 含 `kind: "plan"`、`planId`、`periods`、
          `subscriptionId`、`renewed`、`endsAt`。
      x-required-permission: billing.own
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  example: OG-7K3QM-X2D9F-H4TNB-1P8RW
      responses:
        "200":
          description: 兑换成功
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResult"
              examples:
                walletCredit:
                  value:
                    kind: wallet_credit
                    amount: "10"
                    wallet: { userId: 0192f0c4-7000-7abc-8def-0123456789ab, balance: "12.5", reserved: "0", available: "12.5", currency: USD, version: 3 }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          description: "`redeem_batch_disabled` / `redeem_not_started` / `redeem_expired` / `redeem_used_up` / `redeem_user_limit` / `plan_archived`（套餐码对应的套餐已下架）"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: redeem_used_up
                  message: 该兑换码已被使用
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
        "422":
          description: "`redeem_invalid`（不存在或格式错误）或 `validation_failed`（请求体非法）"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: redeem_invalid
                  message: 兑换码无效
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

