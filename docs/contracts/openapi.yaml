    get:
      tags: [channels]
      operationId: getChannel
      summary: 渠道详情
      description: 可见性同列表；不可见或 `id` 不是合法 UUID 时返回 `404 not_found`。返回完整视图或精简视图，规则同列表。
      x-required-permission: channels.read
      responses:
        "200":
          description: 渠道
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [channels]
      operationId: updateChannel
      summary: 修改渠道（乐观锁）
      description: |
        仅所有者或持有 `channels.manage` 的用户可修改：不可见 → `404`，可见但无管理权 → `403 forbidden`。
        `version` 必填；省略的字段保持不变；`models`、`config`、`sharedWith` 为**整体替换**；提供 `apiKey` 时替换密钥。
        `type` 创建后不能修改（传入不同值 → `422`）。改为 / 保持 `scope=global` 需要 `channels.manage`。
        修改 `baseUrl` 时按**所有者**的角色执行 `base_url_not_allowed` 检查。`scope` 不是 `shared` 时 `sharedWith` 被清空。
        写审计 `channel.update`（metadata 含 `changed` 字段名列表，不含密钥）。修改在数秒内同步到数据面。

        **插件**：`pluginVersionId` 只能在同一插件的版本之间切换（升级 / 回滚；更换插件请新建渠道，否则 `422`）；切换到的版本必须已批准且插件已启用
        （`409 plugin_not_approved` / `plugin_disabled`；不切换版本时，插件停用也不影响修改其他字段）。切换时若新版本导出 `migrateConfig(oldConfig, fromVersion)`，
        先用它迁移现有配置（失败 → `422`，消息以“配置迁移失败”开头），再与提交的 `pluginConfig` 合并校验；新版本不再声明的敏感字段被删除。
        版本切换另写审计 `channel.plugin_upgrade`（metadata 含 `from` / `to` 版本号）。`pluginConfig` 为**整体替换**；`secrets` 中的空字符串表示删除该字段。
        尚未绑定插件的旧渠道在任意修改时会自动绑定对应类型的内置插件。
      x-required-permission: channels.read
      x-resource-check: 所有者或 channels.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ChannelInput"
                - type: object
                  required: [version]
            example:
              status: disabled
              priority: 10
              version: 3
      responses:
        "200":
          description: 修改后的渠道（完整视图）
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`version_conflict`，或 `plugin_not_approved` / `plugin_disabled`（切换到的插件版本不可用）"
          headers:
            X-OmniGate-Request-Id:
