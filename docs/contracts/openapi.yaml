      summary: 插件列表
      description: |
        全部插件（不分页），内置插件在前，其余按名称排序。每项附带最新已批准版本（`latest`，按语义化版本取最大）、最新待审批版本（`pending`）、
        固定到该插件任一版本的渠道数（`channels`）以及是否存在草稿（`hasDraft`）。列表项不含 `versions`。
      x-required-permission: plugins.read
