    get:
      tags: [billing]
      operationId: listRedeemBatches
      summary: 兑换码批次列表
      description: 按 `createdAt` 倒序分页；`redeemed` 为已兑换次数。不返回任何兑换码明文。
      x-required-permission: billing.manage
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页批次列表
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemBatchList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [billing]
      operationId: createRedeemBatch
      summary: 生成兑换码批次
      description: |
        生成 `count`（1–1000）个兑换码，两种批次：
        - `kind=wallet_credit`（缺省）：面额为 `amount` 的钱包充值码。
        - `kind=plan`（Round 4）：开通 / 续期套餐 `planId` 共 `periods`（1–120）份的套餐码；不能带 `amount`。套餐必须存在
          （否则 `422`，`details.planId` 为“套餐不存在”）且为 `active`（否则 `409 plan_archived`）。

        码格式 `OG-XXXXX-XXXXX-XXXXX-XXXXX`（20 位 Crockford Base32，100 bit 随机），服务端只保存 SHA-256 摘要与前缀 `OG-XXXXX`。
        **明文 `codes` 只在本响应中返回一次**，之后无法再次查看，请立即导出。写审计 `billing.batch_create`（不含明文；
        钱包批次含 `amount`，套餐批次含 `planId`、`periods`）。
      x-required-permission: billing.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemBatchCreateRequest"
            examples:
              walletCredit:
                summary: 钱包充值码
                value:
                  amount: "10"
                  count: 50
                  perUserLimit: 1
                  expiresAt: "2026-12-31T16:00:00Z"
                  note: 内测用户充值
              plan:
                summary: 套餐码（每个码开通 / 续期 1 份）
                value:
                  kind: plan
                  planId: 0192f0c4-7000-7abc-8def-0123456789ab
                  periods: 1
                  count: 100
                  expiresAt: "2026-12-31T16:00:00Z"
                  note: 双十一月卡
      responses:
        "201":
          description: 批次与明文兑换码
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [batch, codes]
                properties:
                  batch:
                    $ref: "#/components/schemas/RedeemBatch"
                  codes:
                    type: array
                    description: 明文兑换码（显示格式），只返回这一次
                    items:
                      type: string
                      pattern: "^OG(-[0-9A-HJKMNP-TV-Z]{5}){4}$"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          $ref: "#/components/responses/PlanArchived"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

