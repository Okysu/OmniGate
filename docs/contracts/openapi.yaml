        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/admin/settings/smtp-test:
    post:
      tags: [notifications]
      operationId: smtpTest
      summary: 发送 SMTP 测试邮件
      description: |
        用当前生效的 SMTP 设置（数据库 → 环境变量）立即向 `to` 发送一封测试邮件。发送失败时仍返回 200，`ok: false`，
        `error` 为原因（从不包含密码）。SMTP 未配置（`host` 或 `from` 为空）→ `409 smtp_not_configured`。
      x-required-permission: settings.write
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: { type: string, format: email }
      responses:
        "200":
          description: 发送结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpTestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          $ref: "#/components/responses/SmtpNotConfigured"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
