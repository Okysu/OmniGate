              $ref: "#/components/schemas/PlanCreateRequest"
            example:
              name: Pro 月卡
              description: 类 Claude Pro：每 5 小时 200 次请求，每周 500 万 token
              listPrice: "20"
              duration: 30d
              models: []
              stackable: false
              rules:
                - id: 5h
                  label: 5 小时窗口
                  meter: requests
                  window: { kind: session, duration: 5h }
                  limit: "200"
                  modelWeights: { gpt-5.6-sol: "5" }
                - id: weekly
                  label: 每周
                  meter: tokens.total
                  window: { kind: calendar, unit: week, timezone: Asia/Shanghai }
                  limit: "5000000"
      responses:
        "201":
          description: 新建的套餐
