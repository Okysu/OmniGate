  /api/admin/users/{id}:
    get:
      tags: [admin]
      operationId: getUserDetail
      summary: 用户详情（Round 6 续）
      description: |
        管理员查看单个用户的概况（`docs/contracts/phase7-api.md` §2.2）：
        - `user`：与列表相同的 `User`（含 `identities`、`disabledReason`、`disabledUntil`、`lastLoginAt`）；
        - `identities`：已关联的外部身份（**含** 提供方侧的 `subject`，仅此接口返回）；
        - `wallet`：钱包余额与预留额；用户还没有钱包记录时为 null；
        - `subscriptions`：最近 20 份订阅（任意状态，按创建时间倒序，带各规则当前用量，结构同 `Subscription`）；
        - `keys`：未吊销的 Gateway Key（按创建时间倒序）；
        - `sessions.active`：有效会话数（未吊销、未过期且未超过空闲超时）；
        - `usage30d`：最近 30 天的请求数（含失败请求）、钱包扣费合计（`charge`，十进制字符串）与 token 合计（输入 + 输出 + 缓存读 + 缓存写）；
        - `channels.own`：该用户拥有的渠道数。

        `id` 不是合法 UUID 或用户不存在 → `404 not_found`。
      x-required-permission: users.read
      parameters:
