        插件返回 `{unsupported: true, reason}` 时 `ok=true`、`unsupported=true`。手动执行的响应额外包含本次的 `logs` 与 `fetches`。
        请求体可省略；提供时只接受 `{input}`（未知字段 → `422`）。
