        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [plugins]
      operationId: createPlugin
      summary: 新建插件（从模板）
      description: |
        新建 `source=editor` 的插件并按模板生成草稿（尚无版本，需编辑后发布）。`id` 为插件 ID（manifest 的 `id`），必须形如 `vendor.name`
        （`^[a-z0-9]+(\.[a-z0-9-]+)+$`，最长 64），不能使用保留前缀 `builtin.`；`name` 去除首尾空白后 1–64 个字符。
        `template` 缺省为 `openai-compatible`：`openai-compatible` / `anthropic-compatible` 生成带 `models.list`、`health.check` 能力、
        一个表格 UI 贡献点与 `tests/models.json` 用例的骨架（初始版本 `0.1.0`），`blank` 只生成空的 `capabilities`；
        `custom-protocol`（“自定义协议”，phase9-api.md §2）生成 `protocol: "custom"` 的插件：以虚构的 Acme JSON Lines 流式协议实现
        `buildRequest`、`parseResponse`、`parseStream`、`endStream`、`normalizeError`，带 `models.list`、`health.check` 能力与每个 Hook 的测试用例。
        插件 ID 已存在 → `409 plugin_exists`。写审计 `plugin.create`。
      x-required-permission: plugins.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id:
                  type: string
                  pattern: "^[a-z0-9]+(\\.[a-z0-9-]+)+$"
                  maxLength: 64
                  example: acme.relay
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: Acme 中转
                template:
                  type: string
                  enum: [openai-compatible, anthropic-compatible, blank, custom-protocol]
                  default: openai-compatible
      responses:
        "201":
          description: 已创建（`hasDraft=true`，`latest` / `pending` 为 null）
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          description: "`plugin_exists`：插件 ID 已存在"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: plugin_exists
                  message: 插件 ID 已存在
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plugins/import:
    post:
      tags: [plugins]
      operationId: importPlugin
      summary: 导入 ZIP 插件包
      description: |
        以 `multipart/form-data` 上传 `file` 字段（请求整体不超过 4 MiB）。压缩包可以直接包含 `manifest.json`，也可以包在一个顶层目录中；
        解压后单个文件 ≤ 256 KiB、总计 ≤ 1 MiB、最多 64 个文件，路径只允许 `[A-Za-z0-9._/-]` 且不能含 `..`。
        `manifest.json` 中的 `id` 必须合法且不能以 `builtin.` 开头。
        - 不存在同 ID 的插件 → 新建 `source=upload` 的插件，压缩包内容成为其草稿（写审计 `plugin.import`）。
        - 已存在同 ID 的非内置插件（包括 `bundled`）→ **直接覆盖**其草稿（不做 `version` 检查），写审计 `plugin.draft_update` 与 `plugin.import`。
        无论编译是否通过都会导入；`build` 为导入内容的编译 / 校验结果（不含“导出是否实现”的检查，发布前会再次完整检查）。
        不是 multipart、缺少 `file`、不是合法 ZIP、超出限制或缺少 `manifest.json` → `422 validation_failed`。
      x-required-permission: plugins.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 插件 ZIP 包
            encoding:
              file:
                contentType: application/zip
      responses:
        "201":
          description: 已导入
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [plugin, draft, build]
                properties:
                  plugin:
                    $ref: "#/components/schemas/Plugin"
                  draft:
                    $ref: "#/components/schemas/Draft"
                  build:
                    $ref: "#/components/schemas/BuildResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          description: "`plugin_exists`（并发导入同一 ID）"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`validation_failed`：上传格式或压缩包内容不合法"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_failed
                  message: 压缩包中缺少 manifest.json
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plugins/{id}:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: getPlugin
      summary: 插件详情
      description: 列表项的全部字段，另加 `versions`（全部已发布版本的摘要，按语义化版本降序；不含文件内容）。
      x-required-permission: plugins.read
      responses:
        "200":
          description: 插件
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [plugins]
      operationId: updatePluginStatus
      summary: 启用 / 停用插件（乐观锁）
      description: |
        `status` 只能是 `enabled` / `disabled`，`version` 必填（缺失 → `422`，不符 → `409 version_conflict`）。写审计 `plugin.update`。
        停用后：固定到该插件任一版本的渠道立即不再参与数据面路由，手动 / 定时能力执行停止，新建渠道或切换到其版本返回 `409 plugin_disabled`；
        渠道本身的配置不变，重新启用即恢复。同一插件 5 分钟内发生 3 次资源违规（执行超时或内存看门狗中断）时系统会自动停用它并写审计
        `plugin.auto_disabled`，需要人工在此重新启用。
        注意：插件状态缓存在各进程内存中，只在本实例修改时刷新，多实例部署时其他实例要到重启后才感知；
        内置插件（`builtin.*`）不能停用，返回 `409 plugin_builtin`。
      x-required-permission: plugins.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, version]
              properties:
                status:
                  $ref: "#/components/schemas/PluginStatus"
                version:
                  type: integer
            example:
              status: disabled
              version: 2
      responses:
        "200":
          description: 修改后的插件（含 `versions`）
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [plugins]
      operationId: deletePlugin
      summary: 删除插件
      description: |
        只能删除 `source` 为 `upload` / `editor` 的插件，且**没有任何渠道**（无论启用与否）固定到它的任一版本。
        级联删除全部版本、草稿与插件存储（`og.storage`），并清除本实例内存中已加载的版本与启停状态。写审计 `plugin.delete`
        （metadata 含 `key` 与删除的版本数 `versions`）。不可恢复；如只是暂停使用，请改用停用（`PATCH`）。
        - `builtin` / `bundled` 插件 → `409 plugin_builtin`（可以停用；随附插件会在每次启动时自动安装，删除没有意义）。
        - 仍有渠道使用 → `409 plugin_in_use`，`details.channels` 为使用中的渠道数量（整数）；先删除这些渠道或把它们切换到其他版本。
      x-required-permission: plugins.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: 已删除（无响应体）
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`plugin_builtin`（内置或随附插件）或 `plugin_in_use`（仍有渠道固定到该插件的版本）"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                builtin:
                  value:
                    error:
                      code: plugin_builtin
                      message: 内置和随附插件不能删除（可以停用）
                      requestId: 0192f0c4-7000-7abc-8def-0123456789ab
                inUse:
                  value:
                    error:
                      code: plugin_in_use
                      message: 仍有 2 个渠道使用该插件，请先删除这些渠道或切换到其他版本
                      requestId: 0192f0c4-7000-7abc-8def-0123456789ab
                      details:
                        channels: 2
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plugins/{id}/draft:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      tags: [plugins]
      operationId: getPluginDraft
      summary: 读取草稿
      description: |
        每个插件最多一份可编辑草稿（发布后删除）。尚无草稿时返回由最新已批准版本生成的草稿：`version=0`、`baseVersionId` 为该版本、
        `updatedAt` 为零值时间（`0001-01-01T00:00:00Z`），以 `version: 0` 保存即创建草稿。
        内置插件 → `409 plugin_builtin`；既无草稿也无已批准版本 → `404 not_found`。
      x-required-permission: plugins.manage
      responses:
        "200":
          description: 草稿
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PluginBuiltin"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [plugins]
      operationId: savePluginDraft
      summary: 保存草稿（乐观锁）
      description: |
        整体替换草稿文件。`files` 与 `version` 必填（`version` 为当前草稿版本；尚无草稿时为 0）。只检查包结构（文件数、大小、路径、是否有
        `manifest.json`），不编译；结构不合法 → `422 validation_failed`（`details.files` 为诊断数组）。版本不符 → `409 version_conflict`；
        内置插件 → `409 plugin_builtin`。写审计 `plugin.draft_update`。
      x-required-permission: plugins.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [files, version]
              properties:
                files:
                  $ref: "#/components/schemas/PluginFiles"
                version:
                  type: integer
      responses:
        "200":
          description: 保存后的草稿
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`version_conflict` 或 `plugin_builtin`"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plugins/{id}/draft/build:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    post:
      tags: [plugins]
      operationId: buildPluginDraft
      summary: 编译检查草稿
      description: |
        对当前草稿执行包结构检查、manifest v1 校验、esbuild 编译（目标 ES2017，只允许相对导入与 `@omnigate/plugin-sdk`）、
        导出检查（manifest 声明的能力与 Hook 必须实现）以及静态风险扫描。无副作用、不写审计。**编译失败也返回 200**（`ok=false`）。
        无请求体。草稿不可用时的错误同 `GET /api/plugins/{id}/draft`。
      x-required-permission: plugins.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: 编译结果
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PluginBuiltin"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plugins/{id}/draft/test:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    post:
      tags: [plugins]
      operationId: testPluginDraft
      summary: 模拟测试草稿
      description: |
        用当前草稿执行一个模拟测试用例（`TestCase`）。`og.fetch` 只命中用例的 `fetch` 列表（未匹配即报错），**绝不访问真实网络**；
        测试中没有渠道 ID，`og.storage` 不可用。提供 `case`（如 `tests/balance.json`）时从草稿中读取该文件，其内容覆盖请求体中的同名字段。
        草稿编译失败时返回 200，`ok=false` 且 `build` 为编译结果（`error` 为 null）。能力用例使用 manifest 中声明的超时；Hook 与计量用例的
        超时为线上的 4 倍（请求 Hook 200 ms，`parseStream` 每块 200 ms，`computeUnits` 20 ms）。
        `capability`、`hook`、`meter` 都没有，`hook` 名称非法、未在 manifest 中声明（自定义协议 Hook 需要 `protocol: "custom"`）或缺少
        `request` / `response`，`meter` 未在 manifest 中声明，`case` 文件不存在或不是合法 JSON → `422 validation_failed`。
      x-required-permission: plugins.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestCase"
            examples:
              inline:
                summary: 内联用例
                value:
                  name: 余额正常
                  capability: balance.get
                  config: { currency: CNY }
                  secrets: { apiKey: sk-test }
                  fetch:
                    - match: { method: GET, url: "https://api.deepseek.com/user/balance" }
                      response:
                        status: 200
                        json:
                          is_available: true
                          balance_infos: [{ currency: CNY, total_balance: "110.00", granted_balance: "10.00", topped_up_balance: "100.00" }]
                  expect: { output: { currency: CNY, total: "110.00" } }
              fromFile:
                summary: 运行草稿中的用例文件
                value:
                  case: tests/balance.json
              stream:
                summary: 流式用例（自定义协议）
                value:
                  hook: parseStream
                  chunks: ["{\"event\":\"text\",\"text\":\"你\"}\n{\"event\":\"te", "xt\",\"text\":\"好\"}\n{\"event\":\"done\",\"stop\":\"end\"}"]
                  expect:
                    output:
                      - { type: delta, content: 你 }
                      - { type: delta, content: 好 }
                      - { type: finish, reason: stop }
              meter:
                summary: 计费计量用例
                value:
                  meter: weighted_tokens
                  usage: { input: 100, output: 50, cacheRead: 20, cacheWrite: 5 }
                  billingCtx: { model: gpt-4o, servedModel: gpt-4o, inbound: openai.chat }
                  expect: { output: "325" }
      responses:
        "200":
          description: 测试结果
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PluginBuiltin"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plugins/{id}/draft/publish:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    post:
      tags: [plugins]
      operationId: publishPluginDraft
      summary: 发布草稿为新版本
      description: |
        完整编译检查当前草稿（同 `draft/build`），通过后生成不可变版本并删除草稿；插件的 `name` / `description` / `author` / `homepage`
        更新为 manifest 中的值。无请求体。
        - 编译或校验未通过 → `422 plugin_build_failed`，`details.diagnostics` 为 `Diagnostic` 数组。
        - `manifest.id` 与插件 ID 不一致 → `422 validation_failed`。
        - `manifest.version` 不大于该插件已发布的最大版本（语义化版本比较）→ `409 plugin_version_exists`。
        - 审批：存在已批准版本且权限（`network` / `secrets` / `schedule` / `storage` / `dangerous`）与**最新已批准版本**完全相同 →
          自动批准（`approvalNote` 说明原因，`approvedBy` 为发布者）；否则 `approval=pending`，需要 `plugins.trust` 审批。插件的第一个版本总是待审批。
        写审计 `plugin.publish`（metadata 含 `version`、`approval`、`permissionsAdded`、`risk` 数量、`contentHash`）。发布不会改变任何渠道所固定的版本。
      x-required-permission: plugins.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      responses:
        "201":
          description: 新版本（含文件、manifest、风险与权限差异）
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginVersion"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`plugin_version_exists`（版本号未递增）或 `plugin_builtin`"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: plugin_version_exists
                  message: 版本号必须大于已发布的 1.0.0
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
        "422":
          description: "`plugin_build_failed`（`details.diagnostics`）或 `validation_failed`（manifest.id 与插件不一致）"
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: plugin_build_failed
                  message: 插件编译或校验未通过
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
                  details:
                    diagnostics:
                      - { file: src/index.ts, line: 12, column: 5, severity: error, message: "Expected \";\" but found \"}\"" }
        "500":
          $ref: "#/components/responses/InternalError"

