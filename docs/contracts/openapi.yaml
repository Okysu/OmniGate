        **不影响已有订阅**（订阅在开通时快照了 `models` 与 `rules`，续期也不会更新快照）。把 `status` 设为 `archived` 即下架：
        不能再开通 / 续期（管理员开通、兑换套餐码、新建套餐码批次都返回 `409 plan_archived`），已有订阅照常生效；设回 `active` 即恢复。
        写审计 `plan.update`（含修改前后）。
      x-required-permission: billing.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
