  /api/plugins/{id}/versions/{vid}/approve:
    parameters:
      - $ref: "#/components/parameters/PluginId"
      - $ref: "#/components/parameters/PluginVersionId"
    post:
      tags: [plugins]
      operationId: approvePluginVersion
      summary: 审批版本权限
      description: |
        对待审批（`approval=pending`）的版本做出决定：`approve` → `approved`，之后渠道可以固定到该版本；`reject` → `rejected`（不可再改）。
        `note` 可选，保存为 `approvalNote`。版本不处于待审批状态 → `409 not_pending`；`decision` 取值非法 → `422`。
        写审计 `plugin.approve` / `plugin.reject`。批准不会自动升级任何渠道。
      x-required-permission: plugins.trust
