                error:
                  code: not_pending
                  message: 该版本不处于待审批状态
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

