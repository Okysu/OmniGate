  /v1/messages/count_tokens:
    post:
      tags: [gateway]
      operationId: countMessageTokens
      summary: Anthropic 兼容：Token 计数
      description: |
        请求正文与 [Anthropic Count Message Tokens](https://docs.anthropic.com/en/api/messages-count-tokens) 兼容，只要求 `model` 字段
        （缺失或 JSON 非法 → `400 invalid_request`）。Key 的模型策略同样生效（不允许 → `403 permission`），没有可用渠道 → `404 model_not_found`。

        处理方式：从可用渠道中（按优先级 / 权重排序、跳过熔断中的渠道）选出**第一个 anthropic 类型**的渠道，转发到其
        `{baseUrl}/v1/messages/count_tokens`（改写 `model`，转发 `anthropic-version` / `anthropic-beta`）；若上游返回 200 且正文含
        `input_tokens`，原样返回上游正文。其他情况（没有 anthropic 渠道、上游失败或返回非 200）只尝试这一次，随后返回本地估算值
        `{"input_tokens": N}`（按请求体约 4 字节 / token 估算），并带响应头 `X-OmniGate-Estimated: true`。

        不计费、不写请求日志、不影响渠道熔断计数；计入 Key 的 `rpm` 限额。错误使用 Anthropic 格式。
        请求体超过 32 MiB 时返回 `413`。
      security:
        - gatewayApiKey: []
        - gatewayKey: []
      x-required-permission: null
      externalDocs:
        description: Anthropic Count Message Tokens API
        url: https://docs.anthropic.com/en/api/messages-count-tokens
      parameters:
        - $ref: "#/components/parameters/AnthropicVersion"
        - name: anthropic-beta
          in: header
          required: false
          description: 原样转发给 anthropic 渠道。
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/AnthropicMessagesRequest"
      responses:
        "200":
          description: 输入 token 数（上游精确值或本地估算值）
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-OmniGate-Estimated:
              description: 仅在返回本地估算值时出现，值为 `true`。
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                type: object
                required: [input_tokens]
                additionalProperties: true
                properties:
                  input_tokens:
                    type: integer
                    format: int64
                    minimum: 0
              examples:
                upstream:
                  value: { input_tokens: 2095 }
                estimated:
                  summary: 本地估算（带 X-OmniGate-Estimated 头）
                  value: { input_tokens: 2310 }
        "400":
          $ref: "#/components/responses/AnthropicErrorResponse"
          description: "`invalid_request`：缺少 `model`、JSON 非法或请求体无法读取"
        "413":
          $ref: "#/components/responses/AnthropicErrorResponse"
          description: 请求体超过 32 MiB
        "401":
          $ref: "#/components/responses/AnthropicErrorResponse"
          description: "`authentication`"
        "403":
          $ref: "#/components/responses/AnthropicErrorResponse"
          description: "`account_disabled`（Key 有效但所属用户被停用）或 `permission`：IP 不在白名单，或 Key 不允许该模型"
        "404":
          $ref: "#/components/responses/AnthropicErrorResponse"
          description: "`model_not_found`"
        "429":
          $ref: "#/components/responses/AnthropicErrorResponse"
          description: "`rate_limited`（Key 的 RPM）"
        "500":
          $ref: "#/components/responses/AnthropicErrorResponse"
          description: "`internal`"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: og_session
      description: |
        浏览器会话 Cookie，由登录回调设置：`Path=/; HttpOnly; SameSite=Lax`，`Secure` 取决于 `OMNIGATE_COOKIE_SECURE`
        （默认在 `OMNIGATE_PUBLIC_URL` 为 https 时开启）。值为 256 位随机数（base64url），服务端只保存其 SHA-256。
        绝对有效期 `OMNIGATE_SESSION_TTL`（默认 720h），空闲超时 `OMNIGATE_SESSION_IDLE_TTL`（默认 168h，按 lastSeenAt 计算，
        lastSeenAt 每分钟最多刷新一次）。账号被停用后会话立即失效。缺失或无效时返回 `401 unauthenticated`。

    gatewayKey:
      type: http
      scheme: bearer
      bearerFormat: og-<43 位 base64url>
      description: |
        数据面 Gateway Key：`Authorization: Bearer og-…`（OpenAI SDK 的默认方式）。Key 在控制台“API Key”页面或 `POST /api/keys` 创建，
        格式为 `og-` + 43 位 base64url（256 bit 随机），服务端只保存 SHA-256 摘要。同时提供 `x-api-key` 时以 `x-api-key` 为准。
    gatewayApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: "数据面 Gateway Key 的另一种传递方式（Anthropic SDK / Claude Code 的默认方式）：`x-api-key: og-…`。优先于 `Authorization`。"

  headers:
    RequestId:
      description: 服务端生成的请求 ID（UUIDv7），与控制面错误体 `requestId`、审计日志及请求日志一致。
      schema:
        type: string
        format: uuid
    CompatWarnings:
      description: |
        仅在跨协议转换时、且确有字段被丢弃或调整时出现：被丢弃 / 调整的字段名，按字母序以英文逗号分隔
        （如 `cache_control,thinking`、`max_tokens(raised_for_thinking),temperature(thinking)`）。含义见文档开头“跨协议兼容”。
      schema:
        type: string
        example: cache_control,service_tier
    RetryAfter:
      description: |
        仅 `429 quota_exceeded` 时出现：距离该用户至少一份订阅重新放行的秒数（整数，向上取整，至少 1）。`quota_exhausted` 与其他 429 不带此头。
      schema:
        type: integer
        minimum: 1
        example: 3600

  parameters:
    ProviderId:
      name: provider
      in: path
      required: true
      description: 登录方式 ID：`github` 或 `OMNIGATE_AUTH_OIDC` 中配置的 OIDC 提供方 ID（小写字母、数字、`-`，最长 32）。
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,32}$"
        example: github
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF 防护头。所有 `/api/*` 非 GET/HEAD/OPTIONS 请求必须携带且值必须为 `XMLHttpRequest`，否则 `403 csrf_rejected`。
      schema:
        type: string
        const: XMLHttpRequest
    Origin:
      name: Origin
      in: header
      required: false
      description: |
        浏览器自动附带。若存在，必须等于 `OMNIGATE_PUBLIC_URL` 的源或属于 `OMNIGATE_ALLOWED_ORIGINS`，否则 `403 csrf_rejected`。
        未携带 Origin 的请求（如 curl）只校验 `X-Requested-With`。
      schema:
        type: string
        example: https://gateway.example.com
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。缺省或非正整数时为 1。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数。缺省或非正整数时为 20；大于 200 时按 200 处理（不报错）。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20

    ResourceId:
      name: id
      in: path
      required: true
      description: 资源 ID（UUID）。不是合法 UUID 时返回 `404 not_found`。
      schema:
        type: string
        format: uuid
    ShareChannelId:
      name: channelId
      in: path
      required: true
      description: 被共享渠道的 ID（UUID）。不是合法 UUID、或当前用户没有该渠道的待接受 / 已接受共享时返回 `404 not_found`。
      schema:
        type: string
        format: uuid
    PluginId:
      name: id
      in: path
      required: true
      description: 插件的数据库 ID（UUID，即 `Plugin.id`，不是 manifest 的 `id`/`key`）。不是合法 UUID 时返回 `404 not_found`。
      schema:
        type: string
        format: uuid
    PluginVersionId:
      name: vid
      in: path
      required: true
      description: 插件版本 ID（UUID，即 `PluginVersion.id`）。不是合法 UUID 或不属于该插件时返回 `404 not_found`。
      schema:
        type: string
        format: uuid
    CapabilityName:
      name: name
      in: path
      required: true
      description: 能力名：`models.list`、`balance.get`、`usage.query`、`quota.get`、`health.check` 或 `custom.<name>`。
      schema:
        type: string
        example: balance.get
    UserIdPath:
      name: userId
      in: path
      required: true
      description: 用户 ID（UUID）。不是合法 UUID 时返回 `404 not_found`。
      schema:
        type: string
        format: uuid
    LogFrom:
      name: from
      in: query
      required: false
      description: 起始时间（含），RFC 3339。缺省为 `to` 之前 7 天。`from` 必须早于 `to`，跨度最长 92 天，否则 `422 validation_failed`。
      schema:
        type: string
        format: date-time
    LogTo:
      name: to
      in: query
      required: false
      description: 结束时间（不含），RFC 3339。缺省为当前时间。
      schema:
        type: string
        format: date-time
    LogUserId:
      name: userId
      in: query
      required: false
      description: 按用户过滤，**仅对持有 `stats.all` 的调用者生效**（其他调用者此参数被忽略，始终只看自己）。非法 UUID → `422`。
      schema:
        type: string
        format: uuid
    LogChannelId:
      name: channelId
      in: query
      required: false
      description: 按（最终）渠道过滤；非法 UUID → `422`。
      schema:
        type: string
        format: uuid
    LogKeyId:
      name: keyId
      in: query
      required: false
      description: 按 Gateway Key 过滤；非法 UUID → `422`。
      schema:
        type: string
        format: uuid
    LogModel:
      name: model
      in: query
      required: false
      description: 按逻辑模型名精确过滤
      schema:
        type: string
    LogStatus:
      name: status
      in: query
      required: false
      description: "`success` = 状态码 < 400，`error` = 状态码 ≥ 400；其他取值忽略。"
      schema:
        type: string
        enum: [success, error]
    LogAffinity:
      name: affinity
      in: query
      required: false
      description: "会话亲和结果（Round 12，`phase12-api.md` §4）：其中一个值，或 `any` = 有规则生效的请求；其他值 → 422。"
      schema:
        type: string
        enum: [any, hit, new, miss, rebound, failover, broken, strict_failed, "off"]
    LogClient:
      name: client
      in: query
      required: false
      description: "识别出的客户端（Round 13，`phase13-api.md` §3）：`GET /api/clients` 中的一个 id；`unknown` 同时包含识别功能上线前的日志；其他值 → 422。"
      schema:
        type: string
        example: claude-code
    DryRun:
      name: dryRun
      in: query
      required: false
      description: "`true` 或 `1`：预览——同样校验参数并统计将受影响的订阅，但不做修改、不写审计、不发通知；其他值按 false 处理。"
      schema:
        type: string
        example: "true"
    AnthropicVersion:
      name: anthropic-version
      in: header
      required: false
      description: |
        Anthropic API 版本。`GET /v1/models` 中出现该头即切换为 Anthropic 响应 / 错误格式；`/v1/messages` 中原样转发给 anthropic 渠道
        （缺省时网关使用 `2023-06-01`）。
      schema:
        type: string
        example: "2023-06-01"

  requestBodies:
    OpenAIChatRequest:
      required: true
      description: |
        OpenAI Chat Completions 请求体（参见 [官方规范](https://platform.openai.com/docs/api-reference/chat/create)）。
        OmniGate 只解析 `model`（必填）、`stream`、`max_tokens` / `max_completion_tokens`、`stream_options.include_usage`；
        直通时其余字段原样转发，转换到 Anthropic Messages 或 OpenAI Responses 时按文档开头“跨协议兼容”的规则处理。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompatibleRequestBody"
          example:
            model: claude-sonnet
            messages:
              - { role: system, content: You are a helpful assistant. }
              - { role: user, content: 你好 }
            stream: true
            max_tokens: 1024
    OpenAIResponsesRequest:
      required: true
      description: |
        OpenAI Responses 请求体（参见 [官方规范](https://platform.openai.com/docs/api-reference/responses/create)）。
        OmniGate 只解析 `model`（必填）、`stream`、`max_output_tokens`；直通时只改写 `model`，其余字段原样转发，
        转换到 Chat Completions / Anthropic Messages 时按文档开头“跨协议兼容”的规则处理。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompatibleRequestBody"
          example:
            model: gpt-4o
            input: 用一句话介绍 OmniGate
    OpenAIEmbeddingsRequest:
      required: true
      description: |
        OpenAI Embeddings 请求体（参见 [官方规范](https://platform.openai.com/docs/api-reference/embeddings/create)）。
        OmniGate 只解析 `model`（必填），只改写 `model`，其余字段（`input`、`dimensions`、`encoding_format` 等）原样转发；`stream` 被去掉。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompatibleRequestBody"
          example:
            model: text-embedding-3-small
            input: OmniGate 是一个自托管 AI API 网关
    OpenAIImagesGenerationRequest:
      required: true
      description: |
        OpenAI 图片生成请求体（参见 [官方规范](https://platform.openai.com/docs/api-reference/images/create)）。
        OmniGate 只解析 `model`（必填）、`stream`、`n`（预留余额用，缺省 1，限定在 1–100）与 `prompt`（估算文本输入），只改写 `model`，其余字段原样转发。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompatibleRequestBody"
          example:
            model: gpt-image-1
            prompt: 一只在月球上喝咖啡的猫，水彩风格
            n: 1
            size: 1024x1024
    OpenAIImagesMultipartRequest:
      required: true
      description: |
        OpenAI 图片编辑 / 变体请求体（参见 [官方规范](https://platform.openai.com/docs/api-reference/images/createEdit)）。
        `multipart/form-data`：网关只读取文本字段 `model`（必填）、`prompt`、`n`、`stream`（各限 1 MiB），只替换 `model` 的值，
        其余 part（含 `image` / `image[]` / `mask` 文件）连同 part 头原样转发。也接受 `application/json` 请求体（按 JSON 改写 `model` 后转发）。
        请求体上限 64 MiB。
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: true
            required: [model]
            properties:
              model:
                type: string
                description: OmniGate 中的逻辑模型名
              image:
                description: 输入图片（edits 可多张，字段名 `image` 或 `image[]`）
                oneOf:
                  - type: string
                    contentMediaType: application/octet-stream
                  - type: array
                    items:
                      type: string
                      contentMediaType: application/octet-stream
              mask:
                type: string
                contentMediaType: application/octet-stream
                description: 可选的遮罩图片（edits）
              prompt:
                type: string
                description: 提示词（edits 必填，由上游校验）
              n:
                type: string
                description: 图片张数（预留余额时缺省 1，限定在 1–100）
              stream:
                type: string
                description: "`true` 时按 SSE 透传（`gpt-image-*`）"
        application/json:
          schema:
            $ref: "#/components/schemas/CompatibleRequestBody"
          example:
            model: gpt-image-1
            prompt: 把背景换成星空
            images:
              - { image_url: "https://example.com/cat.png" }
    OpenAIAudioUploadRequest:
      required: true
      description: |
        OpenAI 语音转写 / 翻译请求体（参见 [官方规范](https://platform.openai.com/docs/api-reference/audio/createTranscription)）。
        只接受 `multipart/form-data`：网关只读取文本字段 `model`（必填）、`stream`、`prompt`（各限 1 MiB），只替换 `model` 的值，
        其余 part（含 `file`）连同 part 头原样转发。请求体上限 64 MiB。
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: true
            required: [file, model]
            properties:
              file:
                type: string
                contentMediaType: application/octet-stream
                description: 音频文件（flac、mp3、mp4、mpeg、mpga、m4a、ogg、wav、webm 等，由上游校验）
              model:
                type: string
                description: OmniGate 中的逻辑模型名
              language: { type: string }
              prompt: { type: string }
              response_format:
                type: string
                description: "`json`（默认）/ `text` / `srt` / `verbose_json` / `vtt`，响应原样透传"
              temperature: { type: string }
              "timestamp_granularities[]": { type: string, description: "`word` / `segment`，可重复" }
              "include[]": { type: string, description: "如 `logprobs`，可重复" }
              chunking_strategy: { type: string }
              stream:
                type: string
                description: "`true` 时按 SSE 透传（仅转写；`transcript.text.delta` / `transcript.text.done`）"
    OpenAISpeechRequest:
      required: true
      description: |
        OpenAI 语音合成请求体（参见 [官方规范](https://platform.openai.com/docs/api-reference/audio/createSpeech)）。OmniGate 只解析 `model`（必填）、
        `input`（Unicode 字符数用于计费与预留余额）与 `stream_format`，只改写 `model`，其余字段原样转发。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompatibleRequestBody"
          example:
            model: gpt-4o-mini-tts
            input: 你好，欢迎使用 OmniGate。
            voice: alloy
            response_format: mp3
            stream_format: audio
    AnthropicMessagesRequest:
      required: true
      description: |
        Anthropic Messages 请求体（参见 [官方规范](https://docs.anthropic.com/en/api/messages)）。OmniGate 只解析 `model`（必填）、
        `max_tokens`（`/v1/messages` 必填，`count_tokens` 不需要）、`stream`；直通时其余字段原样转发，转换到 OpenAI 时按文档开头“跨协议兼容”的规则处理。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompatibleRequestBody"
          example:
            model: claude-sonnet
            max_tokens: 1024
            system: You are a helpful assistant.
            messages:
              - { role: user, content: 你好 }

  responses:
    RouteValidationFailed:
      description: "`validation_failed`：参数校验失败；或 `route_target_invalid`：目标渠道不存在或不提供规则匹配的模型"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: route_target_invalid
              message: 目标渠道不存在或不提供该模型
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
              details: { "targets[0].channelId": 渠道不存在 }
    Unauthenticated:
      description: "`unauthenticated`：未登录、会话已过期 / 空闲超时 / 被吊销，或账号已停用"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: 需要登录
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    Forbidden:
      description: "`forbidden`：当前角色缺少所需权限"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              $ref: "#/components/examples/ForbiddenError"
    CsrfRejected:
      description: "`csrf_rejected`：缺少 `X-Requested-With: XMLHttpRequest`，或 `Origin` 不在允许列表"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            csrf:
              $ref: "#/components/examples/CsrfError"
    NotFound:
      description: "`not_found`：资源不存在"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: 用户不存在
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    ValidationFailed:
      description: "`validation_failed`：参数校验失败"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_failed
              message: actorId 不是合法的 UUID
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    RateLimited:
      description: "`rate_limited`：请求过于频繁"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: 请求过于频繁，请稍后再试
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    SmtpNotConfigured:
      description: "`smtp_not_configured`：SMTP 未配置（或通知总开关关闭）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: smtp_not_configured
              message: 邮件发送未配置（SMTP），请联系管理员
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    InternalError:
      description: "`internal_error`：服务器内部错误（原因只写入日志，不返回给客户端）"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: 服务器内部错误
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    ForbiddenOrCsrf:
      description: "`forbidden`（缺少所需权限或资源级权限）或 `csrf_rejected`"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              $ref: "#/components/examples/ForbiddenError"
            csrf:
              $ref: "#/components/examples/CsrfError"
    ShareStateConflict:
      description: "`share_state_conflict`：共享状态不符（拒绝已接受的共享请用 `leave`，退出待接受的邀请请用 `decline`）"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: share_state_conflict
              message: 该共享已接受，请使用“退出共享”
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    VersionConflict:
      description: "`version_conflict`：`version` 与当前版本不符"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: version_conflict
              message: 资源已被修改，请刷新后重试
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    ChannelValidationFailed:
      description: |
        `validation_failed`（`details` 给出字段级消息，键如 `name`、`baseUrl`、`models`、`config.headers`、`apiKey`、`sharedWith`、
        `pluginVersionId`、`type`、`pluginConfig.<名称>`、`secrets.<名称>`；
        共享对象不存在时 `details.sharedWith` 为该用户 ID）或 `base_url_not_allowed`（`baseUrl` 指向环回 / 私有地址或 localhost）。
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: 渠道参数校验失败
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
                  details:
                    baseUrl: 必须是 http(s) 绝对地址
                    models: 至少配置一个模型
            baseUrlNotAllowed:
              value:
                error:
                  code: base_url_not_allowed
                  message: 渠道地址指向内网或本机地址，出于安全原因不允许（管理员可开启 OMNIGATE_CHANNELS_ALLOW_PRIVATE_NETWORK）
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    SecretUnavailable:
      description: "`secret_unavailable`：渠道密钥无法解密（例如主密钥已更换且未保留旧密钥），需要重新填写 API Key"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            secretUnavailable:
              $ref: "#/components/examples/SecretUnavailableError"
    PluginBuiltin:
      description: "`plugin_builtin`：内置插件不能编辑、发布或导出（没有源码文件）"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: plugin_builtin
              message: 内置插件不能编辑
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    PluginBindingConflict:
      description: "`plugin_not_approved`（插件版本尚未通过权限审批）或 `plugin_disabled`（插件已停用）"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notApproved:
              value:
                error:
                  code: plugin_not_approved
                  message: 该插件版本尚未通过权限审批
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
            disabled:
              value:
                error:
                  code: plugin_disabled
                  message: 该插件已停用
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    PlanArchived:
      description: "`plan_archived`：套餐已下架（`status=archived`），不能再开通、续期或生成套餐码"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: plan_archived
              message: 套餐已下架，不能再开通
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    LogRangeInvalid:
      description: "`validation_failed`：时间格式非法、`from` 不早于 `to`、跨度超过 92 天，或 UUID 参数非法"
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_failed
              message: 时间范围无效（最长 92 天）
              requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    GatewaySuccess:
      description: |
        成功。非流式时为 JSON 响应：同协议直通时为上游响应原文（`model` 为上游模型名）；跨协议时已转换为入口协议的格式，`model` 为请求中的逻辑模型名。
        `stream: true` 时为 `text/event-stream; charset=utf-8`（带 `Cache-Control: no-cache` 与 `X-Accel-Buffering: no`），逐事件转发 / 转换，
        首个事件到达即开始输出；流开始后发生的上游错误以协议格式的错误事件结束流（HTTP 状态仍为 200）。
        反向代理必须对 `/v1` 关闭响应缓冲，见 `docs/operations/configuration.md`。
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-OmniGate-Compat-Warnings:
          $ref: "#/components/headers/CompatWarnings"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: OpenAI / Anthropic 兼容的响应对象，结构见对应的官方规范。
        text/event-stream:
          schema:
            type: string
            description: |
              Server-Sent Events。OpenAI Chat：`data: {chunk}` … `data: [DONE]`；OpenAI Responses：直通时上游事件原样转发，转换时为网关生成的
              `event: response.created` … `event: response.completed`（或 `response.incomplete`）；Anthropic：`event: message_start` … `event: message_stop`。
          example: |
            data: {"id":"chatcmpl-1","object":"chat.completion.chunk","model":"claude-sonnet","choices":[{"index":0,"delta":{"content":"你好"}}]}

            data: [DONE]
    ImageSuccess:
      description: |
        成功（Round 6 续）。非流式时为上游 JSON 响应原文（`created`、`data[]`（`b64_json` 或 `url`）、`usage` 等，结构见官方规范），
        图片张数按 `data` 数组长度计。`stream: true` 且上游返回 SSE 时为 `text/event-stream; charset=utf-8`，逐字节透传上游事件；
        上游对流式请求返回 JSON 时按非流式响应返回。
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: OpenAI 兼容的图片响应对象，结构见官方规范。
          example:
            created: 1791446400
            data:
              - { b64_json: iVBORw0KGgoAAAANSUhEUgAA… }
            usage:
              input_tokens: 50
              output_tokens: 4160
              total_tokens: 4210
              input_tokens_details: { text_tokens: 50, image_tokens: 0 }
        text/event-stream:
          schema:
            type: string
            description: |
              Server-Sent Events，原样透传：`image_generation.partial_image` / `image_generation.completed`（生成）、
              `image_edit.partial_image` / `image_edit.completed`（编辑）。图片张数 = `*.completed` 事件数，用量取完成事件中的 `usage`。
          example: |
            event: image_generation.partial_image
            data: {"type":"image_generation.partial_image","b64_json":"…","partial_image_index":0}

            event: image_generation.completed
            data: {"type":"image_generation.completed","b64_json":"…","usage":{"input_tokens":50,"output_tokens":4160,"total_tokens":4210}}
    AudioTextSuccess:
      description: |
        成功（Round 6 续）。上游响应原样返回，`Content-Type` 透传：`json` / `verbose_json` 为 JSON（可能带 `usage`），`text` / `srt` / `vtt` 为文本；
        `stream: true` 且上游返回 SSE 时为 `text/event-stream; charset=utf-8`，原样透传 `transcript.text.delta` / `transcript.text.done`。
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          example:
            text: 你好，世界
            usage: { type: tokens, input_tokens: 100, output_tokens: 20, total_tokens: 120, input_token_details: { audio_tokens: 90, text_tokens: 10 } }
        text/plain:
          schema:
            type: string
          example: |
            你好，世界
        text/event-stream:
          schema:
            type: string
          example: |
            event: transcript.text.delta
            data: {"type":"transcript.text.delta","delta":"你好"}

            event: transcript.text.done
            data: {"type":"transcript.text.done","text":"你好","usage":{"type":"tokens","input_tokens":14,"output_tokens":4,"total_tokens":18}}
    SpeechSuccess:
      description: |
        成功（Round 6 续）。二进制音频（`Content-Type` 透传，如 `audio/mpeg`、`audio/wav`、`audio/opus`），边收边发；
        `stream_format: "sse"` 时为 `text/event-stream; charset=utf-8`，原样透传 `speech.audio.delta` / `speech.audio.done`。
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        audio/mpeg:
          schema:
            type: string
            contentMediaType: audio/mpeg
        text/event-stream:
          schema:
            type: string
          example: |
            event: speech.audio.delta
            data: {"type":"speech.audio.delta","audio":"…"}

            event: speech.audio.done
            data: {"type":"speech.audio.done","usage":{"input_tokens":10,"output_tokens":500,"total_tokens":510}}
    GatewayError:
      description: 数据面错误（OpenAI 或 Anthropic 格式，取决于是否带 `anthropic-version` 头）
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/OpenAIError"
              - $ref: "#/components/schemas/AnthropicError"
          examples:
            openai:
              value:
                error:
                  message: invalid or missing OmniGate API key
                  type: invalid_request_error
                  param: null
                  code: invalid_api_key
            anthropic:
              value:
                type: error
                error:
                  type: authentication_error
                  message: invalid or missing OmniGate API key
    OpenAIErrorResponse:
      description: 数据面错误（OpenAI 格式），类别与状态映射见文档开头的表格
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          examples:
            unsupportedParameter:
              value:
                error:
                  message: 以下字段无法转换为 anthropic.messages 协议：logit_bias, seed（可将 Key 的兼容模式设为 lenient 以丢弃这些字段）
                  type: invalid_request_error
                  param: null
                  code: unsupported_parameter
            insufficientBalance:
              value:
                error:
                  message: insufficient balance; please top up or redeem a code
                  type: insufficient_quota
                  param: null
                  code: insufficient_balance
            bodyTooLarge:
              value:
                error:
                  message: request body exceeds 33554432 bytes
                  type: invalid_request_error
                  param: null
                  code: invalid_request
            accountDisabled:
              summary: account_disabled（403，Round 6 续）
              value:
                error:
                  message: "account disabled: 违反使用条款 (until 2026-10-15T00:00:00Z)"
                  type: invalid_request_error
                  param: null
                  code: account_disabled
    OpenAIRateLimitedResponse:
      description: |
        429（OpenAI 格式）：`rate_limited`（Key 的 RPM）、`upstream_rate_limited`（所有可用渠道均被上游限流）、
        `quota_exceeded`（套餐配额已用完、可在 `Retry-After` 秒后重试）或 `quota_exhausted`（套餐额度在订阅到期前不会恢复，不带 `Retry-After`）。
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          examples:
            quotaExceeded:
              summary: quota_exceeded（带 Retry-After）
              value:
                error:
                  message: 套餐「Pro 月卡」的「5 小时窗口」额度已用完，将于 18:30 UTC 重置
                  type: insufficient_quota
                  param: null
                  code: quota_exceeded
            quotaExhausted:
              summary: quota_exhausted（不带 Retry-After）
              value:
                error:
                  message: 套餐「体验包」的「总额度」额度已用完
                  type: insufficient_quota
                  param: null
                  code: quota_exhausted
            rateLimited:
              value:
                error:
                  message: API key rate limit (RPM) exceeded
                  type: rate_limit_exceeded
                  param: null
                  code: rate_limited
    AnthropicRateLimitedResponse:
      description: |
        429（Anthropic 格式，`error.type` 均为 `rate_limit_error`）：`rate_limited` / `upstream_rate_limited` / `quota_exceeded`（带 `Retry-After`）/
        `quota_exhausted`（不带 `Retry-After`）。Anthropic 格式不含错误码，可按消息与 `Retry-After` 头区分。
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnthropicError"
          example:
            type: error
            error:
              type: rate_limit_error
              message: 套餐「Pro 月卡」的「每周」额度已用完，将于 10-12 00:00 CST 重置
    AnthropicErrorResponse:
      description: 数据面错误（Anthropic 格式），类别与状态映射见文档开头的表格
      headers:
        X-OmniGate-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnthropicError"
          examples:
            modelNotFound:
              value:
                type: error
                error:
                  type: not_found_error
                  message: model "claude-opus" is not available for this API key
            insufficientBalance:
              value:
                type: error
                error:
                  type: permission_error
                  message: insufficient balance; please top up or redeem a code
            upstreamUnavailable:
              value:
                type: error
                error:
                  type: overloaded_error
                  message: "upstream: Overloaded"
            accountDisabled:
              summary: account_disabled（403，Round 6 续）
              value:
                type: error
                error:
                  type: permission_error
                  message: "account disabled: 违反使用条款"

  examples:
    ForbiddenError:
      value:
        error:
          code: forbidden
          message: 没有执行此操作的权限
          requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    CsrfError:
      value:
        error:
          code: csrf_rejected
          message: 缺少 CSRF 防护请求头
          requestId: 0192f0c4-7000-7abc-8def-0123456789ab
    SecretUnavailableError:
      value:
        error:
          code: secret_unavailable
          message: 渠道密钥无法读取（可能主密钥已更换），请重新填写 API Key
          requestId: 0192f0c4-7000-7abc-8def-0123456789ab

  schemas:
    Error:
      type: object
      description: 控制面统一错误信封。`message` 为可展示给用户的中文文案，不含敏感信息。
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            requestId:
              type: string
              description: 与响应头 `X-OmniGate-Request-Id` 相同
            details:
              type: object
              description: 可选的字段级详情（例如 `{"version":"必填"}`）；无详情时省略该字段。
              additionalProperties: true

    ErrorCode:
      type: string
      description: |
        稳定的机器可读控制面错误码。HTTP 状态映射：validation_failed/base_url_not_allowed/redeem_invalid/plugin_build_failed→422，unauthenticated→401，
        forbidden/csrf_rejected/capability_forbidden→403，not_found/capability_not_found→404，version_conflict/last_admin/cannot_disable_self/identity_conflict/secret_unavailable/
        redeem_batch_disabled/redeem_not_started/redeem_expired/redeem_used_up/redeem_user_limit/plugin_exists/plugin_builtin/plugin_version_exists/
        plugin_not_approved/plugin_disabled/plugin_in_use/not_pending/plan_archived/plan_in_use/subscription_not_active→409，rate_limited→429，
        upstream_error→502，internal_error→500。
        后续版本可能新增错误码，客户端应按 HTTP 状态兜底。
        - `base_url_not_allowed`：渠道 `baseUrl` 指向环回 / 私有地址或 localhost（见 `OMNIGATE_CHANNELS_ALLOW_PRIVATE_NETWORK`）。
        - `secret_unavailable`：渠道密钥无法用当前主密钥解密，需要重新填写 API Key。
        - `upstream_error`：发现模型时上游请求失败（`message` 为脱敏原因）。
        - `redeem_*`：兑换码不可用的具体原因，见 `POST /api/billing/redeem`。
        - `plugin_exists`：插件 ID（manifest `id`）已存在。
        - `plugin_builtin`：内置插件不能编辑、发布、导出或停用；内置与随附（`bundled`）插件不能删除。
        - `plugin_in_use`：删除插件时仍有渠道固定到它的版本，`details.channels` 为渠道数量。
        - `plugin_build_failed`：发布时编译或校验未通过，`details.diagnostics` 为 `Diagnostic` 数组。
        - `plugin_version_exists`：发布的版本号不大于该插件已发布的最大版本。
        - `plugin_not_approved`：渠道要固定到的插件版本尚未批准（待审批或已拒绝）。
        - `plugin_disabled`：插件已停用（不能绑定新渠道、不能手动执行能力）。
        - `not_pending`：审批的版本不处于待审批状态。
        - `capability_not_found`：渠道没有（非内置）插件，或插件没有声明该能力。
        - `capability_forbidden`：该能力没有声明 `userTriggerable`，不能手动触发。
        - `plan_archived`：套餐已下架，不能开通、续期（含兑换套餐码）或生成新的套餐码批次。
        - `plan_in_use`：预留，当前版本不会返回（套餐不支持删除，只能下架）。
        - `subscription_not_active`：取消的订阅已过期或已取消。
        - `cannot_disable_self`：停用或强制下线自己的账号（含批量操作中的单项，Round 6 续）；`last_admin`：降级或停用最后一位启用状态的系统管理员。
        - `smtp_not_configured`（409）：SMTP 未配置（或通知总开关关闭），见邮箱验证与 `smtp-test`。
        - `verification_invalid` / `verification_expired`（422）：通知邮箱验证码错误 / 过期、已使用或不存在。
        - `email_send_failed`（502）：验证码邮件发送失败。`invalid_token`（422）：退订令牌无效。
        - `group_is_default`（409）：默认用户组不能删除；`group_name_exists`（409）：用户组名称已存在（Round 6）。
        - `share_state_conflict`（409）：渠道共享状态不符（拒绝已接受的共享 / 退出待接受的邀请，`docs/contracts/phase5-api.md` §5.3）。
        - `route_target_invalid`（422）：路由规则的目标渠道不存在，或不提供规则匹配的任何模型；`details` 的键为 `targets[i].channelId`。
        - 网关的 `quota_exceeded` / `quota_exhausted` / `account_disabled` / `user_request_limit` / `spend_limit_exceeded` 是数据面错误类别（`GatewayErrorClass`），不是控制面错误码
          （`account_disabled` 同时是登录重定向的 `LoginErrorCode`）。
      enum:
        - validation_failed
        - unauthenticated
        - forbidden
        - csrf_rejected
        - not_found
        - version_conflict
        - last_admin
        - cannot_disable_self
        - identity_conflict
        - rate_limited
        - internal_error
        - base_url_not_allowed
        - secret_unavailable
        - upstream_error
        - redeem_invalid
        - redeem_batch_disabled
        - redeem_not_started
        - redeem_expired
        - redeem_used_up
        - redeem_user_limit
        - plugin_exists
        - plugin_builtin
        - plugin_build_failed
        - plugin_version_exists
        - plugin_not_approved
        - plugin_disabled
        - not_pending
        - capability_not_found
        - capability_forbidden
        - plugin_in_use
        - plan_archived
        - plan_in_use
        - subscription_not_active
        - route_target_invalid
        - smtp_not_configured
        - verification_invalid
        - verification_expired
        - email_send_failed
        - invalid_token
        - group_is_default
        - group_name_exists
        - share_state_conflict

    LoginErrorCode:
      type: string
      description: |
        登录失败时重定向到 `/login?error=<code>` 的取值：
        - `state_mismatch`：state Cookie 缺失、无法解密、超过 10 分钟或与回调参数不符（常见于重复点击回调、跨浏览器、服务重启且未配置主密钥）。
        - `oauth_failed`：身份提供方返回错误、换取令牌 / 校验 id_token 失败、构造授权地址失败或其他内部错误。
        - `unknown_provider`：未配置该登录方式。
        - `rate_limited`：登录或回调被限流。
        - `registration_closed`：注册模式为 closed，且该身份未关联任何账号。
        - `not_allowed`：注册模式为 restricted，且该身份不在允许名单 / 允许的邮箱域名内。
        - `account_disabled`：该身份关联的账号已被停用。Round 6 续起重定向另带 `reason`（URL 编码的停用原因，空格为 `%20`，没有原因时省略）
          与 `until`（RFC 3339 UTC 到期时间，永久停用时省略），登录页据此显示原因与恢复时间。
      enum:
        - unknown_provider
        - state_mismatch
        - oauth_failed
        - rate_limited
        - registration_closed
        - not_allowed
        - account_disabled

    MigrationStatus:
      type: object
      required: [current, latest, pending]
      properties:
        current:
          type: integer
          format: int64
          description: 数据库当前 schema 版本
        latest:
          type: integer
          format: int64
          description: 二进制内嵌的最新迁移版本
        pending:
          type: integer
          description: 待执行的迁移数量

    Currency:
      type: object
      description: 部署级结算币种（ADR-0006），首次启动时写入 `system_settings`（key `billing.currency`）后锁定。
      required: [code, symbol, decimals]
      properties:
        code:
          type: string
          description: ISO 4217 代码（大写）
          example: USD
        symbol:
          type: string
          description: 内置币种（USD/CNY/EUR/GBP/JPY/HKD/SGD）有固定符号；其他代码为 "<CODE> "（带尾随空格）。
          example: $
        decimals:
          type: integer
          description: 展示用小数位（JPY 为 0，其余为 2）
          example: 2

    SystemInfo:
      type: object
      required: [name, version, currency, registrationMode, siteName, announcement, landingEnabled, docsUrl, publicModelPlaza]
      properties:
        name:
          type: string
          const: OmniGate
        version:
          type: string
          description: 构建时注入的版本号；未注入时为 `dev`
        currency:
          $ref: "#/components/schemas/Currency"
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
          description: 当前生效的注册模式（系统设置 `auth.registrationMode`，未设置时取 `OMNIGATE_REGISTRATION_MODE`）
        siteName:
          type: string
          description: 系统设置 `site.name`（默认 `OmniGate`）
        announcement:
          type: string
          description: 系统设置 `site.announcement`；空 = 不显示公告
        landingEnabled:
          type: boolean
          description: 系统设置 `site.landingEnabled`；false 时访问 `/` 直接进入控制台
        docsUrl:
          type: string
          description: 系统设置 `site.docsUrl`；空或 http(s) URL
        publicModelPlaza:
          type: boolean
          description: 系统设置 `site.publicModelPlaza`；true 时未登录也可访问 `GET /api/plaza/models`（落地页 `/models`）

    RegistrationMode:
      type: string
      description: open = 任何通过认证的身份均可注册；restricted = 仅引导管理员与允许名单 / 邮箱域名；closed = 仅已关联账号的身份可登录。
      enum: [open, restricted, closed]

    AuthProvider:
      type: object
      required: [id, type, displayName]
      properties:
        id:
          type: string
          description: 用于 `/api/auth/{provider}/login` 的 ID
        type:
          type: string
          enum: [github, oidc]
        displayName:
          type: string

    Role:
      type: string
      enum: [system_admin, channel_admin, user, auditor]

    UserStatus:
      type: string
      enum: [active, disabled]

    Permission:
      type: string
      enum:
        - users.read
        - users.write
        - audit.read
        - settings.read
        - settings.write
        - channels.read
        - channels.write
        - channels.manage
        - models.manage
        - routes.manage
        - keys.own
        - plugins.read
        - plugins.manage
        - plugins.trust
        - billing.own
        - billing.manage
        - stats.own
        - stats.all

    Identity:
      type: object
      description: 已关联的外部账号。提供方侧的不可变 subject（GitHub 数字 ID / OIDC sub）不对外返回。
      required: [provider, login, email]
      properties:
        provider:
          type: string
          description: "`github` 或 OIDC 提供方 ID"
        login:
          type: [string, "null"]
          description: 可变的用户名（GitHub login / OIDC preferred_username），每次登录时刷新，仅用于展示
        email:
          type: [string, "null"]
          description: 该提供方返回的邮箱（小写；GitHub 只取已验证的主邮箱）

    User:
      type: object
      required: [id, displayName, email, avatarUrl, role, status, disabledReason, disabledUntil, version, createdAt, lastLoginAt, identities]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          description: 首次登录时取提供方的 name / login / email，均为空时为 `user-<id 前 8 位>`
        email:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        disabledReason:
          type: [string, "null"]
          maxLength: 200
          description: 停用原因（Round 6 续）；启用状态为 null
        disabledUntil:
          type: [string, "null"]
          format: date-time
          description: |
            停用到期时间（RFC 3339 UTC，Round 6 续）；到期后每分钟运行的后台任务自动启用该用户（审计 `user.auto_enable`），
            到期后、任务运行前登录与 API Key 已按启用处理。永久停用或启用状态为 null
        version:
          type: integer
          description: 乐观锁版本号，`PATCH /api/admin/users/{id}` 时必须回传
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        group:
          description: 所在用户组（Round 6，`docs/contracts/phase8-api.md` §1.3）；只有绕过应用写入、尚未归组的行才为 null
          oneOf:
            - $ref: "#/components/schemas/GroupRef"
            - type: "null"

    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    GroupLimits:
      type: object
      additionalProperties: false
      description: 用户组成员的每用户限额（Round 6）；null = 不限。消费金额只统计平台渠道由钱包支付的计费金额（结算币种）。
      properties:
        rpm:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000000
          description: 每个用户每分钟最多请求数（所有 Key 合计；每个实例进程内的令牌桶，多实例时为每实例上限）
        rpd:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000000
          description: 每个用户每天最多请求数（按组的 timezone 计日）
        dailySpend:
          description: 每个用户每天最多消费；`"0"` = 禁止使用平台渠道
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        monthlySpend:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"

    UserGroup:
      type: object
      description: 用户组（`docs/contracts/phase8-api.md` §1）。每个用户属于恰好一个组；有且只有一个默认组（新用户加入它）。
      required: [id, name, description, priceMultiplier, limits, timezone, isDefault, members, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, maxLength: 200 }
        priceMultiplier:
          type: string
          description: 平台渠道售价倍率，十进制 0–100（`"0"` = 平台渠道免费，`"0.8"` = 八折）
          example: "0.8"
        limits:
          $ref: "#/components/schemas/GroupLimits"
        timezone:
          type: string
          description: IANA 时区，用于日 / 月 / 周边界
          example: Asia/Shanghai
        isDefault: { type: boolean }
        members: { type: integer, description: 只读成员数 }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserGroupInput:
      type: object
      description: |
        创建 / 修改用户组。`name` 去除首尾空白后 1–50 个字符、唯一（`409 group_name_exists`）；`description` ≤ 200；
        `priceMultiplier` 为 0–100 的十进制（字符串或数字，最多 9 位小数，默认 `"1"`）；`limits` 整体替换，金额可为字符串或数字，
        `null` / `""` = 不限；`timezone` 为 IANA 名称（默认 `Asia/Shanghai`，不接受 `Local`）。
        校验失败 → `422`，`details` 键为 `name`、`description`、`priceMultiplier`、`limits.rpm`、`limits.rpd`、`limits.dailySpend`、
        `limits.monthlySpend`、`timezone`、`isDefault`、`version`。响应中的只读字段（`id`、`members`、`createdAt`、`updatedAt`）可以原样回传（被忽略）。
      properties:
        name: { type: string }
        description: { type: string }
        priceMultiplier:
          type: [string, number]
        limits:
          type: object
          properties:
            rpm: { type: [integer, "null"] }
            rpd: { type: [integer, "null"] }
            dailySpend: { type: [string, number, "null"] }
            monthlySpend: { type: [string, number, "null"] }
        timezone: { type: string }
        isDefault: { type: boolean }

    MyGroup:
      type: object
      description: 当前用户所在组（`/api/me` 的 `group`，Round 6）
      required: [id, name, priceMultiplier, limits, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        priceMultiplier: { type: string }
        limits:
          $ref: "#/components/schemas/GroupLimits"
        timezone: { type: string }

    SpendLimit:
      type: object
      additionalProperties: false
      required: [amount, window]
      properties:
        amount:
          type: string
          description: 上限金额（结算币种，不小于 0，最多 9 位小数；保存时规范化）
          example: "20"
        window:
          type: string
          enum: [day, week, month, total]
          description: 统计窗口（按 Key 所有者所在组的 timezone；周从周一开始；`total` = 累计、不重置）

    BillingLimits:
      type: object
      required: [group, usage, keys]
      properties:
        group:
          type: object
          description: 所在组与其限额（限额字段与 `GroupLimits` 相同，平铺在组对象上）
          required: [id, name, priceMultiplier, timezone, rpm, rpd, dailySpend, monthlySpend]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            priceMultiplier: { type: string }
            timezone: { type: string }
            rpm: { type: [integer, "null"] }
            rpd: { type: [integer, "null"] }
            dailySpend:
              oneOf:
                - $ref: "#/components/schemas/Money"
                - type: "null"
            monthlySpend:
              oneOf:
                - $ref: "#/components/schemas/Money"
                - type: "null"
        usage:
          type: object
          required: [rpdUsed, dailySpent, monthlySpent, resetsAt]
          properties:
            rpdUsed: { type: integer, description: 今日已计入 `rpd` 的请求数 }
            dailySpent: { $ref: "#/components/schemas/Money" }
            monthlySpent: { $ref: "#/components/schemas/Money" }
            resetsAt:
              type: object
              required: [day, month]
              properties:
                day: { type: string, format: date-time, description: 组时区的次日零点（UTC） }
                month: { type: string, format: date-time, description: 组时区的下月 1 日零点（UTC） }
        keys:
          type: array
          description: 当前用户未吊销的全部 Key（新的在前）
          items:
            type: object
            required: [id, name, spendLimit, spent, resetsAt]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              spendLimit:
                oneOf:
                  - $ref: "#/components/schemas/SpendLimit"
                  - type: "null"
              spent:
                description: 消费上限当前窗口的已用金额；没有上限时为 null
                oneOf:
                  - $ref: "#/components/schemas/Money"
                  - type: "null"
              resetsAt:
                type: [string, "null"]
                format: date-time
                description: 当前窗口结束时间；没有上限或 `total` 窗口为 null

    PatchUserRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: "`role` 与 `status` 至少提供一个。"
      properties:
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        disabledReason:
          type: [string, "null"]
          maxLength: 200
          description: |
            停用原因（Round 6 续）：`status: disabled` 时必填（去除首尾空白后 1–200 个字符，`422 details.disabledReason`）；
            不是停用时只能省略、为 null 或空字符串
        disabledUntil:
          type: [string, "null"]
          format: date-time
          description: |
            停用到期时间（Round 6 续）：必须晚于当前时间（`422 details.disabledUntil`），到期自动启用；省略或 null = 永久停用。
            只能与 `status: disabled` 一起提供
        version:
          type: integer
          description: 必须等于用户当前 `version`

    IdentityDetail:
      type: object
      description: 用户详情中的外部身份（含提供方侧的不可变 `subject`，仅管理员详情接口返回）
      required: [provider, subject, email, createdAt]
      properties:
        provider:
          type: string
          description: "`github` 或 OIDC 提供方 ID"
        subject:
          type: string
          description: 提供方侧的不可变 ID（GitHub 数字 ID / OIDC sub）
        email:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
          description: 关联时间

    UserKeySummary:
      type: object
      description: 用户详情中的 Gateway Key 摘要（不含策略）
      required: [id, name, prefix, status, lastUsedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          example: og-AbCdEfGhI…
        status:
          type: string
          enum: [enabled, disabled]
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    AdminUserDetail:
      type: object
      description: "`GET /api/admin/users/{id}` 的响应（Round 6 续，`docs/contracts/phase7-api.md` §2.2）"
      required: [user, identities, wallet, subscriptions, keys, sessions, usage30d, channels]
      properties:
        user:
          $ref: "#/components/schemas/User"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/IdentityDetail"
        wallet:
          type: [object, "null"]
          description: 钱包余额与预留额；用户还没有钱包记录时为 null
          required: [balance, reserved]
          properties:
            balance:
              $ref: "#/components/schemas/Money"
            reserved:
              $ref: "#/components/schemas/Money"
        subscriptions:
          type: array
          maxItems: 20
          description: 最近 20 份订阅（任意状态，按创建时间倒序），带各规则当前用量
          items:
            $ref: "#/components/schemas/Subscription"
        keys:
          type: array
          description: 未吊销的 Gateway Key，按创建时间倒序
          items:
            $ref: "#/components/schemas/UserKeySummary"
        sessions:
          type: object
          required: [active]
          properties:
            active:
              type: integer
              minimum: 0
              description: 有效会话数（未吊销、未过期且未超过空闲超时）
        usage30d:
          type: object
          required: [requests, charge, tokens]
          description: 最近 30 天（按请求开始时间）的用量
          properties:
            requests:
              type: integer
              format: int64
              description: 请求数（含失败请求）
            charge:
              $ref: "#/components/schemas/Money"
              description: 钱包扣费合计（请求日志 `charge` 之和）
            tokens:
              type: integer
              format: int64
              description: 输入 + 输出 + 缓存读 + 缓存写 token 之和
        channels:
          type: object
          required: [own]
          properties:
            own:
              type: integer
              minimum: 0
              description: 该用户拥有的渠道数

    UserBatchRequest:
      type: object
      additionalProperties: false
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          description: 用户 ID（非法 UUID 不会导致整体失败，而是该项以 `not_found` 失败；重复的只处理一次）
          items:
            type: string
        action:
          type: string
          enum: [disable, enable, logout, set_group]
        groupId:
          type: [string, "null"]
          format: uuid
          description: "`set_group` 的目标用户组（Round 6），必填且必须存在（否则 `422 details.groupId`）；其他操作忽略"
        reason:
          type: [string, "null"]
          maxLength: 200
          description: 停用原因，`disable` 时必填（去除首尾空白后 1–200 个字符）；其他操作忽略
        until:
          type: [string, "null"]
          format: date-time
          description: 停用到期时间（`disable`，必须晚于当前时间）；省略或 null = 永久；其他操作忽略

    UserBatchResult:
      type: object
      required: [succeeded, failed]
      properties:
        succeeded:
          type: array
          description: 成功的用户 ID（按请求中的顺序）
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            required: [id, code, message]
            properties:
              id:
                type: string
                description: 请求中的原始 ID
              code:
                type: string
                description: "`not_found` / `cannot_disable_self` / `last_admin`，内部错误为 `internal_error`"
                example: cannot_disable_self
              message:
                type: string

    Session:
      type: object
      required: [id, createdAt, lastSeenAt, expiresAt, userAgent, ipPrefix, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: 最近活动时间（每分钟最多更新一次）
        expiresAt:
          type: string
          format: date-time
          description: 绝对过期时间（创建时间 + OMNIGATE_SESSION_TTL）
        userAgent:
          type: string
          description: 登录时的 User-Agent（截断至 512 字节）
        ipPrefix:
          type: string
          description: 登录时客户端 IP 的前缀（IPv4 /24、IPv6 /48），不存储完整 IP
          example: 203.0.113.0/24
        current:
          type: boolean
          description: 是否为发起本请求的会话

    AuditAction:
      type: string
      description: 已使用的审计动作（稳定，供告警 / 看板使用；后续版本会新增）。`GET /api/admin/audit-logs` 的 `action` 参数按字符串精确匹配，不校验取值。
      enum:
        - auth.login
        - auth.login_denied
        - auth.logout
        - auth.session_revoke
        - auth.session_revoke_others
        - user.create
        - user.update
        - channel.create
        - channel.update
        - channel.delete
        - key.create
        - key.update
        - key.revoke
        - key.rotate
        - price.create
        - billing.redeem
        - billing.batch_create
        - billing.batch_update
        - billing.wallet_adjust
        - billing.settings_update
        - plugin.create
        - plugin.import
        - plugin.draft_update
        - plugin.publish
        - plugin.approve
        - plugin.reject
        - plugin.update
        - plugin.auto_disabled
        - plugin.delete
        - channel.plugin_upgrade
        - capability.invoke
        - plan.create
        - plan.update
        - subscription.grant
        - subscription.renew
        - subscription.cancel
        - billing.preferences
        - billing.signup_credit
        - route.create
        - route.update
        - route.delete
        - route.reorder
        - settings.update
        - model_info.update
        - model_info.delete
        - user.logout
        - user.keys_disable
        - user.batch
        - user.auto_enable
        - subscription.quota_reset
        - subscription.extend
        - reset_card.issue
        - reset_card.revoke
        - reset_card.use

    AuditEntry:
      type: object
      required: [id, actorId, actorName, action, resourceType, resourceId, ipPrefix, requestId, metadata, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: [string, "null"]
          format: uuid
          description: 操作者用户 ID；`auth.login_denied` 时为 null
        actorName:
          type: [string, "null"]
          description: 操作时的操作者显示名快照
        action:
          $ref: "#/components/schemas/AuditAction"
        resourceType:
          type: string
          description: 资源类型，如 `user`、`session`、`identity`、`channel`、`gateway_key`、`price`、`redeem_batch`、`redeem_code`、`wallet`、`system_setting`、`plugin`、`plan`、`subscription`
        resourceId:
          type: [string, "null"]
          description: 资源 ID；`auth.login_denied` 时为 `<provider>:<subject>`；`plugin.auto_disabled` 的 `actorId` / `actorName` 为 null（系统触发）
        ipPrefix:
          type: string
          description: 客户端 IP 前缀（/24 或 /48），可能为空字符串
        requestId:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: |
            动作相关的附加信息（不含任何密钥）。例如 `user.create`：`{provider, login, role}`；`auth.login`：`{provider, login}`；
            `auth.login_denied`：`{reason, login}`；`user.update`：`{before:{role,status}, after:{role,status}}`；
            `auth.session_revoke_others`：`{revoked}`；`channel.create`：`{name, type, scope}`；`channel.update`：`{name, changed}`；
            `key.*`：`{name, prefix}`（`key.rotate` 另有 `rotatedFrom`）；`price.create`：`{kind, model, inputPerM, outputPerM, effectiveAt}`；
            `billing.redeem`：`{batchId, codePrefix, amount, redemptionId, ledgerEntryId}`；`billing.wallet_adjust`：`{userId, amount, balanceBefore,
            balanceAfter, note, ledgerEntryId}`；`billing.settings_update` / `billing.batch_update`：`{before, after}`。
        createdAt:
          type: string
          format: date-time

    ListMeta:
      type: object
      description: 统一分页信封（`httpx.List`）的元数据部分。
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          description: 满足过滤条件的总条数
        page:
          type: integer
        pageSize:
          type: integer

    UserList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"

    AuditLogList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"

    OpenAIError:
      type: object
      description: 数据面 OpenAI 格式错误信封（不含请求 ID，请读取响应头 `X-OmniGate-Request-Id`）。
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, param, code]
          properties:
            message:
              type: string
            type:
              type: string
              enum: [invalid_request_error, insufficient_quota, rate_limit_exceeded, server_error]
            param:
              type: "null"
            code:
              type: string
              description: 认证失败为 `invalid_api_key`，权限不足为 `permission_denied`，其余为错误类别名（见 `GatewayErrorClass`，如所属用户被停用为 `account_disabled`）
              example: model_not_found

    AnthropicError:
      type: object
      description: 数据面 Anthropic 格式错误信封（不含请求 ID，请读取响应头 `X-OmniGate-Request-Id`）。
      required: [type, error]
      properties:
        type:
          type: string
          const: error
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum: [invalid_request_error, authentication_error, permission_error, not_found_error, rate_limit_error, overloaded_error, api_error]
            message:
              type: string

    Money:
      type: string
      description: 金额（结算币种的十进制字符串，最多 9 位小数，去掉末尾的 0；可能为负）。
      pattern: "^-?[0-9]+(\\.[0-9]{1,9})?$"
      example: "12.5"

    MoneyInput:
      type: string
      description: 输入金额：十进制字符串，可带 `+`/`-` 号，最多 9 位小数（如 `"10"`、`"0.000002"`、`"-2.5"`）。不接受 JSON 数字。
      example: "10"

    ChannelSharing:
      type: object
      additionalProperties: false
      description: |
        渠道的共享对象（`docs/contracts/phase8-api.md` §1.2）：指定用户与指定用户组（组的全部成员都可以使用该渠道）。
        档位判定不变：取决于渠道所有者的角色（管理员的渠道对被共享者是 platform 档，普通用户的渠道是 shared 档）。
        `scope` 不为 `shared` 时两个数组都为空。
        安全修订（`docs/contracts/phase5-api.md` §5）：`users` 是**邀请**的用户（待接受 + 已接受，不含已拒绝的），只有接受后才能使用，
        逐个状态见 `Channel.shares`；`groups` 只有持有 `channels.manage` 的调用者可以添加，不需要接受。所有者被停用时全部共享暂停生效。
      required: [users, groups]
      properties:
        users:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
        groups:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }

    Scope:
      type: string
      description: private = 仅所有者；shared = 所有者 + `sharedWith` 中已接受共享的用户与用户组成员；global = 所有用户（发布需要 `channels.manage`）。共享只授予“使用”权限。
      enum: [private, shared, global]

    ChannelType:
      type: string
      description: |
        `openai`：OpenAI 兼容上游，默认使用 Chat Completions；按模型映射的 `upstreamProtocol` 或 `config.supportsResponses` 使用 Responses，
        `/v1/embeddings` 只路由到此类渠道。`baseUrl` 含版本路径（如 `https://api.openai.com/v1`），请求拼接 `/chat/completions`、`/responses`、
        `/embeddings`、`/models`；`anthropic`：Anthropic Messages，`baseUrl` 不含版本（如 `https://api.anthropic.com`），请求拼接 `/v1/messages`、`/v1/models`；
        `custom`（Round 6 续）：由 `protocol: custom` 的插件实现上游协议，类型随插件版本确定、不能直接指定（没有插件时 `422`），只服务
        Chat Completions、Messages、Responses 客户端；“测试连接”与“发现模型”执行插件的 `health.check` / `models.list` 能力。
      enum: [openai, anthropic, custom]

    ChannelStatus:
      type: string
      enum: [enabled, disabled]

    ModelMap:
      type: object
      required: [model, upstreamModel]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
          description: 对外的逻辑模型名（客户端请求中的 `model`），同一渠道内唯一
        upstreamModel:
          type: string
          maxLength: 128
          description: 发给上游的模型名；输入时省略或为空则等于 `model`
        upstreamProtocol:
          type: string
          const: responses
          description: |
            该模型使用的上游协议（Round 4，仅对 `openai` 渠道生效）。只在为 `responses` 时出现：该模型的所有请求（Chat / Messages / Responses 客户端）
            都以 OpenAI Responses 协议发送到 `{baseUrl}/responses`。省略表示 Chat Completions（默认；输入的 `"chat"` 会被规范化为省略）。

    ModelMapInput:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
          description: 逻辑模型名（去除首尾空白）
        upstreamModel:
          type: string
          maxLength: 128
          description: 上游模型名；省略或为空则等于 `model`
        upstreamProtocol:
          type: string
          enum: ["", chat, responses]
          description: |
            上游协议（仅 `openai` 渠道有意义）：省略、`""` 或 `chat` = Chat Completions（保存为空，响应中省略）；`responses` = 该模型总是使用
            OpenAI Responses（适用于只支持 Responses 的模型）。其他值 → `422`，`details.models` 为“模型 "<name>" 的 upstreamProtocol 只能是 chat 或 responses”；非 `openai` 渠道设置 `responses` 也返回 `422`。
            anthropic 渠道上该字段会被保存但不生效（总是 Messages）。

    ChannelConfig:
      type: object
      additionalProperties: false
      description: 渠道高级配置。值为默认（false / 0 / 空）的字段在响应中省略。PATCH 时整体替换。
      properties:
        headers:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
          description: |
            附加到每个上游请求的请求头（最多 20 个）。名称只能包含字母、数字、`-`、`_`，最长 64；值不能含换行。
            禁止：`Authorization`、`x-api-key`、`Host`、`Content-Length`、`Content-Type`、`Accept-Encoding`、`Connection`、`Transfer-Encoding`、
            `Cookie`、`TE`、`Upgrade`、`Keep-Alive`、`Proxy-Authorization`、`Proxy-Connection`（不区分大小写）。
        supportsResponses:
          type: boolean
          description: |
            仅 openai 渠道有意义：上游实现了 `/responses` 时开启，`/v1/responses` 请求以 Responses 协议直通到该渠道；
            未开启时 `/v1/responses` 请求被转换为 Chat Completions。其他入口协议不受影响（按模型强制使用 Responses 请用模型映射的 `upstreamProtocol`）。
        supportsCompletions:
          type: boolean
          description: |
            仅 openai 渠道有意义（Round 14，`phase14-api.md` §2）：上游实现了旧版 `/completions`（含 `suffix` 的 FIM）时开启，
            `/v1/completions` 请求直通到 `{baseUrl}/completions`（如 DeepSeek 的 `https://api.deepseek.com/beta`）。
            只有开启了它的渠道才是 `/v1/completions` 的候选；anthropic / custom 渠道忽略该字段。默认 false。
        timeoutSeconds:
          type: integer
          minimum: 0
          maximum: 600
          description: 等待上游响应头的超时（秒），0 / 省略表示默认 60 秒；不限制流式响应的总时长
        maxTokensField:
          type: string
          enum: [max_tokens, max_completion_tokens]
          description: 仅 openai 渠道：由 Anthropic / Responses 请求转换为 Chat Completions 时输出上限字段的名称，默认 `max_tokens`（o 系列等新模型需要 `max_completion_tokens`）

    SecretInfo:
      type: object
      required: [set, hint]
      properties:
        set:
          type: boolean
        hint:
          type: [string, "null"]
          description: API Key 末 4 位，如 `…a1b2`；Key 不超过 8 个字符时为 `…`。从不返回明文。
          example: …a1b2

    OwnerRef:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    ChannelHealth:
      type: object
      description: 进程内熔断状态（被动健康：真实流量与手动测试）。多实例部署时各实例独立，重启后归零。
      required: [state, consecutiveFailures, lastError, lastCheckedAt]
      properties:
        state:
          type: string
          enum: [healthy, degraded, open]
          description: healthy = 无连续失败；degraded = 1–2 次连续失败；open = ≥3 次，熔断 30 秒后放行一个探测请求
        consecutiveFailures:
          type: integer
        lastError:
          type: [string, "null"]
        lastCheckedAt:
          type: [string, "null"]
          format: date-time

    Channel:
      type: object
      description: 完整视图（所有者或持有 `channels.manage` 的用户）。
      required: [id, name, type, baseUrl, scope, sharedWith, status, priority, weight, models, config, secret, owner, health, version, createdAt, updatedAt, plugin, pluginConfig, secretFields]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ChannelType"
        baseUrl:
          type: string
          format: uri
          description: 规范化后的地址（去掉末尾 `/`）
        scope:
          $ref: "#/components/schemas/Scope"
        sharedWith:
          $ref: "#/components/schemas/ChannelSharing"
        status:
          $ref: "#/components/schemas/ChannelStatus"
        priority:
          type: integer
          description: 越大越优先
        weight:
          type: integer
          description: 同优先级内的加权随机权重
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelMap"
        config:
          $ref: "#/components/schemas/ChannelConfig"
        secret:
          $ref: "#/components/schemas/SecretInfo"
        owner:
          $ref: "#/components/schemas/OwnerRef"
        health:
          $ref: "#/components/schemas/ChannelHealth"
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        plugin:
          description: 渠道固定的插件版本；Phase 2 之前创建且之后未修改过的渠道为 null（按 `type` 使用内置协议）
          oneOf:
            - $ref: "#/components/schemas/PluginRef"
            - type: "null"
        pluginConfig:
          type: object
          additionalProperties: true
          description: 非敏感插件配置（已按插件 `configSchema` 校验并补默认值；没有时为空对象）
        secretFields:
          type: object
          description: "已设置的插件敏感字段（`x-secret`）：`{名称: {set, hint}}`，从不返回明文；未设置的字段不出现"
          additionalProperties:
            $ref: "#/components/schemas/SecretInfo"
        badges:
          type: array
          description: 仅渠道列表返回：`channel.list.badge` 贡献点解析出的徽标（没有时省略）
          items:
            $ref: "#/components/schemas/ChannelBadge"
        alerts:
          $ref: "#/components/schemas/ChannelAlerts"
        shares:
          type: array
          description: 安全修订（`docs/contracts/phase5-api.md` §5.2）：每个被邀请用户的共享状态，按邀请时间排序（含已拒绝 / 已退出的记录）。
          items:
            $ref: "#/components/schemas/ChannelShare"

    ChannelShare:
      type: object
      additionalProperties: false
      required: [userId, displayName, status, createdAt, respondedAt]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        status:
          type: string
          enum: [pending, accepted, declined]
          description: pending = 待接受；accepted = 已接受（可用）；declined = 已拒绝或已退出
        createdAt:
          type: string
          format: date-time
          description: （最近一次）邀请时间
        respondedAt:
          type: [string, "null"]
          format: date-time
          description: 接受 / 拒绝 / 退出的时间；待接受时为 null

    IncomingShare:
      type: object
      additionalProperties: false
      description: 被共享者看到的共享（`docs/contracts/phase5-api.md` §5.3）：不含地址、配置、上游模型名与任何密钥。
      required: [channelId, name, type, channelStatus, owner, models, status, createdAt, respondedAt]
      properties:
        channelId: { type: string, format: uuid }
        name: { type: string }
        type:
          $ref: "#/components/schemas/ChannelType"
        channelStatus:
          $ref: "#/components/schemas/ChannelStatus"
        owner:
          $ref: "#/components/schemas/OwnerRef"
        models:
          type: array
          description: 逻辑模型名
          items: { type: string }
        status:
          type: string
          enum: [pending, accepted]
        createdAt:
          type: string
          format: date-time
          description: 邀请时间
        respondedAt:
          type: [string, "null"]
          format: date-time

    ChannelSummary:
      type: object
      additionalProperties: false
      description: 精简视图（仅能“使用”该渠道的用户：global 或被共享）。不含 `baseUrl`、`config`、`secret`、`sharedWith`、`owner` 等字段。
      required: [id, name, type, scope, status, models, health, plugin]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ChannelType"
        scope:
          $ref: "#/components/schemas/Scope"
        status:
          $ref: "#/components/schemas/ChannelStatus"
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelMap"
        health:
          $ref: "#/components/schemas/ChannelHealth"
        plugin:
          oneOf:
            - $ref: "#/components/schemas/PluginRef"
            - type: "null"

    ChannelView:
      description: 按调用者身份返回完整视图或精简视图。
      oneOf:
        - $ref: "#/components/schemas/Channel"
        - $ref: "#/components/schemas/ChannelSummary"

    ChannelList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ChannelView"

    ChannelInput:
      type: object
      additionalProperties: false
      description: |
        创建与修改渠道的请求体（**未知字段会被拒绝**）。创建时 `name`、`type`、`baseUrl`、`apiKey` 必填且 `models` 至少一项
        （提供 `pluginVersionId` 时 `type` 由插件决定，`baseUrl` / `models` 可取自插件的 `manifest.defaults`）；
        修改时所有字段可选但 `version` 必填，省略的字段保持不变。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 去除首尾空白后 1–64 个字符
        type:
          $ref: "#/components/schemas/ChannelType"
        baseUrl:
          type: string
          description: http(s) 绝对地址，不能带用户信息、查询参数或片段；末尾 `/` 会被去掉。
          example: https://api.openai.com/v1
        scope:
          $ref: "#/components/schemas/Scope"
        sharedWith:
          description: |
            共享对象（Round 6 起可共享给用户组）：`{users, groups}`；兼容旧客户端，提供字符串数组时视为 `users`（`groups` 为空）。
            各自去重；最多 200 个用户、50 个用户组；`scope` 不为 `shared` 时被忽略并清空。不存在的用户 / 组 → `422`
            （`details.sharedWith` / `details["sharedWith.groups"]` 为其 ID）。
            安全修订（`docs/contracts/phase5-api.md` §5.2）：`users` 中新出现的用户（以及已拒绝后再次出现的用户）收到新的待接受邀请
            （通知 `channel.share_invited`），接受后才能使用；不在列表中的待接受 / 已接受用户被移除，已拒绝的记录保留。
            没有 `channels.manage` 的调用者提交渠道当前没有的用户组 → `422`，`details["sharedWith.groups"] = "只有渠道管理员可以共享给用户组"`
            （保留或移除已有的组允许）。
          oneOf:
            - $ref: "#/components/schemas/ChannelSharing"
            - type: array
              maxItems: 200
              items:
                type: string
                format: uuid
        status:
          $ref: "#/components/schemas/ChannelStatus"
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
        weight:
          type: integer
          minimum: 1
          maximum: 1000
        models:
          type: array
          maxItems: 500
          description: 整体替换；同一渠道内 `model` 不能重复（创建时至少一项）
          items:
            $ref: "#/components/schemas/ModelMapInput"
        config:
          $ref: "#/components/schemas/ChannelConfig"
        apiKey:
          type: string
          maxLength: 4096
          description: 上游 API Key（写入专用，不会返回）；不能为空白、不能含换行
          writeOnly: true
        version:
          type: integer
          description: 修改时必填，等于当前 `version`；创建时忽略
        pluginVersionId:
          type: string
          format: uuid
          description: |
            固定到的插件版本（必须已批准且插件已启用）。创建时省略则绑定 `type` 对应的内置插件；修改时只能切换到同一插件的其他版本（升级 / 回滚），
            切换时若新版本导出 `migrateConfig` 则先迁移配置。
        pluginConfig:
          type: object
          additionalProperties: true
          description: 插件配置，**整体替换**；按 `configSchema` 校验（未声明的键或 x-secret 字段 → `422`，`details` 键为 `pluginConfig.<名称>`），省略的字段取默认值
        secrets:
          type: object
          writeOnly: true
          additionalProperties:
            type: string
          description: |
            插件敏感字段（只写）：`{名称: 值}`，名称必须是 `configSchema` 中标记 `x-secret` 的属性（否则 `422`，`details` 键为 `secrets.<名称>`）；
            空字符串表示删除。只合并提交的字段，未提交的保持不变。渠道主密钥仍通过 `apiKey` 提交。
        alerts:
          $ref: "#/components/schemas/ChannelAlerts"
          description: 告警设置（Round 6）。`balanceBelow` 为非负十进制金额（规范化，如 "100.0" → "100"）、空字符串或 null（不告警）；非法 → `422 alerts.balanceBelow`

    ChannelTestResult:
      type: object
      required: [ok, latencyMs, statusCode, error]
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
          format: int64
        statusCode:
          type: integer
          description: 上游 HTTP 状态码；连接失败时为 0
        error:
          type: [string, "null"]
          description: 失败原因（脱敏），成功时为 null

    PluginRef:
      type: object
      description: 渠道所固定的插件版本（`plugin/plugin_versions` 的精简引用）。
      required: [id, key, name, version, versionId]
      properties:
        id:
          type: string
          format: uuid
          description: 插件的数据库 ID（`Plugin.id`）
        key:
          type: string
          description: 插件 ID（manifest 的 `id`），如 `community.deepseek`、`builtin.openai`
          example: community.deepseek
        name:
          type: string
          example: DeepSeek
        version:
          type: string
          description: 语义化版本号
          example: 1.0.0
        versionId:
          type: string
          format: uuid
          description: 插件版本 ID（`PluginVersion.id`），即渠道的 `pluginVersionId`

    ChannelBadge:
      type: object
      description: 由 `channel.list.badge` 贡献点解析出的值（只出现在渠道列表的完整视图中）。
      required: [value]
      properties:
        value:
          description: 绑定的 JSON Pointer 在最新成功结果中取到的值（任意 JSON）
        format:
          $ref: "#/components/schemas/UIFormat"
        currency:
          type: string
          description: "`currencyBind` 解析出的币种（字符串时才返回）"

    PluginSource:
      type: string
      description: |
        `builtin`：Go 原生协议支持（`builtin.openai` / `builtin.anthropic`），无 JS、不可编辑 / 导出；`bundled`：随二进制分发的示例（如
        `community.deepseek`），启动时自动安装新版本并自动批准；`upload`：通过 ZIP 导入创建；`editor`：在线新建。
      enum: [builtin, bundled, upload, editor]

    PluginStatus:
      type: string
      enum: [enabled, disabled]

    PluginApproval:
      type: string
      description: "`pending` 待审批；`approved` 已批准（渠道只能固定到已批准版本）；`rejected` 已拒绝。"
      enum: [pending, approved, rejected]

    VersionSummary:
      type: object
      required: [id, version, approval, publishedAt, publishedBy, contentHash, riskCount]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
          example: 1.0.0
        approval:
          $ref: "#/components/schemas/PluginApproval"
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: [string, "null"]
          format: uuid
          description: 发布者用户 ID；内置与随附插件为 null
        contentHash:
          type: string
          description: 包文件的 SHA-256（十六进制）；内置插件为 `builtin:<key>@<version>`
        riskCount:
          type: integer
          description: 静态风险扫描发现数

    Plugin:
      type: object
      required: [id, key, name, description, author, homepage, source, status, version, createdAt, updatedAt, latest, pending, channels, hasDraft, extends, protocol, kind, meters]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: 插件 ID（manifest 的 `id`），全局唯一
          example: community.deepseek
        name:
          type: string
        description:
          type: string
        author:
          type: string
        homepage:
          type: string
        source:
          $ref: "#/components/schemas/PluginSource"
        status:
          $ref: "#/components/schemas/PluginStatus"
        version:
          type: integer
          description: 乐观锁版本（用于 `PATCH /api/plugins/{id}`），与语义化版本号无关
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latest:
          description: 最新已批准版本（按语义化版本取最大），没有时为 null
          oneOf:
            - $ref: "#/components/schemas/VersionSummary"
            - type: "null"
        pending:
          description: 最新待审批版本，没有时为 null
          oneOf:
            - $ref: "#/components/schemas/VersionSummary"
            - type: "null"
        channels:
          type: integer
          description: 固定到该插件任一版本的渠道数
        hasDraft:
          type: boolean
        extends:
          type: string
          description: 最新已批准版本的 `manifest.extends`（`openai.chat` / `anthropic.messages`）；没有已批准版本或自定义协议插件时为空字符串
        protocol:
          type: string
          enum: ["", custom]
          description: 最新已批准版本的 `manifest.protocol`（Round 6 续）
        kind:
          type: array
          description: 最新已批准版本的 `manifest.kind`（没有已批准版本时为 `["channel"]`）
          items:
            type: string
            enum: [channel, billing]
        meters:
          type: array
          description: 最新已批准版本声明的计费计量（非计费插件为空数组）
          items:
            type: object
            required: [name, label]
            properties:
              name:
                type: string
                example: weighted_tokens
              label:
                type: string
              unit:
                type: string
        versions:
          type: array
          description: 仅详情接口返回（为空时省略）：全部版本摘要，按语义化版本降序
          items:
            $ref: "#/components/schemas/VersionSummary"

    PluginFiles:
      type: object
      description: |
        插件包文件：`{路径: 文本内容}`。必须包含 `manifest.json`；最多 64 个文件，单个 ≤ 256 KiB，总计 ≤ 1 MiB；路径只允许
        `[A-Za-z0-9._-]` 段以 `/` 分隔，不能含 `..` 或以 `/` 开头。入口默认 `src/index.ts`，`tests/*.json` 为模拟测试用例。
      maxProperties: 64
      additionalProperties:
        type: string
      example:
        manifest.json: '{ "id": "acme.relay", "name": "Acme 中转", "version": "0.1.0", "sdk": 1, "extends": "openai.chat" }'
        src/index.ts: |
          import { definePlugin } from "@omnigate/plugin-sdk"
          export default definePlugin({ capabilities: {} })

    Draft:
      type: object
      required: [files, baseVersionId, updatedAt, version]
      properties:
        files:
          $ref: "#/components/schemas/PluginFiles"
        baseVersionId:
          type: [string, "null"]
          format: uuid
          description: 草稿所基于的版本（只在由已批准版本生成的未保存草稿中给出；保存后的草稿通常为 null）
        updatedAt:
          type: string
          format: date-time
          description: 尚未保存的草稿为零值时间 `0001-01-01T00:00:00Z`
        version:
          type: integer
          description: 草稿的乐观锁版本；尚未保存的草稿为 0

    PermissionDiff:
      type: object
      description: |
        相对最新已批准版本的权限变化。条目格式：`network:<主机>`、`secret:<名称>`、`schedule:<能力>`、`storage:<maxKeys>keys/<maxBytes>B`、
        `dangerous:<名称>`。没有已批准版本时全部列为 `added`。两者都为空时发布会自动批准。
      required: [added, removed]
      properties:
        added:
          type: array
          items:
            type: string
          example: ["network:api.deepseek.com", "secret:apiKey"]
        removed:
          type: array
          items:
            type: string

    PluginVersion:
      description: 不可变插件版本（含文件）。
      allOf:
        - $ref: "#/components/schemas/VersionSummary"
        - type: object
          required: [pluginId, manifest, files, risk, approvedBy, approvedAt, approvalNote, permissionDiff]
          properties:
            pluginId:
              type: string
              format: uuid
            manifest:
              $ref: "#/components/schemas/Manifest"
            files:
              $ref: "#/components/schemas/PluginFiles"
            risk:
              type: array
              items:
                $ref: "#/components/schemas/RiskFinding"
            approvedBy:
              type: [string, "null"]
              format: uuid
              description: 审批人；自动批准时为发布者，随附插件为 null
            approvedAt:
              type: [string, "null"]
              format: date-time
            approvalNote:
              type: [string, "null"]
              description: 审批备注；自动批准时为“权限与已批准的 x.y.z 相同，自动批准”，随附插件为“随 OmniGate 分发，自动批准”
            permissionDiff:
              $ref: "#/components/schemas/PermissionDiff"

    Diagnostic:
      type: object
      description: 编译 / 校验诊断。包级错误的 `file` 可能为空字符串；位置未知时 `line` / `column` 为 0（行列从 1 开始）。
      required: [file, line, column, severity, message]
      properties:
        file:
          type: string
          example: src/index.ts
        line:
          type: integer
        column:
          type: integer
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string

    RiskFinding:
      type: object
      description: |
        静态风险扫描结果（逐行正则匹配 `.ts` / `.js` 文件，**仅供审批参考，不是安全保证**，不阻止发布）。`rule`：
        `dynamic-code`（eval / Function）、`constructor-escape`（构造器链）、`proto-pollution`（修改原型链）、`busy-loop`（无条件循环）、
        `obfuscation`（疑似混淆或大段编码数据）、`global-tamper`（修改全局对象或 `og`）、`undeclared-host`（代码中出现未在 `permissions.network`
        声明的地址，运行时会被拒绝）。
      required: [rule, file, line, message]
      properties:
        rule:
          type: string
          enum: [dynamic-code, constructor-escape, proto-pollution, busy-loop, obfuscation, global-tamper, undeclared-host]
        file:
          type: string
        line:
          type: integer
        message:
          type: string

    BuildResult:
      type: object
      required: [ok, manifest, diagnostics, risk, bundleBytes]
      properties:
        ok:
          type: boolean
          description: 没有 `severity=error` 的诊断且编译产物非空
        manifest:
          description: 解析后的 manifest（`manifest.json` 缺失或不是合法 JSON / 含未知字段时为 null）
          oneOf:
            - $ref: "#/components/schemas/Manifest"
            - type: "null"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"
        risk:
          type: array
          items:
            $ref: "#/components/schemas/RiskFinding"
        bundleBytes:
          type: integer
          description: 编译产物（单文件 ES2017 IIFE）字节数；未编译时为 0

    UpstreamRequest:
      type: object
      description: 请求 Hook 的入参与返回值（见文档开头“数据面：插件请求 Hook”）。
      additionalProperties: false
      required: [dialect, path]
      properties:
        dialect:
          type: string
          enum: [openai.chat, openai.responses, anthropic.messages]
        path:
          type: string
          description: 相对渠道 `baseUrl` 的路径，必须以 `/` 开头且不能包含主机
          example: /chat/completions
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          description: 已解析的 JSON 请求体

    MockFetch:
      type: object
      additionalProperties: false
      description: 模拟测试中 `og.fetch` 的预置响应。按顺序取第一个 `url` 完全相同（且 `method` 为空或相同）的条目。
      required: [match, response]
      properties:
        match:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            method:
              type: string
              description: 为空时匹配任意方法（不区分大小写）
            url:
              type: string
              format: uri
              description: 完整 URL，与请求 URL 精确比较
        response:
          type: object
          additionalProperties: false
          properties:
            status:
              type: integer
              description: 缺省 200
            headers:
              type: object
              additionalProperties:
                type: string
            json:
              description: JSON 响应体（优先于 `body`）
            body:
              type: string
              description: 文本响应体

    TestCase:
      type: object
      additionalProperties: false
      description: |
        模拟测试用例（与草稿中 `tests/*.json` 的格式相同）。`capability`、`hook`、`meter` 三选一：
        - `transformRequest` / `signRequest`：`request` 为 `UpstreamRequest`，输出为改写后的请求；
        - `buildRequest`：`request` 为 Chat Completions 请求（CanonicalRequest），先执行 `buildRequest` 再执行 `signRequest`（若声明），
          输出为 `{method, url, headers, body}`（密钥句柄已替换）；
        - `parseResponse` / `normalizeError`：`response` 为模拟的上游响应，输出为 CanonicalResponse / `{status, message}`；
        - `parseStream`（或 `endStream`）：`chunks` / `chunksBase64` 依次作为字节块调用 `parseStream`（同一运行时与 `state`），最后调用
          `endStream`（若声明），输出为全部事件拼成的数组；
        - `meter`：以 `usage`、`billingCtx` 调用 `billing.meters.<meter>.computeUnits`，输出为十进制字符串。
        `expect.error` 非空时要求执行出错且错误消息包含该子串；否则若给出 `expect.output`，按子集匹配（对象只比较期望中出现的键，
        数组按下标逐项比较，标量按字符串形式比较）。
      properties:
        name:
          type: string
        case:
          type: string
          description: 草稿中用例文件的路径（如 `tests/balance.json`）；提供时以文件内容覆盖请求体中的同名字段
          example: tests/balance.json
        capability:
          type: string
          example: balance.get
        hook:
          type: string
          enum: [transformRequest, signRequest, buildRequest, parseResponse, parseStream, endStream, normalizeError]
        meter:
          type: string
          description: 计费计量名（manifest `billing.meters` 的键）
          example: weighted_tokens
        input:
          description: 能力入参（任意 JSON）
        request:
          description: "`transformRequest` / `signRequest`：`UpstreamRequest`；`buildRequest`：Chat Completions 请求"
          oneOf:
            - $ref: "#/components/schemas/UpstreamRequest"
            - type: object
              additionalProperties: true
        response:
          type: object
          additionalProperties: false
          description: "`parseResponse` / `normalizeError` 的模拟上游响应"
          properties:
            status:
              type: integer
              default: 200
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              description: "响应体：字符串原样使用，其他 JSON 值按其 JSON 文本（并默认 `content-type: application/json`）"
        chunks:
          type: array
          description: "`parseStream`：上游字节块（UTF-8 文本）"
          items:
            type: string
        chunksBase64:
          type: array
          description: "`parseStream`：上游字节块（base64，可在多字节字符中间切分），排在 `chunks` 之后"
          items:
            type: string
            format: byte
        usage:
          $ref: "#/components/schemas/Usage"
        billingCtx:
          $ref: "#/components/schemas/BillingCtx"
        config:
          type: object
          description: 作为 `ctx.config` 的非敏感配置（测试中不按 configSchema 校验）
          additionalProperties: true
        secrets:
          type: object
          description: 测试用密钥（`apiKey` 与 x-secret 字段），只有 `permissions.secrets` 中声明的名称可以被 `og.secret()` 取得
          additionalProperties:
            type: string
        baseUrl:
          type: string
          description: 作为 `ctx.channel.baseUrl`；缺省取 `manifest.defaults.baseUrl`
        fetch:
          type: array
          items:
            $ref: "#/components/schemas/MockFetch"
        expect:
          type: object
          additionalProperties: false
          properties:
            output:
              description: 期望输出（子集匹配）
            error:
              type: string
              description: 期望错误消息包含的子串

    PluginLogLine:
      type: object
      required: [level, message]
      properties:
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string
          description: "`og.log.*` / `console.*` 输出（密钥句柄与疑似密钥已脱敏）"

    PluginFetchRecord:
      type: object
      required: [method, url, status, durationMs]
      properties:
        method:
          type: string
        url:
          type: string
          description: 请求 URL（已脱敏）
        status:
          type: integer
          description: 上游状态码；请求未发出或失败时为 0
        error:
          type: string
          description: 失败原因（被拒绝的主机、只允许 https、超过 10 次、响应超过 4 MiB、模拟测试未匹配等）
        durationMs:
          type: integer
          format: int64

    TestResult:
      type: object
      required: [ok, output, error, logs, fetches, durationMs, expectation]
      properties:
        ok:
          type: boolean
          description: 执行成功且满足 `expect`（若有）
        output:
          description: |
            插件返回值（能力用例经输出格式校验；请求 Hook 用例为改写后的请求，句柄已替换；`parseStream` 用例为事件数组，出错时为出错前的事件；
            计量用例为十进制字符串）；失败时为 null
        error:
          type: [string, "null"]
        logs:
          type: array
          items:
            $ref: "#/components/schemas/PluginLogLine"
        fetches:
          type: array
          items:
            $ref: "#/components/schemas/PluginFetchRecord"
        durationMs:
          type: integer
          format: int64
        expectation:
          type: [string, "null"]
          description: 期望不满足时的原因（如“输出与期望不符：/total 期望 110.00，实际 12.00”）
        build:
          $ref: "#/components/schemas/BuildResult"
          description: 仅在草稿编译失败时出现（此时未执行用例）
        calls:
          type: array
          description: "仅流式用例（`hook` 为 `parseStream`）：每次 `parseStream` / `endStream` 调用一项，出错的调用为最后一项"
          items:
            type: object
            required: [hook, chunk, durationMs, events]
            properties:
              hook:
                type: string
                enum: [parseStream, endStream]
              chunk:
                type: [integer, "null"]
                description: 输入块下标（`chunks` 在前、`chunksBase64` 在后）；`endStream` 为 null
              durationMs:
                type: number
                description: 本次调用的 JS 执行时间（毫秒，微秒精度）
              events:
                type: array
                description: 本次调用返回的事件
                items: {}
              error:
                type: string
                description: 本次调用失败的原因（插件错误、事件格式错误或无效事件）
        chatChunks:
          type: array
          description: |
            仅流式用例：宿主把全部事件转换成的 Chat Completions 流式 chunk（即 Chat 客户端会收到的 `data:` 内容，不含 `[DONE]`；模型名为
            `test-model`，总是带 usage chunk）。`error` 事件转换为错误对象并结束转换；未知事件类型使用例失败。
          items:
            type: object

    UIFormat:
      type: string
      description: 值的显示格式（空字符串 / 省略 = 原样显示）。
      enum: [text, number, money, percent, boolean, datetime, relativeTime]

    UIColumn:
      type: object
      additionalProperties: false
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
        format:
          $ref: "#/components/schemas/UIFormat"

    UINode:
      type: object
      additionalProperties: false
      description: |
        声明式 UI 组件（ADR-0003，宿主渲染，插件不能提供 HTML / CSS / 脚本）。`type` 白名单：`statGroup`、`stat`、`keyValue`、
        `table`（`columns` + `rowsBind`）、`progress`（`valueBind` + `maxBind`）、`badge`、`alert`（`level` + `text`）、`markdown`（宿主净化，禁用 HTML）、
        `link`（`href` 只允许 https）。`items` 可嵌套，最多 4 层。`*Bind` 形如 `<能力名>:<JSON Pointer>`（如 `balance.get:/total`），
        只能引用本插件已声明能力的最新结果。`label` ≤ 100、`text` ≤ 2000 字节。
      required: [type]
      properties:
        type:
          type: string
          enum: [statGroup, stat, keyValue, table, progress, badge, alert, markdown, link]
        label:
          type: string
        text:
          type: string
        level:
          type: string
          enum: [info, warning, error, success]
          description: 仅 `alert`，必填
        href:
          type: string
          description: 仅 `link`，必须是 https 地址
        bind:
          type: string
          example: balance.get:/total
        currencyBind:
          type: string
          example: balance.get:/currency
        valueBind:
          type: string
        maxBind:
          type: string
        rowsBind:
          type: string
          example: models.list:/models
        format:
          $ref: "#/components/schemas/UIFormat"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/UIColumn"
        items:
          type: array
          items:
            $ref: "#/components/schemas/UINode"

    UIAction:
      type: object
      additionalProperties: false
      required: [label, capability]
      properties:
        label:
          type: string
        capability:
          type: string
          description: 点击时触发的能力（必须已在 manifest 中声明；执行时仍要求 `userTriggerable`）
        confirm:
          type: string
          description: 执行前的确认提示

    UIContribution:
      type: object
      additionalProperties: false
      description: |
        UI 贡献点。`slot`：`channel.detail.overview`（渠道详情概览）、`channel.detail.capabilities`（渠道详情的能力页）、
        `channel.list.badge`（渠道列表徽标，只能使用 `badge` 组件）。每个 manifest 最多 20 个。
      required: [slot, component]
      properties:
        slot:
          type: string
          enum: [channel.detail.capabilities, channel.detail.overview, channel.list.badge]
        title:
          type: string
        component:
          $ref: "#/components/schemas/UINode"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/UIAction"

    ConfigSchemaProperty:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [string, number, integer, boolean]
        title:
          type: string
        description:
          type: string
        default:
          description: 未提交该字段时使用的默认值
        enum:
          type: array
          items: {}
        minimum:
          type: number
        maximum:
          type: number
        minLength:
          type: integer
        maxLength:
          type: integer
        pattern:
          type: string
          description: Go RE2 正则
        x-secret:
          type: boolean
          description: 敏感字段：必须是 string 且名称出现在 `permissions.secrets`；通过渠道的 `secrets` 写入并加密保存，读取时只返回是否已设置
        x-group:
          type: string
          description: 表单分组
        x-help:
          type: string
          description: 表单帮助文本

    ConfigSchema:
      type: object
      additionalProperties: false
      description: |
        插件配置的 JSON Schema 子集：根必须是 object，最多 32 个属性；属性名形如 `^[a-zA-Z][a-zA-Z0-9_]{0,40}$` 且不能是 `apiKey`
        （渠道主密钥保留名）。`required` 中的名称必须已声明。
      required: [type, properties]
      properties:
        type:
          type: string
          const: object
        properties:
          type: object
          maxProperties: 32
          additionalProperties:
            $ref: "#/components/schemas/ConfigSchemaProperty"
        required:
          type: array
          items:
            type: string

    PluginPermissions:
      type: object
      additionalProperties: false
      description: |
        插件权限（发布时与上一已批准版本比较，变化需 `plugins.trust` 审批）。响应中未声明的数组字段可能为 null。
      properties:
        network:
          type: [array, "null"]
          description: |
            `og.fetch` 可访问的主机名：精确主机名、`*.example.com`（只匹配子域名，不含顶级本身）或 `$baseUrl`（渠道 baseUrl 的主机）；
            不允许 IP、端口或路径。
          items:
            type: string
          example: ["api.deepseek.com", "$baseUrl"]
        secrets:
          type: [array, "null"]
          description: 可通过 `og.secret(name)` 取得句柄的字段：`apiKey`（渠道主 API Key）或 configSchema 中的 x-secret 字段
          items:
            type: string
        storage:
          type: object
          additionalProperties: false
          description: 声明后可使用 `og.storage`（按插件 + 渠道隔离）
          required: [maxKeys, maxBytes]
          properties:
            maxKeys:
              type: integer
              minimum: 1
              maximum: 1000
            maxBytes:
              type: integer
              minimum: 1
              maximum: 1048576
        schedule:
          type: [array, "null"]
          description: 允许定时执行的能力（必须已声明，且能力需带 `schedule`）
          items:
            type: string
        dangerous:
          type: [array, "null"]
          description: 预留；当前版本必须为空
          maxItems: 0
          items:
            type: string

    CapabilityDeclaration:
      type: object
      additionalProperties: false
      required: [output]
      properties:
        output:
          type: string
          enum: [balance, quota, models, usage, health, json]
          description: 输出类型，宿主按 `CapabilityResult.output` 中描述的结构校验
        userTriggerable:
          type: boolean
          description: 是否允许渠道所有者 / 管理员手动触发
        schedule:
          type: object
          additionalProperties: false
          required: [minInterval]
          properties:
            minInterval:
              type: string
              description: Go duration，至少 `1m`；需要 `permissions.schedule` 包含该能力
              example: 10m
        cacheTtl:
          type: string
          description: Go duration（> 0）。当前版本只做格式校验，尚未用于缓存
          example: 5m
        timeout:
          type: string
          description: Go duration，默认 `10s`，最大 `60s`
          example: 10s
        label:
          type: string
          description: 显示名称（缺省为能力名）

    Manifest:
      type: object
      additionalProperties: false
      description: |
        插件 manifest v1（`manifest.json`，未知字段会被拒绝）。响应中的 manifest 是服务端解析后再序列化的结果：缺省的 `entry` 被补为
        `src/index.ts`，未声明的数组字段可能为 null。
      required: [id, name, version, sdk]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9]+(\\.[a-z0-9-]+)+$"
          maxLength: 64
          description: 插件 ID，`builtin.` 前缀为内置插件保留
          example: community.deepseek
        name:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: string
          description: 语义化版本（`MAJOR.MINOR.PATCH[-prerelease]`）；同一插件的新版本必须大于已发布的最大版本
          example: 1.0.0
        sdk:
          type: integer
          const: 1
        description:
          type: string
          maxLength: 500
        author:
          type: string
        homepage:
          type: string
          description: 必须是 https 地址
        kind:
          type: array
          description: 插件类型（Round 6 续），省略为 `["channel"]`。不含 `channel` 的仅计费插件不能声明 `extends`、`protocol`、`hooks`、`capabilities`、`uiContributions`
          items:
            type: string
            enum: [channel, billing]
        extends:
          type: string
          enum: [openai.chat, anthropic.messages]
          description: 继承的协议，决定渠道 `type`（`openai.chat` → `openai`，`anthropic.messages` → `anthropic`）。渠道插件必须声明 `extends` 或 `protocol`
        protocol:
          type: string
          enum: [custom]
          description: |
            `custom`：插件实现完整的上游协议（phase9-api.md §2），与 `extends` 互斥，渠道 `type` 为 `custom`；`hooks` 必须包含
            `buildRequest`、`parseResponse`、`parseStream`，不能包含 `transformRequest`。插件第一个 `custom` 版本发布后必须审批。
        billing:
          type: object
          additionalProperties: false
          required: [meters]
          description: 计费计量（`kind` 包含 `billing` 时必填，最多 20 个）；代码中实现 `billing.meters.<名称>.computeUnits`
          properties:
            meters:
              type: object
              propertyNames:
                pattern: "^[a-z][a-z0-9_]{0,40}$"
              additionalProperties:
                type: object
                additionalProperties: false
                required: [label]
                properties:
                  label:
                    type: string
                    minLength: 1
                    maxLength: 64
                  unit:
                    type: string
                    maxLength: 16
        entry:
          type: string
          default: src/index.ts
          description: 入口文件（.ts 或 .js），必须存在于包中
        defaults:
          type: object
          additionalProperties: false
          description: 新建渠道时预填（可修改）
          properties:
            baseUrl:
              type: string
              description: http(s) 绝对地址
            models:
              type: array
              items:
                $ref: "#/components/schemas/ModelMapInput"
        configSchema:
          $ref: "#/components/schemas/ConfigSchema"
        permissions:
          $ref: "#/components/schemas/PluginPermissions"
        capabilities:
          type: object
          description: 能力名 → 声明。能力名只能是 `models.list`、`balance.get`、`usage.query`、`quota.get`、`health.check` 或 `custom.<name>`（`<name>` 形如 `[a-zA-Z][a-zA-Z0-9_]{0,40}`）；每个能力都必须在代码中实现。
          additionalProperties:
            $ref: "#/components/schemas/CapabilityDeclaration"
        hooks:
          type: [array, "null"]
          description: 实现的 Hook（必须在代码中导出）；`buildRequest` 等自定义协议 Hook 只用于 `protocol` 为 `custom` 的插件
          items:
            type: string
            enum: [transformRequest, signRequest, buildRequest, parseResponse, parseStream, endStream, normalizeError]
        uiContributions:
          type: [array, "null"]
          maxItems: 20
          items:
            $ref: "#/components/schemas/UIContribution"

    CapabilityResult:
      type: object
      description: |
        能力执行结果。`output` 的结构由能力声明的 `output` 决定（宿主校验，不符合即失败）：
        - `balance`：`{currency, total, granted?, toppedUp?, available}`，金额为十进制字符串，`available` 为布尔值；
        - `quota`：`{windows: [{id, label, used, limit, resetsAt?}]}`；
        - `models`：`{models: [{id, displayName?}]}`；
        - `usage`：`{periods: [{label, requests?, inputTokens?, outputTokens?, cost?, currency?}]}`；
        - `health`：`{ok, latencyMs?, message?}`；
        - `json`：任意 JSON。
        插件返回 `{unsupported: true, reason}` 时 `ok=true`、`unsupported=true`，`output` 为该对象（界面显示“不支持”而非错误）。
        任何返回值序列化后都不能超过 256 KiB。
      required: [ok, unsupported, output, error, durationMs, fetchedAt, pluginVersion]
      properties:
        ok:
          type: boolean
        unsupported:
          type: boolean
        output:
          description: 插件输出；失败时为 null
        error:
          type: [string, "null"]
          description: 失败原因（异常消息、超时、内存中断、输出格式不符等；已脱敏）
        durationMs:
          type: integer
          format: int64
        fetchedAt:
          type: string
          format: date-time
        pluginVersion:
          type: string
          description: 执行时的插件版本号
          example: 1.0.0
        logs:
          type: array
          description: 仅手动执行（`POST /api/channels/{id}/capabilities/{name}`）的响应中返回
          items:
            $ref: "#/components/schemas/PluginLogLine"
        fetches:
          type: array
          description: 仅手动执行的响应中返回
          items:
            $ref: "#/components/schemas/PluginFetchRecord"

    CapabilityInfo:
      type: object
      required: [name, label, output, userTriggerable, schedule]
      properties:
        name:
          type: string
          example: balance.get
        label:
          type: string
          description: manifest 中的 `label`，缺省为能力名
        output:
          type: string
          enum: [balance, quota, models, usage, health, json]
        userTriggerable:
          type: boolean
        schedule:
          type: string
          description: 定时执行间隔（`minInterval`）；不定时执行时为空字符串。调度器每 30 秒检查一次，结果早于该间隔时重新执行。
          example: 10m

    CapabilitiesView:
      type: object
      required: [plugin, capabilities, results, ui]
      properties:
        plugin:
          oneOf:
            - $ref: "#/components/schemas/PluginRef"
            - type: "null"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityInfo"
        results:
          type: object
          description: 能力名 → 最近一次结果（不含 `logs` / `fetches`）
          additionalProperties:
            $ref: "#/components/schemas/CapabilityResult"
        ui:
          type: array
          items:
            $ref: "#/components/schemas/UIContribution"

    KeyPolicy:
      type: object
      additionalProperties: false
      description: Gateway Key 策略。响应中所有列表总是数组，`compatMode` 总是有值。
      properties:
        allowedModels:
          type: array
          maxItems: 200
          items:
            type: string
          description: 允许的逻辑模型；空 = 不限
        allowedChannels:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
          description: 允许路由到的渠道 ID；空 = 不限
        ipAllowlist:
          type: array
          maxItems: 100
          items:
            type: string
          description: 允许的客户端 IP / CIDR（单个 IP 视为 /32 或 /128，保存时规范化为网段形式）；空 = 不限
        rpm:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
          description: 每分钟请求数上限（进程内令牌桶，多实例时各自计数）；null = 不限
        compatMode:
          type: string
          enum: [strict, lenient]
          default: strict
          description: 跨协议无法转换的字段：strict 返回 `400 unsupported_parameter`；lenient 丢弃并在 `X-OmniGate-Compat-Warnings` 中列出
        quotaOverflow:
          type: string
          enum: ["", block, wallet]
          default: ""
          description: 套餐额度用完时（Round 5）：`""` = 跟随账户设置（`GET /api/billing/preferences`）；`block` = 返回 429；`wallet` = 改用钱包
        spendLimit:
          description: |
            Key 的消费上限（Round 6，`docs/contracts/phase8-api.md` §2.1）：只统计平台渠道由钱包支付的计费金额；窗口按 Key 所有者所在组的
            `timezone` 计算（周从周一开始）；null = 不限。达到上限后该 Key 的 platform 请求返回 `429 spend_limit_exceeded`。
            非法金额 → `422 details["policy.spendLimit.amount"]`，非法窗口 → `details["policy.spendLimit.window"]`。
          oneOf:
            - $ref: "#/components/schemas/SpendLimit"
            - type: "null"

    GatewayKey:
      type: object
      required: [id, name, prefix, status, policy, expiresAt, lastUsedAt, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: 明文的前 12 个字符加 `…`，仅用于识别
          example: og-AbCdEfGhI…
        status:
          type: string
          enum: [enabled, disabled]
          description: 已吊销的 Key 不会出现在任何响应中
        policy:
          $ref: "#/components/schemas/KeyPolicy"
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
          description: 最近一次通过认证的时间（每个 Key 每分钟最多更新一次）
        createdAt:
          type: string
          format: date-time
        version:
          type: integer

    KeyCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        policy:
          $ref: "#/components/schemas/KeyPolicy"
        expiresAt:
          type: string
          format: date-time
          description: 必须晚于当前时间；省略表示永不过期

    KeyPatchRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [enabled, disabled]
        policy:
          $ref: "#/components/schemas/KeyPolicy"
        expiresAt:
          type: string
          format: date-time
        clearExpiry:
          type: boolean
          default: false
          description: 为 true 时取消过期时间（忽略 `expiresAt`）
        version:
          type: integer

    KeyCreated:
      type: object
      required: [key, secret]
      properties:
        key:
          $ref: "#/components/schemas/GatewayKey"
        secret:
          type: string
          description: Key 明文（`og-` + 43 位 base64url），**只返回这一次**
          pattern: "^og-[A-Za-z0-9_-]{43}$"
          example: og-3q2-7wAbCdEfGhIjKlMnOpQrStUvWxYz0123456789a

    PriceKind:
      type: string
      description: sell = 逻辑模型对用户的售价；cost = 渠道 + 上游模型的成本价
      enum: [sell, cost]

    Price:
      type: object
      description: 价格版本（不可变）。`*PerM` 为每 100 万 token 的价格。
      required: [id, kind, model, channelId, inputPerM, outputPerM, cacheReadPerM, cacheWritePerM, perRequest, perImage, imageInputPerM,
        audioInputPerM, audioOutputPerM, perMinute, perMCharacters, effectiveAt, createdAt, createdBy]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PriceKind"
        model:
          type: string
        channelId:
          type: [string, "null"]
          format: uuid
          description: cost 价格对应的渠道；sell 为 null
        inputPerM:
          $ref: "#/components/schemas/Money"
        outputPerM:
          $ref: "#/components/schemas/Money"
        cacheReadPerM:
          $ref: "#/components/schemas/Money"
        cacheWritePerM:
          $ref: "#/components/schemas/Money"
        perRequest:
          $ref: "#/components/schemas/Money"
        perImage:
          $ref: "#/components/schemas/Money"
          description: 每张输出图片的价格（Round 6 续，图片接口）；未设置为 `"0"`
        imageInputPerM:
          description: 图片输入 token 的每百万单价（Round 6 续）；null = 按 `inputPerM` 计
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        audioInputPerM:
          description: 音频输入 token 的每百万单价（Round 6 续，音频接口）；null = 按 `inputPerM` 计
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        audioOutputPerM:
          description: 音频输出 token 的每百万单价（Round 6 续，音频接口）；null = 按 `outputPerM` 计
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        perMinute:
          $ref: "#/components/schemas/Money"
          description: 每分钟输入音频的价格（转写 / 翻译，按秒计费）；未设置为 `"0"`
        perMCharacters:
          $ref: "#/components/schemas/Money"
          description: 每百万语音合成输入字符（Unicode 字符）的价格；未设置为 `"0"`
        schedule:
          description: 分时倍率（Round 6，`docs/contracts/phase8-api.md` §3）；null = 无
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/PriceScheduleSlot"
            - type: "null"
        scheduleTimezone:
          type: string
          description: "`schedule` 使用的 IANA 时区（默认 `Asia/Shanghai`）"
        tiers:
          description: 按上下文长度的阶梯价格（Round 10，`docs/contracts/phase10-api.md` §1），按 `aboveInputTokens` 升序；null = 无。档内为 null 的单价沿用本版本的基础单价
          oneOf:
            - type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/PriceTier"
            - type: "null"
        effectiveAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: [string, "null"]
          format: uuid

    PriceScheduleSlot:
      type: object
      additionalProperties: false
      description: |
        价格版本的一个时段（Round 6）。按**请求开始时间**（在 `scheduleTimezone` 中）匹配第一个命中的时段，倍率作用于该版本的全部单价
        （售价与成本价都可以设置；售价再乘用户组倍率）；未命中时倍率为 1。`start` 含、`end` 不含；`start > end` 表示跨零点，
        `days` 指时段**开始**的那一天（如周六 22:00–02:00 覆盖周六 22:00–24:00 与周日 00:00–02:00）。时段之间不允许重叠（`422 details.schedule`）。
      required: [days, start, end, multiplier]
      properties:
        days:
          type: array
          description: 0 = 周日 … 6 = 周六；空 = 每天（保存时去重排序）
          items: { type: integer, minimum: 0, maximum: 6 }
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "00:30"
        end:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
          description: 可以是 `24:00`（当天结束，不能用于跨零点的时段）
          example: "08:30"
        multiplier:
          type: string
          description: 十进制 0–10，最多 9 位小数（保存时规范化，如 `"0.50"` → `"0.5"`）
          example: "0.5"

    PriceTier:
      type: object
      additionalProperties: false
      description: |
        价格版本的一档上下文阶梯（Round 10，`docs/contracts/phase10-api.md` §1）。请求的提示 token 数（输入 + 缓存读取 + 缓存写入）
        **大于** `aboveInputTokens` 时，整次请求的全部 token 单价改用该档（命中多档时取门槛最高的一档；等于门槛仍按下一档 / 基础价）。
        `perRequest`、`perImage`、`perMinute`、`perMCharacters` 不分档。分时倍率与用户组倍率照常相乘。
        可选单价为 null（创建时省略、null 或空字符串）表示沿用基础价格的同名字段（基础价格的 `imageInputPerM` 等也为 null 时按本档 `inputPerM` / `outputPerM` 计）。
      required: [aboveInputTokens, inputPerM, outputPerM, cacheReadPerM, cacheWritePerM, imageInputPerM, audioInputPerM, audioOutputPerM]
      properties:
        aboveInputTokens:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
          description: 门槛（提示 token 数），各档严格递增
          example: 272000
        inputPerM:
          $ref: "#/components/schemas/Money"
        outputPerM:
          $ref: "#/components/schemas/Money"
        cacheReadPerM:
          type: [string, "null"]
        cacheWritePerM:
          type: [string, "null"]
        imageInputPerM:
          type: [string, "null"]
        audioInputPerM:
          type: [string, "null"]
        audioOutputPerM:
          type: [string, "null"]

    PlazaPriceTier:
      type: object
      description: |
        模型广场价格的一档阶梯（Round 10），已展开继承并乘用户组倍率（与 `PlazaPrice` 的基础单价相同的约定）：
        `cacheReadPerM` / `cacheWritePerM` 为 0 时为 null；`imageInputPerM`、`audioInputPerM` / `audioOutputPerM` 为 null 时按本档 `inputPerM` / `outputPerM` 计。
      required: [aboveInputTokens, inputPerM, outputPerM, cacheReadPerM, cacheWritePerM, imageInputPerM, audioInputPerM, audioOutputPerM]
      properties:
        aboveInputTokens:
          type: integer
          format: int64
          example: 272000
        inputPerM:
          $ref: "#/components/schemas/Money"
        outputPerM:
          $ref: "#/components/schemas/Money"
        cacheReadPerM:
          type: [string, "null"]
        cacheWritePerM:
          type: [string, "null"]
        imageInputPerM:
          type: [string, "null"]
        audioInputPerM:
          type: [string, "null"]
        audioOutputPerM:
          type: [string, "null"]

    PriceCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, model]
      properties:
        kind:
          $ref: "#/components/schemas/PriceKind"
        model:
          type: string
          minLength: 1
          maxLength: 128
        channelId:
          type: string
          format: uuid
          description: cost 必填，sell 不能提供
        inputPerM:
          $ref: "#/components/schemas/MoneyInput"
        outputPerM:
          $ref: "#/components/schemas/MoneyInput"
        cacheReadPerM:
          $ref: "#/components/schemas/MoneyInput"
        cacheWritePerM:
          $ref: "#/components/schemas/MoneyInput"
        perRequest:
          $ref: "#/components/schemas/MoneyInput"
        perImage:
          description: 每张输出图片的价格（Round 6 续）；省略、null 或空字符串 = 0。非负、最多 9 位小数（否则 `422 details.perImage`）
          oneOf:
            - $ref: "#/components/schemas/MoneyInput"
            - type: "null"
        imageInputPerM:
          description: 图片输入 token 的每百万单价（Round 6 续）；省略、null 或空字符串 = 按 `inputPerM` 计。非负、最多 9 位小数（否则 `422 details.imageInputPerM`）
          oneOf:
            - $ref: "#/components/schemas/MoneyInput"
            - type: "null"
        audioInputPerM:
          description: 音频输入 token 的每百万单价（音频接口）；省略、null 或空字符串 = 按 `inputPerM` 计（否则校验同上，`422 details.audioInputPerM`）
          oneOf:
            - $ref: "#/components/schemas/MoneyInput"
            - type: "null"
        audioOutputPerM:
          description: 音频输出 token 的每百万单价；省略、null 或空字符串 = 按 `outputPerM` 计（`422 details.audioOutputPerM`）
          oneOf:
            - $ref: "#/components/schemas/MoneyInput"
            - type: "null"
        perMinute:
          description: 每分钟输入音频的价格（按秒计费）；省略、null 或空字符串 = 0（`422 details.perMinute`）
          oneOf:
            - $ref: "#/components/schemas/MoneyInput"
            - type: "null"
        perMCharacters:
          description: 每百万语音合成输入字符的价格；省略、null 或空字符串 = 0（`422 details.perMCharacters`）
          oneOf:
            - $ref: "#/components/schemas/MoneyInput"
            - type: "null"
        schedule:
          description: 分时倍率（Round 6）；省略、null 或空数组 = 无。校验失败 → `422 details.schedule`（消息指出第几个时段、重叠或格式错误）
          oneOf:
            - type: array
              maxItems: 48
              items:
                $ref: "#/components/schemas/PriceScheduleSlot"
            - type: "null"
        scheduleTimezone:
          type: [string, "null"]
          description: IANA 时区；省略、null 或空 = `Asia/Shanghai`。非法 → `422 details.scheduleTimezone`
          example: Asia/Shanghai
        tiers:
          description: |
            阶梯价格（Round 10，见 `PriceTier`）；省略、null 或空数组 = 无。最多 5 档；`aboveInputTokens` 为 1–1 000 000 000 的整数且严格递增，
            `inputPerM` / `outputPerM` 必填，其余单价省略、null 或空字符串 = 沿用基础价格。校验失败 → `422 details.tiers`（档数）或
            `details["tiers[i].<字段>"]`；档内未知字段 → `422`（请求体不合法）
          oneOf:
            - type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/PriceTier"
            - type: "null"
        effectiveAt:
          type: string
          format: date-time

    PriceList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Price"

    ModelEntry:
      type: object
      required: [model, channels, price]
      properties:
        model:
          type: string
          description: 逻辑模型名
        channels:
          type: integer
          description: 当前用户可用的、提供该模型的已启用渠道数
        price:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
          description: 当前生效的售价；null = 未设置售价（不扣费）

    GatewayErrorClass:
      type: string
      description: |
        数据面错误类别（`protocol/errors.go`），映射见文档开头的表格。`account_disabled`（Round 6 续，403）：Key 有效但所属用户被停用。
      enum:
        - invalid_request
        - unsupported_parameter
        - authentication
        - permission
        - account_disabled
        - model_not_found
        - quota_exceeded
        - quota_exhausted
        - insufficient_balance
        - rate_limited
        - user_request_limit
        - spend_limit_exceeded
        - upstream_rate_limited
        - upstream_authentication
        - upstream_unavailable
        - upstream_timeout
        - upstream_invalid_response
        - upstream_bad_request
        - client_closed
        - plugin_error
        - internal

    LogUsage:
      type: object
      required: [input, output, cacheRead, cacheWrite, reasoning, estimated, imageInputTokens, audioInputTokens, audioOutputTokens, inputCharacters]
      properties:
        input:
          type: integer
          format: int64
          description: 全部输入 token（图片接口含图片输入）
        output:
          type: integer
          format: int64
        cacheRead:
          type: integer
          format: int64
        cacheWrite:
          type: integer
          format: int64
        reasoning:
          type: integer
          format: int64
        estimated:
          type: boolean
          description: |
            上游未返回用量（或流式中断）时按字节数估算（约 4 字节 / token）；图片接口从不估算（没有 usage 时 token 数为 0）；
            音频接口不估算 token：上游没有报告用量（也没有时长、不是语音合成）时只收 `perRequest`，此字段为 true（同 `RequestLog.usageEstimated`）
        imageInputTokens:
          type: integer
          format: int64
          description: "`input` 中的图片输入 token（Round 6 续，图片接口的 `input_tokens_details.image_tokens`）；其他请求为 0。文本输入 = `input − imageInputTokens`"
        audioInputTokens:
          type: integer
          format: int64
          description: "`input` 中的音频输入 token（音频接口的 `input_token_details.audio_tokens`）；其他请求为 0"
        audioOutputTokens:
          type: integer
          format: int64
          description: "`output` 中的音频输出 token（语音合成按 token 计量时为全部输出，除非上游给出 `output_token_details.audio_tokens`）；其他请求为 0"
        inputCharacters:
          type: integer
          format: int64
          description: 按字符计费的语音合成请求的 `input` Unicode 字符数（`perMCharacters`）；按 token 计量或其他请求为 0（实现新增，见 phase9-api.md §4）

    FallbackAttempt:
      type: object
      required: [channelId, channelName, statusCode, errorClass, durationMs]
      properties:
        channelId:
          type: string
          format: uuid
        channelName:
          type: string
        statusCode:
          type: integer
        errorClass:
          oneOf:
            - $ref: "#/components/schemas/GatewayErrorClass"
            - type: "null"
        durationMs:
          type: integer
          format: int64

    RequestLog:
      type: object
      required: [id, requestId, startedAt, user, keyId, keyName, inbound, model, channelId, channelName, upstreamModel, stream, statusCode,
        errorClass, errorMessage, attempts, fallbackPath, ttftMs, durationMs, usage, cost, charge, subscriptionId, quotaCharge, servedModel, channelTier, imageCount,
        priceMultiplier, audioSeconds, usageEstimated]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          description: 与该请求响应头 `X-OmniGate-Request-Id` 相同
        startedAt:
          type: string
          format: date-time
        user:
          type: [object, "null"]
          description: 认证失败的请求为 null
          required: [id, displayName]
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        keyId:
          type: [string, "null"]
          format: uuid
        keyName:
          type: [string, "null"]
          description: 请求时的 Key 名称快照
        inbound:
          type: string
          enum: [openai.chat, openai.responses, openai.embeddings, anthropic.messages, openai.images.generations, openai.images.edits, openai.images.variations,
            openai.audio.transcriptions, openai.audio.translations, openai.audio.speech, openai.completions]
        model:
          type: string
          description: 请求中的逻辑模型名（请求体无法解析时为空字符串）；`?model=` 按此字段过滤
        servedModel:
          type: string
          description: 实际提供服务的逻辑模型（Round 5）。路由规则回退到其他模型时与 `model` 不同，计价与配额按此模型；未回退时与 `model` 相同
        channelId:
          type: [string, "null"]
          format: uuid
          description: 最后一次尝试的渠道
        channelName:
          type: [string, "null"]
        upstreamModel:
          type: [string, "null"]
        stream:
          type: boolean
        statusCode:
          type: integer
          description: 返回给客户端的状态码；流式开始后客户端断开记为 499
        errorClass:
          oneOf:
            - $ref: "#/components/schemas/GatewayErrorClass"
            - type: "null"
        errorMessage:
          type: [string, "null"]
          description: 脱敏的错误摘要
        attempts:
          type: integer
          description: 上游尝试次数
        fallbackPath:
          type: array
          items:
            $ref: "#/components/schemas/FallbackAttempt"
        ttftMs:
          type: [integer, "null"]
          format: int64
          description: 首字节延迟（流式为首个事件写出时间）
        durationMs:
          type: integer
          format: int64
        usage:
          $ref: "#/components/schemas/LogUsage"
        cost:
          description: 上游成本（按最终渠道的 cost 价格）；仅持有 `stats.all` 时返回，否则为 null；own / shared 档的请求始终为 null
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        charge:
          $ref: "#/components/schemas/Money"
          description: 向用户收取的费用（按售价）；由订阅覆盖的请求为 `"0"`（不扣钱包）
        subscriptionId:
          type: [string, "null"]
          format: uuid
          description: 覆盖本次请求的订阅（Round 4）；走钱包的请求为 null
        quotaCharge:
          $ref: "#/components/schemas/Money"
          description: 由订阅覆盖的请求按售价折算的金额（计入 `charge` 计量的配额，不扣钱包）；其他请求为 `"0"`
        channelTier:
          description: |
            实际提供服务的渠道相对于调用者的档位（失败请求取最后一次尝试的渠道；Round 5 续）。`own` / `shared` 请求不计费：
            `charge`、`quotaCharge` 为 `"0"`，`cost` 为 null。没有尝试任何渠道的请求（认证失败、无候选、被配额 / 余额拦下且之前没有尝试）
            以及升级前的旧日志为 null。
          oneOf:
            - $ref: "#/components/schemas/ChannelTier"
            - type: "null"
        imageCount:
          type: integer
          format: int64
          minimum: 0
          description: 输出图片张数（Round 6 续，图片接口：非流式为 `data` 长度，流式为 `*.completed` 事件数）；其他请求为 0
        priceMultiplier:
          type: [string, "null"]
          description: |
            本次生效的售价倍率 = 用户组倍率 × 售价版本的分时倍率（Round 6，十进制字符串，如 `"0.4"`）；`charge` / `quotaCharge` 已乘过它。
            只有成功且有售价的 platform 档请求才有值；own / shared、失败、未定价的请求与升级前的日志为 null。
          example: "0.4"
        priceTier:
          type: [integer, "null"]
          format: int64
          description: |
            售价命中的上下文阶梯的 `aboveInputTokens`（Round 10，`phase10-api.md` §1），按实际用量（输入 + 缓存读取 + 缓存写入）选择；
            null = 基础价格、未定价或升级前的日志。套餐覆盖的请求同样记录（`quotaCharge` 按该档计）
          example: 272000
        audioSeconds:
          type: integer
          format: int64
          minimum: 0
          description: 计费的输入音频秒数（Round 6 续，音频接口：`usage.type=duration` 的 `seconds` 或 `verbose_json` 的 `duration`，不足一秒按一秒）；其他请求为 0
        usageEstimated:
          type: boolean
          description: 同 `usage.estimated`。音频接口上为 true 表示上游没有报告用量，只收了 `perRequest`
        affinity:
          type: [string, "null"]
          enum: [hit, new, miss, rebound, failover, broken, strict_failed, "off", null]
          description: 会话亲和结果（Round 12，`phase12-api.md` §4）；没有规则生效时为 null
        affinityRule:
          type: [string, "null"]
          description: 生效的会话亲和规则名称；从不记录会话值
        client:
          $ref: "#/components/schemas/LogClient"

    RequestLogList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RequestLog"

    StatsSummary:
      type: object
      required: [from, to, totals, daily, byModel, byChannel]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        totals:
          type: object
          required: [requests, success, errors, successRate, inputTokens, outputTokens, cost, charge, latencyP50Ms, latencyP95Ms, latencyP99Ms, ttftP50Ms]
          properties:
            requests:
              type: integer
              format: int64
            success:
              type: integer
              format: int64
            errors:
              type: integer
              format: int64
            successRate:
              type: number
              minimum: 0
              maximum: 1
              description: success / requests；无请求时为 0
            inputTokens:
              type: integer
              format: int64
              description: 输入 + 缓存读 + 缓存写 token
            outputTokens:
              type: integer
              format: int64
            cost:
              description: 仅持有 `stats.all` 时返回，否则为 null
              oneOf:
                - $ref: "#/components/schemas/Money"
                - type: "null"
            charge:
              $ref: "#/components/schemas/Money"
            latencyP50Ms:
              type: [integer, "null"]
            latencyP95Ms:
              type: [integer, "null"]
            latencyP99Ms:
              type: [integer, "null"]
            ttftP50Ms:
              type: [integer, "null"]
            cacheReadTokens:
              type: integer
              format: int64
            cacheWriteTokens:
              type: integer
              format: int64
            cacheHitRate:
              type: [number, "null"]
              minimum: 0
              maximum: 1
              description: cacheReadTokens / inputTokens（输入 + 缓存读 + 缓存写）；没有输入 token 时为 null
        daily:
          type: array
          items:
            type: object
            required: [date, requests, errors, inputTokens, outputTokens, charge]
            properties:
              date:
                type: string
                format: date
                description: UTC 日期 YYYY-MM-DD；没有请求的日期不出现
              requests:
                type: integer
              errors:
                type: integer
              inputTokens:
                type: integer
              outputTokens:
                type: integer
              charge:
                $ref: "#/components/schemas/Money"
        byModel:
          type: array
          maxItems: 50
          items:
            type: object
            required: [model, requests, errors, inputTokens, outputTokens, charge]
            properties:
              model:
                type: string
              requests:
                type: integer
              errors:
                type: integer
              inputTokens:
                type: integer
              outputTokens:
                type: integer
              charge:
                $ref: "#/components/schemas/Money"
        byChannel:
          type: array
          maxItems: 50
          items:
            type: object
            required: [channelId, channelName, requests, errors, latencyP95Ms]
            properties:
              channelId:
                type: [string, "null"]
                format: uuid
                description: 未到达任何渠道的请求（认证失败等）归入 null
              channelName:
                type: [string, "null"]
              requests:
                type: integer
              errors:
                type: integer
              latencyP95Ms:
                type: [integer, "null"]
              inputTokens:
                type: integer
                description: 输入 + 缓存读 + 缓存写 token
              cacheReadTokens:
                type: integer
              cacheHitRate:
                type: [number, "null"]
                description: cacheReadTokens / inputTokens；没有输入 token 时为 null
        affinity:
          type: object
          description: 各会话亲和结果的请求数（只含出现过的结果）
          additionalProperties: { type: integer }
        byClient:
          type: array
          description: 按识别出的客户端（Round 13，`phase13-api.md` §4），按请求数倒序；识别功能上线前的日志归入 `unknown`
          items:
            type: object
            required: [client, name, requests, errors, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, cacheHitRate,
              affinityHits, affinityBound, affinityHitRate, charge]
            properties:
              client: { type: string, description: 客户端 id }
              name: { type: string, description: 显示名称 }
              requests: { type: integer }
              errors: { type: integer }
              inputTokens: { type: integer, description: 输入 + 缓存读 + 缓存写 token }
              outputTokens: { type: integer }
              cacheReadTokens: { type: integer }
              cacheWriteTokens: { type: integer }
              cacheHitRate:
                type: [number, "null"]
                description: cacheReadTokens / inputTokens；没有输入 token 时为 null
              affinityHits: { type: integer, description: 会话亲和结果为 hit 的请求数 }
              affinityBound: { type: integer, description: 已有绑定的会话请求数（hit + rebound + failover + broken + strict_failed） }
              affinityHitRate:
                type: [number, "null"]
                description: affinityHits / affinityBound；affinityBound 为 0 时为 null
              charge:
                $ref: "#/components/schemas/Money"

    ClientInfo:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, example: claude-code }
        name: { type: string, example: Claude Code }
        kind:
          type: string
          enum: [agent, chat, sdk, tool, unknown]
          description: agent = 编码代理 / IDE 助手，chat = 聊天客户端，sdk = 官方 SDK，tool = 通用 HTTP 工具，unknown = 未识别

    LogClient:
      type: object
      required: [id, name, version]
      description: '识别出的客户端（Round 13，`phase13-api.md` §3）；识别功能上线前的日志为 `{ id: "unknown", name: "未知", version: null }`'
      properties:
        id: { type: string, description: "`GET /api/clients` 中的 id" }
        name: { type: string }
        version:
          type: [string, "null"]
          description: 能从请求头解析出时的版本（最多 32 个字符），否则为 null

    Wallet:
      type: object
      required: [userId, balance, reserved, available, currency, version]
      properties:
        userId:
          type: string
          format: uuid
        balance:
          $ref: "#/components/schemas/Money"
        reserved:
          $ref: "#/components/schemas/Money"
          description: 进行中请求的预留金额（仅 `billing.enforce=true` 时产生）
        available:
          $ref: "#/components/schemas/Money"
          description: balance − reserved
        currency:
          type: string
          description: 结算币种代码（与 `/api/system/info` 一致）
          example: USD
        version:
          type: integer
          description: 余额每次变化 +1（预留不影响）；钱包尚未创建时为 1。`adjust` 时必须回传

    LedgerEntry:
      type: object
      required: [id, kind, amount, balanceAfter, refType, refId, note, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [grant, charge, refund, adjust]
          description: grant = 兑换码充值或注册赠送；charge = 请求扣费；adjust = 管理员调整；refund 预留，Phase 1 未产生
        amount:
          $ref: "#/components/schemas/Money"
          description: 带符号的变动金额（扣费为负）
        balanceAfter:
          $ref: "#/components/schemas/Money"
        refType:
          type: string
          enum: [request, redeem, admin, signup]
        refId:
          type: string
          description: request = 网关请求 ID；redeem = 兑换记录 ID；admin = 调整记录 ID；signup = 用户 ID（注册赠送 `billing.signupCredit`，每个用户最多一次）
        note:
          type: [string, "null"]
          description: 兑换为 `兑换码 OG-XXXXX`；调整为管理员填写的备注
        createdAt:
          type: string
          format: date-time

    LedgerList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/LedgerEntry"

    BillingSettings:
      type: object
      required: [enforce, version]
      properties:
        enforce:
          type: boolean
          description: false = 只记录费用不扣余额；true = 预留并扣减余额，余额不足时拒绝请求
        version:
          type: integer
          description: 全部系统设置的整体版本号（与 `SystemSettingsView.version` 相同）

    BillingPreferences:
      type: object
      additionalProperties: false
      required: [quotaOverflow]
      properties:
        quotaOverflow:
          type: string
          enum: [block, wallet]
          description: 所有覆盖该模型的订阅都不可用时：`block` = 返回 429（默认）；`wallet` = 改用钱包（受 `billing.enforce` 约束）

    RedeemBatchStatus:
      type: string
      enum: [active, disabled]

    RedeemBatch:
      type: object
      required: [id, kind, amount, planId, planName, periods, count, redeemed, maxRedemptionsPerCode, perUserLimit, validFrom, expiresAt, note, status, createdAt, createdBy, version]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [wallet_credit, plan]
          description: "`wallet_credit` = 钱包充值码；`plan` = 套餐码（Round 4）"
        amount:
          description: 每个码的面额；`plan` 批次为 null
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        planId:
          type: [string, "null"]
          format: uuid
          description: 套餐码对应的套餐；`wallet_credit` 批次为 null
        planName:
          type: [string, "null"]
          description: 套餐的**当前**名称（查询时读取，不是快照）；`wallet_credit` 批次为 null
        periods:
          type: [integer, "null"]
          minimum: 1
          maximum: 120
          description: 每次兑换开通 / 续期的份数；`wallet_credit` 批次为 null
        count:
          type: integer
          description: 码的数量
        redeemed:
          type: integer
          description: 已兑换次数（所有码合计）
        maxRedemptionsPerCode:
          type: integer
        perUserLimit:
          type: integer
          description: 同一用户在本批次内最多兑换的次数
        validFrom:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        note:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/RedeemBatchStatus"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        version:
          type: integer

    RedeemBatchList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RedeemBatch"

    RedeemBatchCreateRequest:
      type: object
      additionalProperties: false
      required: [count]
      description: |
        `kind` 缺省为 `wallet_credit`，此时 `amount` 必填且大于 0，不能带 `planId` / `periods`；
        `kind=plan` 时 `planId`、`periods` 必填，不能带 `amount`（非空字符串 → `422`，`details.amount` 为“plan 类型不能设置金额”）。
      properties:
        kind:
          type: string
          enum: [wallet_credit, plan]
          default: wallet_credit
        amount:
          $ref: "#/components/schemas/MoneyInput"
          description: "`wallet_credit`：每个码的面额，必须大于 0"
        planId:
          type: string
          format: uuid
          description: "`plan`：套餐 ID（必须存在且为 `active`）"
        periods:
          type: integer
          minimum: 1
          maximum: 120
          description: "`plan`：每次兑换开通 / 续期的份数（有效期 = 套餐 `duration` × `periods`）"
        count:
          type: integer
          minimum: 1
          maximum: 1000
        maxRedemptionsPerCode:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
          description: 每个码可被兑换的总次数
        perUserLimit:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
        validFrom:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 必须晚于当前时间，且晚于 `validFrom`
        note:
          type: string
          maxLength: 500
          description: 去除首尾空白，空字符串视为未填写

    RedeemResult:
      description: "`POST /api/billing/redeem` 的成功响应，按 `kind` 区分。"
      oneOf:
        - $ref: "#/components/schemas/RedeemWalletCreditResult"
        - $ref: "#/components/schemas/RedeemPlanResult"
      discriminator:
        propertyName: kind
        mapping:
          wallet_credit: "#/components/schemas/RedeemWalletCreditResult"
          plan: "#/components/schemas/RedeemPlanResult"

    RedeemWalletCreditResult:
      type: object
      required: [kind, amount, wallet]
      properties:
        kind:
          type: string
          const: wallet_credit
        amount:
          $ref: "#/components/schemas/Money"
        wallet:
          $ref: "#/components/schemas/Wallet"

    RedeemPlanResult:
      type: object
      required: [kind, subscription]
      properties:
        kind:
          type: string
          const: plan
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: 新开通（`source=redeem`）或续期后的订阅，含当前用量；响应不区分新开通与续期（审计中的 `renewed` 区分）

    PlanStatus:
      type: string
      enum: [active, archived]
      description: "`archived` = 已下架：不能再开通 / 续期 / 生成套餐码，不影响已有订阅"

    QuotaDuration:
      type: string
      pattern: "^[1-9][0-9]{0,6}[mhd]$"
      description: 时长 `<正整数><单位>`，单位 `m`（分钟）、`h`（小时）、`d`（24 小时）；不允许前导 0、小数或组合（如 `1h30m`）。
      example: 5h

    QuotaWindow:
      description: |
        配额窗口（按 `kind` 区分，只能带该类型的字段，多余字段 → `422`）：
        - `calendar`：自然日 / 周（周一开始）/ 月，按 `timezone`（IANA 名称，缺省 `UTC`，不接受 `Local`）对齐；窗口结束即重置。
        - `rolling`：滑动窗口 `duration`（5m–31d），用量按 5 分钟分桶，窗口内各桶之和与上限比较。
        - `session`：会话窗口 `duration`（5m–31d），没有进行中的会话时，下一次计量的请求（按请求开始时间，精确到秒）开启新会话，会话结束才重置
          （类似 Claude 的 5 小时用量窗口）；尚未开始时 `windowStart` 为 null。
        - `period`：固定周期 `every`（1h–366d），从订阅开始时间起对齐。
        - `lifetime`：整个订阅期内累计，不重置。
      oneOf:
        - $ref: "#/components/schemas/QuotaWindowCalendar"
        - $ref: "#/components/schemas/QuotaWindowRolling"
        - $ref: "#/components/schemas/QuotaWindowSession"
        - $ref: "#/components/schemas/QuotaWindowPeriod"
        - $ref: "#/components/schemas/QuotaWindowLifetime"
      discriminator:
        propertyName: kind
        mapping:
          calendar: "#/components/schemas/QuotaWindowCalendar"
          rolling: "#/components/schemas/QuotaWindowRolling"
          session: "#/components/schemas/QuotaWindowSession"
          period: "#/components/schemas/QuotaWindowPeriod"
          lifetime: "#/components/schemas/QuotaWindowLifetime"

    QuotaWindowCalendar:
      type: object
      additionalProperties: false
      required: [kind, unit]
      properties:
        kind:
          type: string
          const: calendar
        unit:
          type: string
          enum: [day, week, month]
        timezone:
          type: string
          default: UTC
          description: IANA 时区名，如 `Asia/Shanghai`；响应中总是给出（缺省补为 `UTC`）
          example: Asia/Shanghai

    QuotaWindowRolling:
      type: object
      additionalProperties: false
      required: [kind, duration]
      properties:
        kind:
          type: string
          const: rolling
        duration:
          $ref: "#/components/schemas/QuotaDuration"
          description: 5m–31d

    QuotaWindowSession:
      type: object
      additionalProperties: false
      required: [kind, duration]
      properties:
        kind:
          type: string
          const: session
        duration:
          $ref: "#/components/schemas/QuotaDuration"
          description: 5m–31d

    QuotaWindowPeriod:
      type: object
      additionalProperties: false
      required: [kind, every]
      properties:
        kind:
          type: string
          const: period
        every:
          $ref: "#/components/schemas/QuotaDuration"
          description: 1h–366d

    QuotaWindowLifetime:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          const: lifetime

    QuotaMeter:
      type: string
      anyOf:
        - enum: [requests, tokens.input, tokens.output, tokens.total, images, audio_seconds, charge]
        - pattern: "^custom:[a-z0-9]+(\\.[a-z0-9-]+)+\\.[a-z][a-z0-9_]{0,40}$"
      description: |
        `custom:<插件 ID>.<计量名>`（Round 6 续，phase9-api.md §3）：由计费插件的 `computeUnits` 计算（结算时执行，失败按 0）。保存规则时校验插件
        已启用且有已批准版本声明该计量（否则 `422`，`details["rules[i].meter"]` 说明原因），并把该版本固定在规则的 `pluginVersionId` 中；
        上限可以是小数。可选列表见 `GET /api/admin/billing/meters`。
        计量：`requests` = 每个请求 1；`tokens.input` = 输入 + 缓存读 + 缓存写 token；`tokens.output` = 输出 token（含推理）；
        `tokens.total` = 两者之和；`images` = 输出图片张数（Round 6 续，图片接口；其他请求为 0）；
        `audio_seconds` = 计费的输入音频秒数（Round 6 续，音频接口，同请求日志 `audioSeconds`；其他请求为 0）；
        `charge` = 按售价计算的金额（结算币种；即使请求由订阅覆盖、不扣钱包也照常计算，模型没有售价时为 0）。
        非法取值 → `422`，消息“必须为 requests、tokens.input、tokens.output、tokens.total、images、audio_seconds 或 charge”。
        计量值再乘以 `modelWeights` 中该模型的倍率。

    QuotaRuleInput:
      type: object
      additionalProperties: false
      required: [id, meter, window, limit]
      description: 创建 / 修改套餐时提交的配额规则。
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_-]{1,32}$"
          description: 套餐内唯一（去除首尾空白），如 `5h`、`weekly`；用量按 `id` 记录
        label:
          type: string
          maxLength: 64
          description: 展示名（缺省 `""`，展示与阻断消息中回退为 `id`）
        meter:
          $ref: "#/components/schemas/QuotaMeter"
        window:
          $ref: "#/components/schemas/QuotaWindow"
        limit:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: 上限（十进制字符串，必须大于 0，最多 9 位小数）；`requests` / `tokens.*` / `images` 必须为整数，`charge` 为结算币种金额
          example: "200"
        models:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: 仅对这些逻辑模型计量（不能重复、不能有首尾空格）；省略或空 = 套餐覆盖的全部模型
        modelWeights:
          type: object
          maxProperties: 200
          additionalProperties:
            type: string
            description: 十进制倍率，0–1000（0 = 该模型不计入本规则）
          description: '计量倍率，如 `{"gpt-5.6-sol": "5"}`；未列出的模型为 1'
          example: { gpt-5.6-sol: "5" }

    QuotaRule:
      type: object
      required: [id, label, meter, window, limit, models, modelWeights]
      description: |
        已保存的配额规则（响应中缺省值都已补全）。字段含义见 `QuotaRuleInput`。Round 5 起规则不再有 `onExceed`
        （超额处理改由用户的超额偏好与 Key 策略 `quotaOverflow` 决定；提交该字段会因未知字段被拒绝）。
      properties:
        id:
          type: string
        label:
          type: string
          description: 未设置时为 `""`
        meter:
          $ref: "#/components/schemas/QuotaMeter"
        window:
          $ref: "#/components/schemas/QuotaWindow"
        limit:
          type: string
          description: 十进制字符串，按提交时的写法保存
        models:
          type: array
          items:
            type: string
        modelWeights:
          type: object
          additionalProperties:
            type: string
        pluginVersionId:
          type: string
          format: uuid
          description: |
            只读：自定义计量固定的计费插件版本（保存规则时解析为声明该计量的最新已批准版本；订阅快照随之固定，插件升级不影响已开通订阅）。
            内置计量省略。提交时忽略；`PATCH` 不带 `rules` 时保留原值。
        meterLabel:
          type: string
          description: 只读：自定义计量的 `label`（取自固定版本的 manifest，随规则快照保存，用户侧页面无需插件权限即可显示）；内置计量省略
        meterUnit:
          type: string
          description: 只读：自定义计量的 `unit`（同上；没有单位时省略）

    Usage:
      type: object
      description: 归一化用量（计费插件 `computeUnits` 的 `usage`）；`input` 不含缓存读写，`output` 含推理 token
      additionalProperties: true
      properties:
        input:
          type: integer
        output:
          type: integer
        cacheRead:
          type: integer
        cacheWrite:
          type: integer
        reasoning:
          type: integer
        estimated:
          type: boolean
        images:
          type: integer
        audioSeconds:
          type: integer

    BillingCtx:
      type: object
      additionalProperties: false
      description: 计费插件 `computeUnits` 的 `ctx`（phase9-api.md §3）
      properties:
        model:
          type: string
          description: 请求的逻辑模型
        servedModel:
          type: string
          description: 实际服务的模型（路由回退后可能不同）
        channelId:
          type: string
        channelTier:
          type: string
          enum: [own, shared, platform]
        userGroup:
          type: string
          description: 用户组名称（未知时为空）
        inbound:
          type: string
          example: openai.chat
        imageCount:
          type: integer
        audioSeconds:
          type: number

    MeterOption:
      type: object
      required: [meter, label, builtin, plugin, integer]
      properties:
        meter:
          type: string
          example: custom:community.billing-examples.weighted_tokens
        label:
          type: string
        unit:
          type: string
        builtin:
          type: boolean
        integer:
          type: boolean
          description: 规则上限必须为整数（内置的 requests / tokens.* / images / audio_seconds）
        plugin:
          description: 提供该计量的插件（最新已批准版本）；内置计量为 null
          oneOf:
            - type: "null"
            - type: object
              required: [id, key, name, version, versionId]
              properties:
                id:
                  type: string
                  format: uuid
                key:
                  type: string
                name:
                  type: string
                version:
                  type: string
                versionId:
                  type: string
                  format: uuid

    Plan:
      type: object
      required: [id, name, description, listPrice, duration, models, rules, stackable, status, subscribers, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        listPrice:
          description: 展示用标价（结算币种）；不参与任何扣费
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        duration:
          $ref: "#/components/schemas/QuotaDuration"
          description: 每份（每个周期）的有效期，1h–366d，如 `30d`
        models:
          type: array
          items:
            type: string
          description: 覆盖的逻辑模型；空 = 全部模型
        rules:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/QuotaRule"
        stackable:
          type: boolean
          description: true = 每次开通都生成一份新订阅（可同时持有多份）；false = 已有有效订阅时延长它
        status:
          $ref: "#/components/schemas/PlanStatus"
        subscribers:
          type: integer
          description: 当前有效（未取消、未到期）的订阅数
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlanList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Plan"

    CatalogPlan:
      type: object
      description: 用户可见的套餐目录条目（`Plan` 去掉管理字段 `status`、`subscribers`、`version`、`createdAt`、`updatedAt`）
      required: [id, name, description, listPrice, duration, models, rules, stackable]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        listPrice:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        duration:
          $ref: "#/components/schemas/QuotaDuration"
        models:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/QuotaRule"
        stackable:
          type: boolean

    CatalogPlanList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CatalogPlan"

    PlanCreateRequest:
      type: object
      additionalProperties: false
      required: [name, duration, rules]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 去除首尾空白后 1–100 个字符
        description:
          type: string
          maxLength: 2000
        listPrice:
          description: 标价（十进制字符串，不能为负，最多 9 位小数）或 null
          oneOf:
            - $ref: "#/components/schemas/MoneyInput"
            - type: "null"
        duration:
          $ref: "#/components/schemas/QuotaDuration"
          description: 每份的有效期，1h–366d
        models:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: 覆盖的逻辑模型（不能重复、不能有首尾空格）；省略或空 = 全部模型
        rules:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/QuotaRuleInput"
        stackable:
          type: boolean
          default: false
        status:
          $ref: "#/components/schemas/PlanStatus"

    PlanPatchRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: 省略的字段保持不变；`models`、`rules` 提交时整体替换；`listPrice` 显式为 null 时清除。
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        listPrice:
          oneOf:
            - $ref: "#/components/schemas/MoneyInput"
            - type: "null"
        duration:
          $ref: "#/components/schemas/QuotaDuration"
        models:
          type: array
          maxItems: 200
          items:
            type: string
        rules:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/QuotaRuleInput"
        stackable:
          type: boolean
        status:
          $ref: "#/components/schemas/PlanStatus"
        version:
          type: integer
          description: 必须等于当前 `version`

    SubscriptionStatus:
      type: string
      enum: [active, expired, cancelled]
      description: 由时间推导：未取消且 `now ≥ endsAt` 为 `expired`；取消立即生效

    SubscriptionRule:
      description: 订阅的规则快照 + 当前窗口用量（与网关判定使用同一套计算）。
      allOf:
        - $ref: "#/components/schemas/QuotaRule"
        - type: object
          required: [used, windowStart, resetsAt, remaining, exceeded]
          properties:
            used:
              type: string
              description: 当前窗口已用量（加权后，十进制字符串；`charge` 计量为金额）
              example: "137"
            windowStart:
              type: [string, "null"]
              format: date-time
              description: |
                当前窗口起点：calendar / period 为窗口开始；lifetime 为订阅开始；rolling 为 `now − duration`；session 为会话开始，
                尚无进行中的会话时为 null
            resetsAt:
              type: [string, "null"]
              format: date-time
              description: |
                窗口重置时间：calendar / period 为窗口结束；session 为会话开始 + `duration`（无会话时为 null）；rolling 为最早一个计入用量的
                5 分钟分桶过期的时间（无用量时为 null）；lifetime 为 null
            remaining:
              type: string
              description: max(limit − used, 0)
            exceeded:
              type: boolean
              description: used ≥ limit

    Subscription:
      type: object
      required: [id, user, plan, status, startsAt, endsAt, source, models, rules, createdAt]
      properties:
        id:
          type: string
          format: uuid
        user:
          type: object
          required: [id, displayName]
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        plan:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              description: 开通时的套餐名快照
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: 续期时延长；取消不修改 `endsAt`
        source:
          type: string
          enum: [admin, redeem]
        models:
          type: array
          items:
            type: string
          description: 覆盖的逻辑模型快照；空 = 全部模型
        rules:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionRule"
        createdAt:
          type: string
          format: date-time

    SubscriptionList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Subscription"

    SubscriptionBulkTarget:
      description: |
        批量操作的目标（Round 6 续）：指定订阅 ID，或按套餐选择全部有效订阅。无论哪种方式都只处理 `active` 且 `endsAt` 晚于当前时间的订阅。
        不合法（缺失、不是对象、ID 不是 UUID、按套餐时 `status` 不是 `active`、`planId` 不是 UUID）→ `422 details.target`。
      oneOf:
        - type: object
          title: 指定订阅
          required: [ids]
          properties:
            ids:
              type: array
              minItems: 1
              maxItems: 1000
              description: 订阅 ID（重复的去重；已取消 / 已过期 / 不存在的被忽略）
              items:
                type: string
                format: uuid
        - type: object
          title: 按套餐
          required: [status]
          properties:
            planId:
              type: [string, "null"]
              format: uuid
              description: 套餐 ID；省略或 null = 全部套餐；不存在 → `404 not_found`
            status:
              type: string
              const: active

    SubscriptionQuotaResetRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          $ref: "#/components/schemas/SubscriptionBulkTarget"
        rules:
          type: [array, "null"]
          minItems: 1
          maxItems: 50
          description: 只重置这些规则 ID（格式同 `QuotaRuleInput.id`）；省略或 null = 全部规则。空数组 → `422 details.rules`
          items:
            type: string
            pattern: "^[a-z0-9_-]{1,32}$"
        includeLifetime:
          type: boolean
          default: false
          description: 是否同时清零 `lifetime`（总量）规则；默认不清零，避免误把一次性额度清零
        note:
          type: string
          maxLength: 200
          default: ""
          description: 备注（去除首尾空白后最多 200 个字符，可为空），写入审计与用户通知

    SubscriptionExtendRequest:
      type: object
      additionalProperties: false
      required: [target, duration]
      properties:
        target:
          $ref: "#/components/schemas/SubscriptionBulkTarget"
        duration:
          $ref: "#/components/schemas/QuotaDuration"
          description: 延长的时长，1h–366d（解析规则同套餐 `duration`），如 `3d`
        note:
          type: string
          maxLength: 200
          default: ""
          description: 备注（去除首尾空白后最多 200 个字符，可为空），写入审计与用户通知

    SubscriptionBulkResult:
      type: object
      required: [affected, subscriptions]
      properties:
        affected:
          type: integer
          minimum: 0
          description: 受影响（dryRun 时为将受影响）的订阅数
        subscriptions:
          type: array
          maxItems: 500
          description: 受影响订阅的 ID，按订阅创建时间升序，最多返回前 500 个
          items:
            type: string
            format: uuid

    IdNameRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    ResetCardKind:
      type: string
      enum: ["5h", weekly, both]
      description: |
        `5h`：session / rolling 窗口、时长恰为 5 小时的规则；`weekly`：时长恰为 7 天；`both`：两者（同一时刻一起重置）。按窗口时长匹配，与规则 id 无关。

    ResetCardTarget:
      description: 发放对象。响应中 `groupName` / `planName` 为发放时的名称快照。
      oneOf:
        - type: object
          title: 指定用户
          required: [type, userIds]
          properties:
            type: { type: string, const: users }
            userIds:
              type: array
              minItems: 1
              maxItems: 1000
              items: { type: string, format: uuid }
        - type: object
          title: 用户组
          required: [type, groupId]
          properties:
            type: { type: string, const: group }
            groupId: { type: string, format: uuid }
            groupName: { type: string, readOnly: true }
        - type: object
          title: 套餐有效订阅用户
          required: [type, planId]
          properties:
            type: { type: string, const: plan }
            planId: { type: string, format: uuid }
            planName: { type: string, readOnly: true }
        - type: object
          title: 全部用户
          required: [type]
          properties:
            type: { type: string, const: all }

    ResetCardIssueRequest:
      type: object
      additionalProperties: false
      required: [kind, quantity, target]
      properties:
        kind:
          $ref: "#/components/schemas/ResetCardKind"
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          description: 每人张数
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: 过期时间（必须晚于当前时间）；null / 省略 = 永不过期
        planIds:
          type: [array, "null"]
          maxItems: 50
          description: 限定套餐：卡只能用于这些套餐的订阅；null / 省略 / [] = 不限
          items: { type: string, format: uuid }
        note:
          type: string
          maxLength: 200
          default: ""
        target:
          $ref: "#/components/schemas/ResetCardTarget"

    ResetCardCounts:
      type: object
      required: [issued, used, available, expired, revoked]
      description: 各状态互斥，之和等于 `issued`
      properties:
        issued: { type: integer }
        used: { type: integer }
        available: { type: integer }
        expired: { type: integer, description: 未使用、未作废且已过期 }
        revoked: { type: integer }

    ResetCardBatch:
      type: object
      required: [id, kind, quantity, recipients, target, plans, expiresAt, note, status, counts, createdBy, createdAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          $ref: "#/components/schemas/ResetCardKind"
        quantity: { type: integer }
        recipients: { type: integer }
        target:
          $ref: "#/components/schemas/ResetCardTarget"
        plans:
          type: array
          description: 限定套餐（当前名称）；[] = 不限
          items:
            $ref: "#/components/schemas/IdNameRef"
        expiresAt: { type: [string, "null"], format: date-time }
        note: { type: string }
        status: { type: string, enum: [active, revoked] }
        counts:
          $ref: "#/components/schemas/ResetCardCounts"
        createdBy:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }

    ResetCardBatchList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ResetCardBatch"

    ResetCardIssueResult:
      type: object
      required: [recipients, cards, batch]
      properties:
        recipients: { type: integer, minimum: 0 }
        cards: { type: integer, minimum: 0, description: recipients × quantity }
        batch:
          description: 新批次；dryRun 时为 null
          oneOf:
            - $ref: "#/components/schemas/ResetCardBatch"
            - type: "null"

    ResetCard:
      type: object
      required: [id, batchId, user, kind, status, expiresAt, plans, note, createdAt, usedAt, subscription, revokedAt]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        user:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        kind:
          $ref: "#/components/schemas/ResetCardKind"
        status:
          type: string
          enum: [available, used, expired, revoked]
          description: "`expired` 为派生状态：未使用且 `expiresAt` 已过"
        expiresAt: { type: [string, "null"], format: date-time }
        plans:
          type: array
          description: 限定套餐；[] = 不限
          items:
            $ref: "#/components/schemas/IdNameRef"
        note: { type: string }
        createdAt: { type: string, format: date-time }
        usedAt: { type: [string, "null"], format: date-time }
        subscription:
          description: 使用在哪份订阅
          oneOf:
            - type: object
              required: [id, planName]
              properties:
                id: { type: string, format: uuid }
                planName: { type: string }
            - type: "null"
        revokedAt: { type: [string, "null"], format: date-time }

    ResetCardList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ResetCard"

    MyResetCards:
      type: object
      required: [items, available]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ResetCard"
        available:
          type: object
          description: 可用的卡数（按卡类型）
          required: ["5h", weekly, both]
          properties:
            "5h": { type: integer }
            weekly: { type: integer }
            both: { type: integer }

    ResetCardPreview:
      type: object
      required: [card, now, subscriptions]
      properties:
        card:
          $ref: "#/components/schemas/ResetCard"
        now: { type: string, format: date-time, description: 服务器时间 }
        subscriptions:
          type: array
          description: 这张卡可用的有效订阅（卡不可用时为空）
          items:
            type: object
            required: [id, plan, endsAt, rules, hasUsage]
            properties:
              id: { type: string, format: uuid }
              plan:
                $ref: "#/components/schemas/IdNameRef"
              endsAt: { type: string, format: date-time }
              rules:
                type: array
                description: 会被重置的规则及当前用量
                items:
                  $ref: "#/components/schemas/SubscriptionRule"
              hasUsage: { type: boolean, description: 其中任一窗口有用量 }

    ResetCardUseResult:
      type: object
      required: [card, subscription, rules]
      properties:
        card:
          $ref: "#/components/schemas/ResetCard"
        subscription:
          $ref: "#/components/schemas/Subscription"
        rules:
          type: array
          description: 被重置的规则 ID
          items: { type: string }

    CompatibleRequestBody:
      type: object
      additionalProperties: true
      required: [model]
      description: OpenAI / Anthropic 兼容的请求体，字段定义见对应官方规范。`model` 为 OmniGate 中配置的逻辑模型名。
      properties:
        model:
          type: string
        stream:
          type: boolean
          default: false

    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required: [id, object, created, owned_by]
            properties:
              id:
                type: string
              object:
                type: string
                const: model
              created:
                type: integer
                format: int64
                description: 当前 Unix 时间（秒）
              owned_by:
                type: string
                const: omnigate

    AnthropicModelList:
      type: object
      required: [data, has_more, first_id, last_id]
      properties:
        data:
          type: array
          items:
            type: object
            required: [type, id, display_name, created_at]
            properties:
              type:
                type: string
                const: model
              id:
                type: string
              display_name:
                type: string
                description: 与 `id` 相同
              created_at:
                type: string
                format: date-time
                description: 当前时间
        has_more:
          type: boolean
          const: false
        first_id:
          type: [string, "null"]
        last_id:
          type: [string, "null"]

    RouteStrategy:
      type: string
      enum: [priority, weighted, round_robin, least_latency, lowest_cost]
      description: |
        `priority`（默认）：优先级分组，组内按权重随机；`weighted`：忽略优先级，全部按权重随机；`round_robin`：按 targets 顺序
        （targets 为空时按渠道列表顺序）轮询，进程内计数；`least_latency`：按近期上游首字节延迟（进程内 EWMA，α = 0.3，只统计成功的尝试）
        从低到高，没有数据的排最后；`lowest_cost`：按该渠道该模型的成本价（输入 + 输出单价之和，按上游模型名查找，与结算相同）从低到高，没有成本价的排最后。

    RouteRetryClass:
      type: string
      enum: [rate_limit, server_error, timeout, network, auth_error, not_found, client_error]
      description: |
        可以换渠道重试的失败类型，只按上游 HTTP 状态码判断（不解析错误信息）：`rate_limit` = 上游 429；`timeout` = 等待响应头超时、上游 408；
        `network` = 连接失败、被网络策略拒绝、读取响应 / 流式首个事件前中断；`server_error` = 上游 5xx、3xx、畸形或不完整的响应、插件 Hook 失败；
        `auth_error` = 上游 401/403；`not_found` = 上游 404；`client_error` = 上游其他 4xx（400、402、409、413、422…）。
        默认（新规则与系统设置 `gateway.retryOn`）为除 `client_error` 外全部。协议转换错误、客户端断开永不重试。

    RouteTarget:
      type: object
      additionalProperties: false
      required: [channelId]
      properties:
        channelId:
          type: string
          format: uuid
        priority:
          type: [integer, "null"]
          description: 覆盖渠道优先级；null 或省略 = 沿用渠道设置
        weight:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000
          description: 覆盖渠道权重；null 或省略 = 沿用渠道设置

    RouteMatch:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: 精确的逻辑模型名，或带 `*` 的通配（`*` 匹配任意字符序列，其他字符均按字面匹配）；保存时去掉首尾空格并去重
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: 空 = 所有角色

    RouteRetry:
      type: object
      required: [maxAttempts, retryOn]
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 5
          description: 每个模型（含回退模型）最多尝试的渠道数，含首次
        retryOn:
          type: array
          items:
            $ref: "#/components/schemas/RouteRetryClass"
          description: 失败类型不在列表中时立即返回该错误（不再换渠道，也不使用回退模型）

    RouteRule:
      type: object
      required: [id, name, description, enabled, position, match, targets, strategy, protocolPreference, retry, fallbackModels, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        position:
          type: integer
          description: 规则顺序，从 0 开始；按顺序匹配，第一个命中的规则生效
        match:
          $ref: "#/components/schemas/RouteMatch"
        targets:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RouteTarget"
          description: 空 = 该模型的全部可用渠道。最终候选 = 用户本来可用的渠道（含 Key 的 allowedChannels 限制）∩ targets，规则永远不会扩大访问范围
        strategy:
          $ref: "#/components/schemas/RouteStrategy"
        protocolPreference:
          type: string
          enum: [native_first, ignore]
          description: native_first（默认）：同一档内优先选择不需要协议转换的渠道
        retry:
          $ref: "#/components/schemas/RouteRetry"
        fallbackModels:
          type: array
          maxItems: 5
          items:
            type: string
          description: 本模型所有尝试都失败后依次改用的逻辑模型（精确名称）。回退模型同样经过 Key 策略、路由（匹配它自己的规则的 targets / 策略）、配额与预留
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RouteRuleInput:
      type: object
      additionalProperties: false
      description: |
        创建时 `name`、`match` 必填，默认值：`enabled: true`、`targets: []`、`strategy: priority`、`protocolPreference: native_first`、
        `retry: {maxAttempts: 3, retryOn: 除 client_error 外全部}`、`fallbackModels: []`、`description: ""`。修改时必须带 `version`，创建时不能带。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        enabled:
          type: boolean
        match:
          $ref: "#/components/schemas/RouteMatch"
        targets:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RouteTarget"
        strategy:
          $ref: "#/components/schemas/RouteStrategy"
        protocolPreference:
          type: string
          enum: [native_first, ignore]
        retry:
          type: object
          additionalProperties: false
          properties:
            maxAttempts:
              type: integer
              minimum: 1
              maximum: 5
            retryOn:
              type: array
              items:
                $ref: "#/components/schemas/RouteRetryClass"
        fallbackModels:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 128
            description: 不能包含 `*`
        version:
          type: integer

    RouteRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RouteRule"

    RoutePreviewCandidate:
      type: object
      required: [channelId, channelName, channelType, tier, priority, weight, upstreamDialect, conversionHops, breaker, latencyMs, costPerM, skipped]
      properties:
        channelId:
          type: string
          format: uuid
        channelName:
          type: string
        channelType:
          $ref: "#/components/schemas/ChannelType"
        tier:
          $ref: "#/components/schemas/ChannelTier"
          description: 相对于被预览用户的档位；规则（targets 覆盖、策略）只作用于 platform 档
        priority:
          type: integer
          description: 生效的优先级（platform 档已应用 target 覆盖）
        weight:
          type: integer
          description: 生效的权重（已应用 target 覆盖）
        upstreamDialect:
          type: string
          enum: [openai.chat, openai.responses, anthropic.messages, openai.embeddings]
          description: 实际使用的上游协议
        conversionHops:
          type: integer
          enum: [0, 1, 2]
        breaker:
          type: string
          enum: [closed, open, half_open]
        latencyMs:
          type: [integer, "null"]
          description: 该渠道该模型的近期首字节延迟（EWMA，毫秒）；没有数据为 null
        costPerM:
          description: 成本价输入 + 输出单价之和；没有成本价为 null
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        skipped:
          type: [string, "null"]
          description: 跳过原因（熔断中、不支持该入口协议、该用户无权使用……）；可用时为 null

    RoutePreview:
      type: object
      required: [rule, strategy, maxAttempts, candidates, fallbackModels, tierOrder]
      properties:
        rule:
          type: [object, "null"]
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        strategy:
          $ref: "#/components/schemas/RouteStrategy"
        maxAttempts:
          type: integer
          description: 命中规则的 `retry.maxAttempts`；没有规则时为系统设置 `gateway.maxAttempts`
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/RoutePreviewCandidate"
        fallbackModels:
          type: array
          items:
            type: string
        tierOrder:
          type: array
          description: 档位的尝试顺序（固定为 own → shared → platform）
          items:
            $ref: "#/components/schemas/ChannelTier"
          example: [own, shared, platform]

    ChannelTier:
      type: string
      enum: [own, shared, platform]
      description: |
        渠道相对于调用者的档位（`docs/contracts/phase5-api.md` §1）：`own` 调用者自己的渠道；`shared` 其他普通用户共享给调用者的渠道；
        `platform` 所有者为 `system_admin` / `channel_admin` 的渠道（global 或共享给调用者）。own / shared 不计费，platform 按售价计费并计入套餐配额。

    SystemSettings:
      type: object
      required: [site, auth, billing, gateway, notifications]
      properties:
        site:
          type: object
          required: [name, announcement, landingEnabled, docsUrl, publicModelPlaza]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 50
              default: OmniGate
            announcement:
              type: string
              maxLength: 500
              default: ""
              description: 控制台顶部公告；空 = 不显示
            landingEnabled:
              type: boolean
              default: true
              description: false：访问 "/" 直接进入控制台（未登录则去登录）
            docsUrl:
              type: string
              maxLength: 500
              default: ""
              description: 空或 http(s) URL
            publicModelPlaza:
              type: boolean
              default: true
              description: true：未登录也可访问平台模型广场（`GET /api/plaza/models`、落地页 `/models`）；false：需要登录，否则 401
        auth:
          type: object
          required: [registrationMode, allowedEmailDomains]
          properties:
            registrationMode:
              $ref: "#/components/schemas/RegistrationMode"
              description: 新用户首次登录时是否自动创建；默认取 `OMNIGATE_REGISTRATION_MODE`
            allowedEmailDomains:
              type: array
              maxItems: 100
              items:
                type: string
              description: restricted 模式下允许的（已验证）邮箱域名；默认取 `OMNIGATE_AUTH_ALLOWED_EMAIL_DOMAINS`
        billing:
          type: object
          required: [enforce, signupCredit]
          properties:
            enforce:
              type: boolean
              default: false
              description: 原 `billing.enforce`（`/api/admin/billing/settings` 为其别名）
            signupCredit:
              $ref: "#/components/schemas/Money"
              description: 新用户首次登录时赠送的余额（ledger `grant` / `signup`），默认 `"0"`
        gateway:
          type: object
          required: [maxAttempts, logRetentionDays]
          properties:
            maxAttempts:
              type: integer
              minimum: 1
              maximum: 5
              default: 3
              description: 没有路由规则命中时每个请求最多尝试的渠道数
            logRetentionDays:
              type: integer
              minimum: 0
              maximum: 3650
              default: 90
              description: 请求日志保留天数，0 = 永久。每天执行一次（启动时也执行）：删除整月早于截止时间的分区，并删除边界分区中更早的行
            affinity:
              $ref: "#/components/schemas/AffinitySettings"
        notifications:
          $ref: "#/components/schemas/NotificationSettings"

    AffinitySettings:
      type: object
      description: |
        会话亲和（Round 12，`phase12-api.md` §1）。字段名与 new-api 的“渠道亲和”相同（snake_case），new-api 的 JSON 可直接写入：
        未知字段忽略、`null` 数组视为空、缺少的全局字段取默认值。默认值为内置的 `gpt session`、`codex cli trace`、`claude cli trace`
        三条规则（§1.1，按此顺序）。
        校验失败 → 422，`details["gateway.affinity"]` 列出字段路径（如 `rules[0].key_sources[0].type`）。
      required: [enabled, session_mode, switch_on_success, keep_on_channel_disabled, max_entries, default_ttl_seconds, rules]
      properties:
        enabled: { type: boolean, default: true }
        session_mode: { type: string, enum: ["off", prefer, strict], default: prefer }
        switch_on_success: { type: boolean, default: true }
        keep_on_channel_disabled: { type: boolean, default: false }
        max_entries: { type: integer, minimum: 1, maximum: 1000000, default: 100000 }
        default_ttl_seconds: { type: integer, minimum: 1, maximum: 2592000, default: 3600 }
        rules:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AffinityRule"

    AffinityRule:
      type: object
      required: [name, key_sources]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: 唯一 }
        model_regex: { type: array, maxItems: 32, items: { type: string, maxLength: 512 }, description: 逻辑模型，任一匹配；空 = 任意 }
        path_regex: { type: array, maxItems: 32, items: { type: string, maxLength: 512 }, description: 请求路径，任一匹配；空 = 任意 }
        user_agent_include: { type: array, maxItems: 32, items: { type: string }, description: 不区分大小写的子串，任一包含；空 = 不限 }
        key_sources:
          type: array
          minItems: 1
          maxItems: 16
          description: 按顺序取第一个非空值；`context_int` / `context_string`（new-api 内部类型）被拒绝；`anchor`（OmniGate 扩展，对话锚点，§2.1.1）不接受 key / path
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [gjson, request_header, anchor] }
              path: { type: string, maxLength: 256, description: gjson 路径 }
              key: { type: string, maxLength: 64, description: 请求头名称 }
        value_regex: { type: string }
        ttl_seconds: { type: integer, minimum: 0, maximum: 2592000, description: 0 = default_ttl_seconds }
        param_override_template:
          type: [object, "null"]
          description: 只支持 `pass_headers` 操作；禁止透传的请求头见 `phase12-api.md` §1
          properties:
            operations:
              type: array
              maxItems: 8
              items:
                type: object
                required: [mode, value]
                properties:
                  mode: { type: string, enum: [pass_headers] }
                  value:
                    description: 1–64 个请求头名称（或逗号分隔的字符串）
                    oneOf:
                      - { type: array, items: { type: string } }
                      - { type: string }
                  keep_origin: { type: boolean, description: true = 渠道显式配置的同名请求头保持渠道的值 }
        skip_retry_on_failure: { type: boolean, description: new-api 旧字段：session_mode 为空时 true = strict }
        session_mode: { type: string, enum: ["", inherit, "off", prefer, strict] }
        include_using_group: { type: boolean }
        include_model_name: { type: boolean }
        include_rule_name: { type: boolean }
        inject_prompt_cache_key:
          type: boolean
          default: false
          description: OmniGate 扩展（§2.6）：OpenAI 格式（Chat / Responses）上游请求体没有非空 prompt_cache_key 时补全 `og-` + 32 个十六进制字符（按用户、按对话派生）
        inject_session_header:
          type: string
          default: ""
          maxLength: 64
          description: OmniGate 扩展（§2.6）：OpenAI 格式上游请求没有该请求头时补全为按对话派生的 UUID（v8）；空 = 关闭；禁止透传的请求头不允许
        client_include:
          type: array
          default: []
          items: { type: string }
          description: OmniGate 扩展（Round 13，`phase13-api.md` §5）：只对识别出的这些客户端生效（`GET /api/clients` 中的 id，去重）；空 = 任意客户端；未知 id → 422

    AffinityStats:
      type: object
      required: [entries, maxEntries, rules]
      properties:
        entries: { type: integer }
        maxEntries: { type: integer }
        rules:
          type: object
          description: 按规则名称的有效绑定数
          additionalProperties: { type: integer }

    SystemSettingsPatch:
      type: object
      additionalProperties: false
      description: 按分组的部分更新；每个字段可取 `SystemSettings` 中对应的类型，或 `null`（恢复为环境变量 / 默认值）。
      properties:
        site:
          type: object
          additionalProperties: false
          properties:
            name: { type: [string, "null"] }
            announcement: { type: [string, "null"] }
            landingEnabled: { type: [boolean, "null"] }
            docsUrl: { type: [string, "null"] }
            publicModelPlaza: { type: [boolean, "null"] }
        auth:
          type: object
          additionalProperties: false
          properties:
            registrationMode: { type: [string, "null"], enum: [open, restricted, closed, null] }
            allowedEmailDomains:
              type: [array, "null"]
              items: { type: string }
        billing:
          type: object
          additionalProperties: false
          properties:
            enforce: { type: [boolean, "null"] }
            signupCredit: { type: [string, "null"] }
        gateway:
          type: object
          additionalProperties: false
          properties:
            maxAttempts: { type: [integer, "null"] }
            logRetentionDays: { type: [integer, "null"] }
            affinity:
              description: 整体替换；`null` 恢复默认值（内置预设）
              oneOf:
                - $ref: "#/components/schemas/AffinitySettings"
                - type: "null"
        notifications:
          type: object
          additionalProperties: false
          description: |
            嵌套形式（来源键为 `notifications.smtp.host` 等）。`smtp.password` 只写：字符串 = 新密码（加密存储），
            `""` = 清除数据库中的密码（不回退到环境变量），`null` = 恢复为环境变量 / 未设置。生产环境 `security: none` → 422。
            任一 `smtp.*` 变化时除 `settings.update` 外另写审计 `notifications.smtp_update`（不含密码）。
          properties:
            smtp:
              type: object
              additionalProperties: false
              properties:
                host: { type: [string, "null"] }
                port: { type: [integer, "null"] }
                security: { type: [string, "null"], enum: [starttls, tls, none, null] }
                username: { type: [string, "null"] }
                password: { type: [string, "null"], writeOnly: true }
                from: { type: [string, "null"] }
            enabled: { type: [boolean, "null"] }
            emailRateLimitPerHour: { type: [integer, "null"] }

    SystemSettingsView:
      type: object
      required: [settings, sources, readonly, version]
      properties:
        settings:
          $ref: "#/components/schemas/SystemSettings"
        sources:
          type: object
          description: 每个字段（如 `"site.name"`）的来源
          additionalProperties:
            type: string
            enum: [db, env, default]
          example: { site.name: db, auth.registrationMode: env, gateway.maxAttempts: default }
        readonly:
          type: object
          description: 只能通过环境变量配置的项（只读显示）
          required: [currency, publicUrl, channelsAllowPrivateNetwork, loginProviders, env]
          properties:
            currency:
              $ref: "#/components/schemas/Currency"
            publicUrl:
              type: string
            channelsAllowPrivateNetwork:
              type: boolean
            loginProviders:
              type: array
              items:
                $ref: "#/components/schemas/AuthProvider"
            env:
              type: string
              enum: [development, production]
            smtpConfigured:
              type: boolean
              description: 当前生效的 SMTP 设置是否完整（host 与 from 非空）
        version:
          type: integer
          description: 全部设置的整体版本号（乐观锁）

    NotificationSettings:
      type: object
      description: 通知与 SMTP（`docs/contracts/phase6-api.md` §1）。设置来源：数据库 → 环境变量 `OMNIGATE_SMTP_*` → 默认值。
      required: [smtp, enabled, emailRateLimitPerHour]
      properties:
        smtp:
          type: object
          required: [host, port, security, username, passwordSet, from]
          properties:
            host: { type: string, maxLength: 253, description: "空 = 未配置（`OMNIGATE_SMTP_HOST`）" }
            port: { type: integer, minimum: 1, maximum: 65535, default: 587 }
            security:
              type: string
              enum: [starttls, tls, none]
              default: starttls
              description: "`tls` = 隐式 TLS（465）；`none` 仅限开发环境，生产环境拒绝（422）"
            username: { type: string, maxLength: 256 }
            passwordSet:
              type: boolean
              description: 是否有密码（数据库或环境变量）；密码只写，数据库中用主密钥加密
            from: { type: string, description: "发件人，如 `OmniGate <noreply@example.com>`" }
        enabled: { type: boolean, default: true, description: 总开关：关闭后不再产生邮件 / Webhook 投递（站内通知照常） }
        emailRateLimitPerHour:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
          description: 每个用户每小时最多发送的邮件数，超出的合并为一封摘要

    NotificationEventType:
      type: string
      description: |
        事件类型（目录顺序）。Round 6 续新增：
        - `account.status_changed`：类别“账户”（所有用户都有资格接收），告警类（不进入每日摘要）；默认邮件 + 站内开启、Webhook 关闭，
          **站内开关始终开启**（`PUT` 时强制 `inApp=true`）。由管理员停用 / 启用 / 强制下线以及停用到期自动启用产生；这是唯一会投递给
          被停用用户的事件（站内、邮件与 Webhook 均照常投递）。停用与强制下线为 `warning`，启用为 `info`；链接 `/console`；
          `data` 为 `{action: disabled | enabled | logout, auto: boolean, reason?: string, until?: string}`。
        - `subscription.quota_reset` / `subscription.extended`：钱包 / 套餐类（需要 `billing.own`），非告警（可进入每日摘要）；默认邮件 + 站内开启、
          Webhook 关闭；每位受影响用户每次操作一条，链接 `/console/billing`；`data` 为
          `{subscriptions: [{subscriptionId, planName, endsAt, rules?}], note, duration?}`（`rules` 为重置的规则展示名，仅重置；`duration` 仅延期）。
        Round 6（`docs/contracts/phase8-api.md`）新增：
        - `account.group_changed`：类别“账户”，`info`，默认仅站内开启（邮件、Webhook 关闭，可关闭）。管理员修改用户所在组（单个或批量）
          或删除用户所在组时产生；链接 `/console`；`data` 为 `{from: {id, name}, to: {id, name}, priceMultiplier, limits, deleted}`。
        - `limit.spend_near` / `limit.spend_reached`：钱包 / 套餐类（需要 `billing.own`）。消费限额（组的每日 / 每月、Key 的 `spendLimit`）
          结算后达到 80% / 达到上限时产生，每个限额每个窗口各最多一次（一次请求直接越过上限时只发 `reached`）。`near` 为 `info`，默认仅站内；
          `reached` 为 `warning`、告警类，默认邮件 + 站内。链接 `/console/billing`（Key 限额为 `/console/keys`）；`data` 为
          `{kind: daily | monthly | key, window, spent, limit, windowStart, resetsAt?, keyId?, keyName?}`。
        安全修订（`docs/contracts/phase5-api.md` §5.5）新增：
        - `channel.share_invited`：类别“渠道共享”（所有用户都有资格接收），`info`、非告警，默认仅站内开启。有人把渠道共享给你（新邀请或重新邀请）时产生，
          同一渠道对同一用户 1 小时内最多一次；链接 `/console/channels?tab=shared`；`data` 为 `{channelId, channelName, owner: {id, displayName}, models}`。
          不计入渠道告警摘要。
        Round 11（`docs/contracts/phase11-api.md` §3）新增：
        - `reset_card.issued`：钱包 / 套餐类（需要 `billing.own`），`info`、非告警，默认邮件 + 站内开启、Webhook 关闭。管理员发放重置卡后每位收件人一条
          （同一批次每 500 位收件人合并为一个事件）；链接 `/console/billing`；`data` 为 `{batchId, kind, quantity, plans, note, expiresAt?}`。
      enum: [account.status_changed, account.group_changed, wallet.balance_low, wallet.credited, subscription.expiring, subscription.expired, subscription.quota_reset,
        subscription.extended, reset_card.issued, quota.near_limit, quota.exhausted, limit.spend_near, limit.spend_reached, model.price_changed, model.removed, model.added, key.expiring, channel.unhealthy,
        channel.recovered, channel.auth_failed, upstream.balance_low, channel.share_invited, plugin.pending_approval]

    EventSwitches:
      type: object
      additionalProperties: false
      required: [email, webhook, inApp]
      properties:
        email: { type: boolean }
        webhook: { type: boolean, description: 所有事件默认关闭 }
        inApp: { type: boolean }

    NotificationPreferences:
      type: object
      description: |
        `PUT` 时为整体替换的请求体：省略的字段 / 事件取默认值，只读字段被忽略。
      required: [email, webhook, events, thresholds, digest, timezone, version]
      properties:
        email:
          type: object
          required: [enabled, address, verified]
          properties:
            enabled: { type: boolean, default: true }
            address:
              type: [string, "null"]
              description: 已验证的自定义通知邮箱；null = 使用账户邮箱（身份提供方，按其 `email_verified` 判断）
            verified: { type: boolean, readOnly: true }
        webhook:
          type: object
          required: [enabled, url, secretSet, format]
          properties:
            enabled: { type: boolean, default: false }
            url: { type: [string, "null"], maxLength: 2048 }
            secretSet: { type: boolean, readOnly: true }
            format: { type: string, enum: [json, feishu, dingtalk, wecom, slack], default: json }
        events:
          type: object
          description: "`{事件类型: 开关}`；GET 只返回有资格接收的事件。`account.status_changed` 的 `inApp` 始终为 true（提交 false 会被改为 true）"
          additionalProperties:
            $ref: "#/components/schemas/EventSwitches"
        thresholds:
          type: object
          required: [walletBalanceLow]
          properties:
            walletBalanceLow:
              $ref: "#/components/schemas/Money"
              description: 钱包可用余额低于此值时通知（默认 "1"）
        digest:
          type: string
          enum: ["off", daily]
          description: "daily：非告警类事件（告警类 = account.status_changed / channel.* / upstream.* / quota.exhausted / wallet.balance_low）每天 09:00（用户时区）合并为一封邮件"
        timezone: { type: string, default: Asia/Shanghai, description: IANA 时区 }
        version: { type: integer, description: 乐观锁版本；没有保存过时为 0 }
        smtpConfigured:
          type: boolean
          readOnly: true
          description: 只读：SMTP 已配置且通知总开关开启

    Notification:
      type: object
      required: [id, type, severity, title, body, link, data, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NotificationEventType" }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        body: { type: string }
        link: { type: [string, "null"], description: "站内路径（如 `/console/billing`），不会是外部链接" }
        data: { type: object, additionalProperties: true }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    NotificationList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    WebhookTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        statusCode: { type: integer }
        latencyMs: { type: integer, format: int64 }

    SmtpTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string, description: 失败原因（不包含密码） }

    WebhookPayload:
      type: object
      description: |
        `json` 格式的 Webhook 请求体。请求头 `X-OmniGate-Event: <type>`；设置了密钥时带 `X-OmniGate-Signature: sha256=<hex HMAC-SHA256(secret, body)>`
        （其他格式也带）。飞书 / 钉钉另按各自机器人的签名规则签名。
      required: [id, type, title, body, url, data, createdAt]
      properties:
        id: { type: string, description: 事件 ID（重试时不变，可用于去重） }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        url: { type: string, description: 基于 `OMNIGATE_PUBLIC_URL` 的绝对链接 }
        data: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    ChannelAlerts:
      type: object
      additionalProperties: false
      required: [balanceBelow]
      properties:
        balanceBelow:
          type: [string, "null"]
          description: 上游余额告警阈值（按插件返回的币种解释的十进制金额）；null = 不告警

    UpstreamBalance:
      type: object
      required: [channelId, channelName, currency, total, available, threshold, low, checkedAt]
      properties:
        channelId: { type: string, format: uuid }
        channelName: { type: string }
        currency: { type: string }
        total: { type: string }
        available: { type: boolean }
        threshold: { type: [string, "null"] }
        low: { type: boolean }
        checkedAt: { type: string, format: date-time }

    AlertsSummary:
      type: object
      required: [channels, balances, recent]
      properties:
        channels:
          type: object
          required: [total, healthy, degraded, down]
          properties:
            total: { type: integer }
            healthy: { type: integer }
            degraded: { type: integer }
            down: { type: integer }
        balances:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamBalance"
        recent:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Notification"

    ModelCapabilities:
      type: object
      additionalProperties: false
      required: [vision, tools, reasoning, embedding, imageGeneration, audioInput, audioOutput, completions]
      properties:
        vision: { type: boolean, description: 支持图片输入 }
        tools: { type: boolean, description: 支持工具调用 }
        reasoning: { type: boolean, description: 支持推理（深度思考） }
        embedding: { type: boolean, description: 向量嵌入模型 }
        imageGeneration: { type: boolean, description: "图片生成模型（Round 6 续，`/v1/images/*`）；决定模型广场是否列出 `openai.images` 协议" }
        audioInput: { type: boolean, description: "语音识别模型（Round 6 续，`/v1/audio/transcriptions`、`/translations`）；与 `audioOutput` 任一为 true 时模型广场列出 `openai.audio` 协议" }
        audioOutput: { type: boolean, description: "语音合成模型（Round 6 续，`/v1/audio/speech`）" }
        completions: { type: boolean, description: "文本补全 / FIM（Round 14，`/v1/completions`）；有开启 `supportsCompletions` 的渠道提供该模型时模型广场列出 `openai.completions` 协议；旧数据缺省 false" }

    ModelInfo:
      type: object
      description: 逻辑模型的展示信息（`docs/contracts/phase5-api.md` §2）
      required: [model, displayName, description, vendor, tags, contextWindow, maxOutput, capabilities, hidden, sortOrder, version, updatedAt]
      properties:
        model:
          type: string
          description: 逻辑模型名（主键）
        displayName:
          type: string
          maxLength: 100
          description: 空 = 用模型名
        description:
          type: string
          maxLength: 1000
          description: 纯文本
        vendor:
          type: string
          maxLength: 50
          example: DeepSeek
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 20
        contextWindow:
          type: [integer, "null"]
          minimum: 1
          description: 上下文长度（token）；null = 未知
        maxOutput:
          type: [integer, "null"]
          minimum: 1
          description: 最大输出（token），不超过 `contextWindow`；null = 未知
        capabilities:
          $ref: "#/components/schemas/ModelCapabilities"
        hidden:
          type: boolean
          description: true：不在任何模型广场中显示（“我的模型”除外，仍可调用）
        sortOrder:
          type: integer
          minimum: -999999999
          maximum: 999999999
          description: 越小越靠前，默认 0
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time

    ModelInfoInput:
      type: object
      additionalProperties: false
      description: 整体替换；省略的字段取默认值。`version` 新建时省略，修改时必填。
      properties:
        displayName: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        vendor: { type: string, maxLength: 50 }
        tags:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 20 }
        contextWindow: { type: [integer, "null"], minimum: 1, maximum: 9007199254740991 }
        maxOutput: { type: [integer, "null"], minimum: 1, maximum: 9007199254740991 }
        capabilities:
          type: object
          additionalProperties: false
          description: 只接受七个布尔字段；省略的为 false
          properties:
            vision: { type: boolean }
            tools: { type: boolean }
            reasoning: { type: boolean }
            embedding: { type: boolean }
            imageGeneration: { type: boolean }
            audioInput: { type: boolean }
            audioOutput: { type: boolean }
        hidden: { type: boolean }
        sortOrder: { type: integer, minimum: -999999999, maximum: 999999999 }
        version: { type: integer }

    PlazaPrice:
      type: object
      description: |
        当前生效的售价（结算币种，每百万 token）；缓存价、`perImage`、`imageInputPerM`、`audioInputPerM`、`audioOutputPerM`、`perMinute`、
        `perMCharacters` 为 0 或未设置时为 null
      required: [inputPerM, outputPerM, cacheReadPerM, cacheWritePerM, perImage, imageInputPerM, audioInputPerM, audioOutputPerM, perMinute, perMCharacters,
        schedule, scheduleTimezone, currentMultiplier]
      properties:
        inputPerM:
          $ref: "#/components/schemas/Money"
        outputPerM:
          $ref: "#/components/schemas/Money"
        cacheReadPerM:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        cacheWritePerM:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        perImage:
          description: 每张输出图片的价格（Round 6 续）；为 0 或未设置时为 null
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        imageInputPerM:
          description: 图片输入 token 的每百万单价（Round 6 续）；未设置（按 `inputPerM` 计）时为 null
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        audioInputPerM:
          description: 音频输入 token 的每百万单价（Round 6 续）；未设置（按 `inputPerM` 计）时为 null
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        audioOutputPerM:
          description: 音频输出 token 的每百万单价（Round 6 续）；未设置（按 `outputPerM` 计）时为 null
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        perMinute:
          description: 每分钟输入音频的价格（Round 6 续）；为 0 或未设置时为 null
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        perMCharacters:
          description: 每百万语音合成输入字符的价格（Round 6 续）；为 0 或未设置时为 null
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        schedule:
          description: 当前售价版本的分时倍率（Round 6）；null = 无。上面的单价是未乘分时倍率的价格
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/PriceScheduleSlot"
            - type: "null"
        scheduleTimezone:
          type: string
          description: "`schedule` 的 IANA 时区"
        currentMultiplier:
          type: string
          description: 此刻生效的分时倍率（未命中任何时段为 `"1"`）
        tiers:
          description: 按上下文长度的阶梯价格（Round 10），按门槛升序；null = 无
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/PlazaPriceTier"
            - type: "null"

    PlazaModel:
      type: object
      required: [model, displayName, description, vendor, tags, contextWindow, maxOutput, capabilities, protocols, price, plans]
      properties:
        model:
          type: string
        displayName:
          type: string
          description: 模型资料的显示名；没有资料或为空时为 `""`（前端显示模型名）
        description:
          type: string
        vendor:
          type: string
        tags:
          type: array
          items: { type: string }
        contextWindow:
          type: [integer, "null"]
        maxOutput:
          type: [integer, "null"]
        capabilities:
          $ref: "#/components/schemas/ModelCapabilities"
        protocols:
          type: array
          description: |
            可用的客户端协议：始终有 `openai.chat`、`openai.responses`、`anthropic.messages`（网关在协议间转换）；
            提供该模型的渠道（广场：global platform 渠道；我的模型：用户可用的渠道）中有 openai 渠道时另有 `openai.embeddings`；
            有 openai 渠道且模型资料标记了 `capabilities.imageGeneration` 时再加 `openai.images`（Round 6 续，即 `/v1/images/*`）；
            有 openai 渠道且标记了 `capabilities.audioInput` 或 `audioOutput` 时再加 `openai.audio`（Round 6 续，即 `/v1/audio/*`）；
            有开启 `config.supportsCompletions` 的渠道且标记了 `capabilities.completions` 时再加 `openai.completions`（Round 14，即 `/v1/completions`）
          items:
            type: string
            enum: [openai.chat, openai.responses, anthropic.messages, openai.embeddings, openai.images, openai.audio, openai.completions]
        price:
          description: 当前生效的售价；null = 未定价（不收费）
          oneOf:
            - $ref: "#/components/schemas/PlazaPrice"
            - type: "null"
        plans:
          type: array
          description: 覆盖该模型的 active 套餐（套餐 `models` 为空即覆盖全部模型），按创建时间排序
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    MyPlazaModel:
      allOf:
        - $ref: "#/components/schemas/PlazaModel"
        - type: object
          required: [sources, billing, subscription, basePrice, priceMultiplier]
          properties:
            basePrice:
              description: 原价（Round 6）；`price` 为乘过用户组倍率的价格（各单价分别乘倍率后舍入），null = 未定价
              oneOf:
                - $ref: "#/components/schemas/PlazaPrice"
                - type: "null"
            priceMultiplier:
              type: string
              description: 当前用户所在组的价格倍率（十进制字符串）
              example: "0.8"
            sources:
              type: object
              description: 各档可用渠道数（已启用、插件已启用）
              required: [own, shared, platform]
              properties:
                own: { type: integer }
                shared: { type: integer }
                platform: { type: integer }
            billing:
              type: string
              enum: [free, platform]
              description: own 或 shared 渠道数 > 0 → `free`（优先使用，不计费；失败回退到平台时按 `price` 计费）
            subscription:
              type: [object, "null"]
              description: 覆盖该模型的有效订阅（最早到期的一份）
              required: [id, planName]
              properties:
                id: { type: string, format: uuid }
                planName: { type: string }

    PlazaModelList:
      type: object
      required: [items, currency]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlazaModel"
        currency:
          $ref: "#/components/schemas/Currency"

    MyPlazaModelList:
      type: object
      required: [items, currency]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyPlazaModel"
        currency:
          $ref: "#/components/schemas/Currency"
