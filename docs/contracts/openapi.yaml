  /api/admin/billing/subscriptions/reset-quota:
    post:
      tags: [billing]
      operationId: resetSubscriptionQuota
      summary: 批量重置套餐额度（Round 6 续）
      description: |
        清空目标订阅所选规则的**当前窗口**用量（`docs/contracts/phase7-api.md` §3.1，“发福利”）。
        - 目标：`target.ids`（1–1000 个订阅 ID，重复的去重）或 `target: {planId, status: "active"}`（`planId` 为 null = 全部套餐）。
          **只处理 `active` 且 `endsAt` 晚于当前时间的订阅**，`ids` 中已取消 / 已过期 / 不存在的订阅被忽略（不报错）。
        - `rules`：只重置这些规则 ID（1–50 个）；null 或省略 = 全部规则。`includeLifetime` 为 false（默认）时 `lifetime` 规则不重置。
          一份订阅至少有一条被选中且可重置的规则时才计入 `affected`。
        - 每条选中规则删除当前窗口起点之后（含）的全部用量记录：`calendar` / `period` 清除当前窗口计数；`rolling` 清除窗口内的全部分桶；
          `session` 从重置时刻 A 重新开始一个空的会话（写入 `window_start = A`（截断到秒）、`used = 0` 的锚点行，`resetsAt = A + duration`，
          之后的用量计入该会话，见 `docs/contracts/phase11-api.md` §1）；`lifetime`（仅 `includeLifetime`）清除全部用量。网关每次请求都读取计数，
          被配额阻断的用户立即恢复可用。
        - `?dryRun=true`：同样校验并统计，返回将受影响的数量与 ID，不做修改、不写审计、不发通知。

        写审计 `subscription.quota_reset`（一条，`resourceType=subscription`，无 `resourceId`；metadata `target`、`rules`、`includeLifetime`、
        `note`、`affected`、`subscriptions`）；每位受影响的用户在本次操作中收到一条通知 `subscription.quota_reset`。
        错误：`422`（`details` 键 `target`、`rules`、`note`）；`target.planId` 指向不存在的套餐 → `404 not_found`。
      x-required-permission: billing.manage
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionQuotaResetRequest"
            examples:
              byPlan:
                summary: 重置某套餐全部有效订阅的 5 小时窗口
                value:
                  target: { planId: 0192f0c5-1000-7abc-8def-0123456789ab, status: active }
                  rules: [5h]
                  includeLifetime: false
                  note: 服务故障补偿
              byIds:
                summary: 指定订阅、全部规则
                value:
                  target: { ids: [0192f0c5-2000-7abc-8def-0123456789ab] }
                  rules: null
                  note: ""
      responses:
        "200":
          description: 受影响（或 dryRun 时将受影响）的订阅
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionBulkResult"
              example:
                affected: 2
                subscriptions: [0192f0c5-2000-7abc-8def-0123456789ab, 0192f0c5-2001-7abc-8def-0123456789ab]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/billing/subscriptions/extend:
    post:
      tags: [billing]
      operationId: extendSubscriptions
      summary: 批量延期订阅（Round 6 续）
      description: |
        把目标订阅的 `endsAt` 延后 `duration`（`docs/contracts/phase7-api.md` §3.2）。目标的选择规则与 `reset-quota` 相同
        （只处理 `active` 且未到期的订阅）；每份订阅版本号 +1，规则快照与已有用量不变。
        `duration` 格式同套餐时长（`<正整数>h` / `<正整数>d` 等，范围 1h–366d）。`?dryRun=true` 只返回将受影响的数量与 ID，不做修改、不写审计、不发通知。

        写审计 `subscription.extend`（metadata `target`、`duration`、`note`、`affected`、`subscriptions`）；每位受影响的用户在本次操作中收到一条通知
        `subscription.extended`。错误：`422`（`details` 键 `target`、`duration`、`note`）；`target.planId` 指向不存在的套餐 → `404 not_found`。
      x-required-permission: billing.manage
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
