            schema:
              type: object
              additionalProperties: false
              required: [model, inbound]
              properties:
                model:
                  type: string
                  minLength: 1
                userId:
                  type: string
                  format: uuid
                inbound:
                  type: string
                  enum: [openai.chat, openai.responses, anthropic.messages, openai.embeddings, openai.images.generations, openai.audio.transcriptions, openai.audio.speech, openai.completions]
            example: { model: gpt-4o, inbound: openai.chat }
      responses:
        "200":
          description: 预览结果
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePreview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

