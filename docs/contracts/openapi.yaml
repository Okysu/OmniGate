                type: object
                required: [count]
                properties:
                  count: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: 标为已读
      description: "`{ids}`（最多 500 个，只影响自己的通知）或 `{all: true}`。已读的保持不变。"
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
                all: { type: boolean }
      responses:
        "204":
          description: 已标记
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/notifications/preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: 我的通知偏好
      description: |
        不存在时返回默认值（`version: 0`）。`events` 只包含当前用户有资格接收的事件（渠道类事件需要拥有渠道或 `channels.manage`，
        `plugin.pending_approval` 需要 `plugins.trust`，钱包 / 套餐类（含 Round 6 续的 `subscription.quota_reset` / `subscription.extended`）需要 `billing.own`，
        `key.expiring` 需要 `keys.own`；账户类 `account.status_changed` 所有用户都有，且站内开关始终开启）。
      responses:
        "200":
          description: 偏好
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [notifications]
      operationId: putNotificationPreferences
      summary: 整体替换通知偏好（乐观锁）
      description: |
        `version` 必须等于当前版本（无记录时为 0），成功后加 1，否则 `409 version_conflict`。省略的字段与 `events` 中省略的事件取默认值；
        只读字段（`email.verified`、`webhook.secretSet`、`smtpConfigured`）被忽略；`account.status_changed` 的 `inApp` 强制为 true。为无资格的事件**开启**任一开关、未知事件类型、
        非法地址 / 时区 / 金额 → `422`，`details` 键如 `events.plugin.pending_approval`、`webhook.url`、`timezone`、`thresholds.walletBalanceLow`。
        `email.address` 只能为 `null`（使用账户邮箱）或已经验证过的当前自定义地址（否则 `422 email.address`）。
        `webhook.url` 不能指向内网 / 本机地址（规则同渠道）。写审计 `notifications.preferences_update`。
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: 保存后的偏好
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/notifications/email/verify:
    post:
      tags: [notifications]
      operationId: sendNotificationEmailCode
      summary: 发送通知邮箱验证码
      description: |
        向 `address` 发送 6 位验证码（10 分钟有效；数据库只保存摘要）。每个用户每小时最多 5 次（`429 rate_limited`）。
        SMTP 未配置或通知总开关关闭 → `409 smtp_not_configured`；邮件发送失败 → `502 email_send_failed`。
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                required: [ok, expiresAt]
                properties:
                  ok: { type: boolean }
                  expiresAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          $ref: "#/components/responses/SmtpNotConfigured"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/notifications/email/confirm:
    post:
      tags: [notifications]
      operationId: confirmNotificationEmail
      summary: 确认验证码并设为通知邮箱
      description: |
        地址大小写不敏感；保存为发送验证码时的地址。验证码错误 → `422 verification_invalid`（每个验证码最多 5 次）；
        过期 / 已使用 / 不存在 → `422 verification_expired`。成功返回新的偏好（版本加 1），写审计 `notifications.preferences_update`。
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address, code]
              properties:
                address: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: 新的偏好
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/notifications/webhook/test:
    post:
      tags: [notifications]
      operationId: testNotificationWebhook
      summary: 向已保存的 Webhook 发送测试消息
      description: "未保存 Webhook 地址 → `422`（`details.webhook.url`）。发送失败时仍返回 200，`ok: false`。"
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: 结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/notifications/webhook/secret:
    put:
      tags: [notifications]
      operationId: setNotificationWebhookSecret
      summary: 设置 Webhook HMAC 密钥（只写）
      description: "`\"\"` 表示清除。用主密钥加密存储（ADR-0008），不改变偏好的 `version`。写审计 `notifications.preferences_update`。"
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secret]
              properties:
                secret: { type: string, maxLength: 256 }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [secretSet]
                properties:
                  secretSet: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/notifications/unsubscribe:
    get:
      tags: [notifications]
      operationId: unsubscribeNotificationEmail
      summary: 一键退订（公开）
      description: |
        邮件中的签名令牌（主密钥派生密钥加密认证）。关闭该事件类型的邮件通知；摘要 / 合并邮件的令牌关闭全部邮件通知（`email.enabled = false`）。
        幂等，不需要登录。默认返回 HTML 页面；`Accept: application/json` 时返回 JSON。令牌无效 → 400（HTML）/ `422 invalid_token`（JSON）。
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已退订
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [ok, type]
                properties:
                  ok: { type: boolean }
                  type: { type: string, description: 关闭的事件类型；空字符串 = 全部邮件通知 }
        "400":
          description: 令牌无效（HTML）
          content:
            text/html:
              schema: { type: string }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/alerts/summary:
    get:
      tags: [notifications]
      operationId: alertsSummary
      summary: 告警与上游余额概览
      description: |
        只包含当前用户能管理的渠道（自己的渠道；持有 `channels.manage` 时为全部渠道）。`channels` 统计已启用的渠道
        （`down` = 熔断打开）；`balances` 为各渠道插件 `balance` 类能力的最近一次成功结果；`recent` 为当前用户最近 10 条 `channel.*` / `upstream.*` 通知。
      responses:
        "200":
          description: 概览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/admin/model-info:
    get:
      tags: [plaza]
      operationId: listModelInfo
      summary: 模型资料列表
      description: |
        返回全部已有资料的条目（`{items}`，不分页），按 `sortOrder`、模型名排序。没有资料的模型不在其中；
        模型资料页的列表 = `GET /api/models?scope=all` 的逻辑模型 ∪ 本接口的条目（可能已没有渠道提供）。
      x-required-permission: models.manage
      responses:
        "200":
          description: 模型资料
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/model-info/{model}:
    parameters:
      - name: model
        in: path
        required: true
        description: 逻辑模型名（URL 编码，`/` 编码为 `%2F`）；1–128 个字符，不能有首尾空格
        schema:
          type: string
    put:
      tags: [plaza]
      operationId: putModelInfo
      summary: 新建或修改模型资料
      description: |
        整体替换：省略的字段取默认值（空字符串、空数组、null、false、0）。新建时**不带** `version`（返回 `201`）；
        修改时必须带当前 `version`（返回 `200`，版本号加一）。资料已存在却未带 `version`、`version` 不符，
        或带了 `version` 但资料已被删除，均返回 `409 version_conflict`。
        字符串去掉首尾空格；`tags` 去掉首尾空格后丢弃空标签，按不区分大小写去重（保留第一次的写法）。
        `422 validation_failed` 的 `details` 键：`model`、`displayName`、`description`、`vendor`、`tags`（数量或类型）、`tags[i]`（第 i 个标签）、
        `contextWindow`、`maxOutput`（含“超过上下文长度”）、`capabilities`（只接受 vision / tools / reasoning / embedding / imageGeneration / audioInput / audioOutput / completions 八个布尔字段）、
        `hidden`、`sortOrder`。审计动作 `model_info.update`（`metadata.created`、`before`、`after`）。
      x-required-permission: models.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInfoInput"
            example:
              displayName: DeepSeek V3
              description: 通用对话模型
              vendor: DeepSeek
              tags: [对话, 代码]
              contextWindow: 128000
              maxOutput: 8192
              capabilities: { vision: false, tools: true, reasoning: false, embedding: false, imageGeneration: false, audioInput: false, audioOutput: false, completions: true }
              hidden: false
              sortOrder: 0
      responses:
        "200":
          description: 已修改
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelInfo"
        "201":
          description: 已新建
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [plaza]
      operationId: deleteModelInfo
      summary: 删除模型资料
      description: 删除后模型照常可用，广场中只显示模型名。资料不存在时 `404 not_found`。审计动作 `model_info.delete`。
      x-required-permission: models.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: 已删除
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plaza/models:
    get:
      tags: [plaza]
      operationId: listPlazaModels
      summary: 平台模型广场
      description: |
        由**作用域为 `global` 的 platform 档渠道**（所有者为 `system_admin` / `channel_admin`、已启用、插件已启用）提供、且模型资料未隐藏的逻辑模型，
        按 `sortOrder`、模型名排序。不暴露渠道名称、渠道数量与成本价。
        系统设置 `site.publicModelPlaza` 为 true（默认）时可匿名访问（带有效会话 Cookie 时照常识别）；为 false 时需要登录，否则 `401 unauthenticated`。
      security:
        - {}
        - sessionCookie: []
      x-required-permission: null
      responses:
        "200":
          description: 平台模型
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlazaModelList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plaza/mine:
    get:
      tags: [plaza]
      operationId: listMyPlazaModels
      summary: 我的模型
      description: |
        当前用户可以调用的全部模型（平台 + 自有 + 共享，包括非 global 但共享给他的平台渠道；不考虑 API Key 策略），隐藏的模型也返回。
        每项在 `PlazaModel` 之外带各档可用渠道数 `sources`、`billing`（own 或 shared 渠道数 > 0 → `free`，否则 `platform`）
        与覆盖该模型的有效订阅 `subscription`（最早到期的一份）。按 `sortOrder`、模型名排序。
      x-required-permission: null
      responses:
        "200":
          description: 我的模型
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPlazaModelList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

