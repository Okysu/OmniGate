          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [channels]
      operationId: createChannel
      summary: 创建渠道
      description: |
        调用者成为所有者。必填：`name`、`type`、`baseUrl`、`apiKey`、至少一个 `models`；默认 `scope=private`、`status=enabled`、
        `priority=0`、`weight=1`。`scope=global` 需要 `channels.manage`（否则 `403 forbidden`）。
        `baseUrl` 为字面量环回 / 私有 IP 或 `localhost` 时返回 `422 base_url_not_allowed`，除非 `OMNIGATE_CHANNELS_ALLOW_PRIVATE_NETWORK=true`
        且调用者持有 `channels.manage`；解析到内网地址的域名在连接时被拒绝（见 `POST /api/channels/{id}/test`）。
        `apiKey` 用主密钥加密保存，响应中只返回 `secret.hint`。写审计 `channel.create`（metadata 含 `plugin: key@version`）。

        **插件**：提供 `pluginVersionId` 时，该版本必须已批准（否则 `409 plugin_not_approved`）且插件已启用（否则 `409 plugin_disabled`），
        不存在 → `422`（`details.pluginVersionId`）；`type` 由插件的 `extends` 决定（可省略，传入不同值 → `422`），省略的 `baseUrl` / `models`
        取自 `manifest.defaults`。不提供时绑定 `type` 对应的内置插件（`builtin.openai` / `builtin.anthropic`）。`pluginConfig` 按插件的
        `configSchema` 校验并补默认值，`secrets` 只接受 `configSchema` 中标记 `x-secret` 的字段（`apiKey` 仍通过 `apiKey` 提交）。
