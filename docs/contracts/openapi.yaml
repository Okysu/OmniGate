  /api/admin/routes/preview:
    post:
      tags: [routes]
      operationId: previewRoute
      summary: 命中预览
      description: |
        计算某个用户以某个入口协议请求某个模型时命中的规则与候选渠道顺序。与网关使用同一套候选选择与排序逻辑，但不考虑 API Key 策略。
        `userId` 缺省为当前用户；用户不存在时 `404 not_found`。随机策略（priority / weighted 的权重随机）只给出一次示例顺序；
        round_robin 给出下一次请求的顺序（不推进计数）。
        `candidates` 先列出可用渠道（按尝试顺序 own → shared → platform，每个带 `tier`；熔断中的渠道标记 `skipped`），然后是不支持该入口协议的渠道
        （如 embeddings 遇到 anthropic 渠道），最后是规则 targets 中该用户无权使用的渠道（均带 `skipped`）。规则只影响 platform 档：
        targets 只筛选 platform 渠道，用户自己的与共享的渠道总是排在前面。`tierOrder` 为档位顺序。
      x-required-permission: routes.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
