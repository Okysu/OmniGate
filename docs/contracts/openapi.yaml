                    fetchedAt: "2026-10-08T08:00:00Z"
                    pluginVersion: 1.0.0
                    logs: []
                    fetches:
                      - { method: GET, url: "https://api.deepseek.com/user/balance", status: 200, durationMs: 305 }
                unsupported:
