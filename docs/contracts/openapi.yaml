            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                note:
                  type: string
            example:
              decision: approve
              note: 新增的 api.example.com 为余额接口所需
      responses:
        "200":
          description: 审批后的版本
          headers:
