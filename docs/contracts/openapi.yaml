      operationId: clearAffinity
      summary: 清空会话绑定
      description: |
        请求体可省略；`rule` 省略或为空时清空全部绑定，否则只清空该规则建立的绑定。写审计 `affinity.clear`
        （`resourceId: "gateway.affinity"`、`metadata: { cleared, rule? }`）。
      x-required-permission: settings.write
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: false
        content:
          application/json:
