                user:
                  id: 0192f0c4-9999-7c3d-9e8f-1a2b3c4d5e6f
                  displayName: Bob
                  email: bob@example.com
                  avatarUrl: null
                  role: user
                  status: disabled
                  disabledReason: 违反使用条款
                  disabledUntil: "2026-10-15T00:00:00Z"
                  version: 5
                  createdAt: "2026-10-01T08:00:00Z"
                  lastLoginAt: "2026-10-07T12:00:00Z"
                  identities:
                    - { provider: github, login: bob, email: bob@example.com }
                identities:
                  - { provider: github, subject: "1002", email: bob@example.com, createdAt: "2026-10-01T08:00:00Z" }
                wallet: { balance: "12.5", reserved: "0" }
                subscriptions: []
                keys:
                  - { id: 0192f0c6-0000-7000-8000-000000000001, name: laptop, prefix: og-AbCdEfGhI…, status: disabled, lastUsedAt: "2026-10-07T11:59:00Z", createdAt: "2026-10-02T08:00:00Z" }
                sessions: { active: 0 }
                usage30d: { requests: 1234, charge: "7.25", tokens: 2345678 }
                channels: { own: 1 }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [admin]
      operationId: patchUser
      summary: 修改用户角色 / 状态（乐观锁）
      description: |
        `version` 必填，必须等于用户当前版本，成功后版本号 +1（即使未修改 `role`/`status`）。`role` 与 `status` 至少提供一个。
        修改即时生效：每次请求都会重新读取用户角色与状态。

        停用与启用（Round 6 续，`docs/contracts/phase7-api.md` §2.1）：
        - `status: disabled` 时 `disabledReason` **必填**（去除首尾空白后 1–200 个字符）；`disabledUntil` 可选，必须晚于当前时间，
          到期后由后台任务（每分钟一次，启动时也执行一次）自动启用并写审计 `user.auto_enable`；省略或 null = 永久停用。
          对已停用的用户再次提交 `status: disabled` 会更新原因与期限。
        - 停用会立即吊销该用户的**全部会话**（吊销原因 `admin_disabled`）并清空网关的 Key 认证缓存：其 Gateway Key 随即得到
          `403 account_disabled`，登录被重定向到 `/login?error=account_disabled&reason=…&until=…`。
        - `status: active` 时服务端清空 `disabledReason` 与 `disabledUntil`。
        - 不是停用时提交非空的 `disabledReason` 或非 null 的 `disabledUntil` → `422`（`details.disabledReason`）。
        - 状态发生变化时向该用户发送通知 `account.status_changed`（停用 / 启用；被停用的用户同样会收到）。

        写审计 `user.update`（metadata 的 `before` / `after` 含 role、status、disabledReason、disabledUntil）。

        校验与冲突顺序：
        1. `id` 不是合法 UUID → `404 not_found`；
        2. 请求体不是合法 JSON / 含未知字段 / Content-Type 不符 → `422 validation_failed`；
        3. 缺少 `version`、`role` 与 `status` 都未提供、`role` 或 `status` 取值非法、停用原因 / 期限不合法 → `422 validation_failed`，
           `details` 给出字段级消息（键 `version`、`role`、`status`、`disabledReason`、`disabledUntil`）；
        4. 停用自己 → `409 cannot_disable_self`；
        5. 用户不存在 → `404 not_found`；版本不符 → `409 version_conflict`；
        6. 会导致系统中不再有任何“启用状态的 system_admin” → `409 last_admin`。
      x-required-permission: users.write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserRequest"
            examples:
              disable:
                summary: 停用用户（到期自动启用）
                value: { status: disabled, disabledReason: 违反使用条款, disabledUntil: "2026-10-15T00:00:00Z", version: 3 }
              disablePermanently:
                summary: 永久停用
                value: { status: disabled, disabledReason: 账号已离职, version: 3 }
              enable:
                summary: 启用（清空停用原因与期限）
                value: { status: active, version: 4 }
              promote:
                summary: 设为渠道管理员
                value: { role: channel_admin, version: 3 }
      responses:
        "200":
          description: 修改后的用户（含 `identities`）
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`forbidden`（缺少 users.write）或 `csrf_rejected`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                forbidden:
                  $ref: "#/components/examples/ForbiddenError"
                csrf:
                  $ref: "#/components/examples/CsrfError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`version_conflict` / `last_admin` / `cannot_disable_self`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                versionConflict:
                  value:
                    error:
                      code: version_conflict
                      message: 资源已被修改，请刷新后重试
                      requestId: 0192f0c4-7000-7abc-8def-0123456789ab
                lastAdmin:
                  value:
                    error:
                      code: last_admin
                      message: 不能降级或停用最后一位系统管理员
                      requestId: 0192f0c4-7000-7abc-8def-0123456789ab
                cannotDisableSelf:
                  value:
                    error:
                      code: cannot_disable_self
                      message: 不能停用自己的账号
                      requestId: 0192f0c4-7000-7abc-8def-0123456789ab
        "422":
          description: "`validation_failed`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_failed
                  message: 参数校验失败
                  requestId: 0192f0c4-7000-7abc-8def-0123456789ab
                  details:
                    version: 必填
                    disabledReason: 停用时必须填写原因
                    disabledUntil: 到期时间必须晚于现在
        "500":
          $ref: "#/components/responses/InternalError"

