          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [billing]
      operationId: createPlan
      summary: 创建套餐
      description: |
        `name`、`duration`、`rules`（1–10 条）必填；其余字段可选（`status` 缺省 `active`，`stackable` 缺省 `false`，`models` 缺省 `[]` = 全部模型，
        `listPrice` 缺省 null）。字段级错误在 `details` 中，键如 `name`、`duration`、`models`、`rules`、`rules[0].window.duration`、
        `rules[1].modelWeights.gpt-5.6-sol`。写审计 `plan.create`。
      x-required-permission: billing.manage
