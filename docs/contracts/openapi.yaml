openapi: 3.1.0
info:
  title: OmniGate HTTP API
  version: "phase-7"
  summary: OmniGate 自托管 AI API 网关的控制面（/api）与数据面（/v1）接口契约。
  description: |
    本文件依据 `server/` 下的 Go 代码编写，代码为唯一事实来源；如两者不一致，以代码为准并修正本文件。
    Phase 1 的设计说明与实现差异见 `docs/contracts/phase1-api.md`，跨协议转换规则见 `docs/contracts/protocol-adapter.md`；
    Phase 2 插件系统（`/api/plugins/*`、渠道能力、请求 Hook）的设计契约见 `docs/contracts/phase2-api.md`，运维说明见
    `docs/operations/configuration.md`“插件”。Round 4 的套餐 / 订阅 / 周期配额、`POST /v1/embeddings`、删除插件见
    `docs/contracts/phase3-api.md`（含 §6 实现差异），运维说明见 `docs/operations/configuration.md`“套餐与周期配额”。
    Round 5 的超额偏好、路由规则（`/api/admin/routes*`）与系统设置（`/api/admin/settings`）见 `docs/contracts/phase4-api.md`（含 §4 实现差异）。
    Round 5（续）的渠道档位（own / shared / platform）与延后计费、模型资料（`/api/admin/model-info*`）、模型广场（`/api/plaza/*`）
    见 `docs/contracts/phase5-api.md`（含 §4 实现差异），运维说明见 `docs/operations/configuration.md`“渠道归属与计费”。
    Round 6 的通知（`/api/notifications/*`、告警概览）见 `docs/contracts/phase6-api.md`。
    Round 6（续）的图片接口（`/v1/images/*`，按张计价、配额计量 `images`）、用户管理增强（停用原因与期限、用户详情、强制下线、
    禁用全部 Key、批量操作、数据面 `403 account_disabled`）与套餐额度重置 / 批量延期（`/api/admin/billing/subscriptions/reset-quota`、`/extend`）
    见 `docs/contracts/phase7-api.md`（含 §5 实现差异）。
    Round 6（续）的音频接口（`/v1/audio/transcriptions`、`/translations`、`/speech`，按 token / 分钟 / 字符计价、配额计量 `audio_seconds`）
    见 `docs/contracts/phase9-api.md` §1（实现差异见该文件 §4）。
    Round 13 的客户端识别（请求日志 `client`、`GET /api/clients`、统计 `byClient`、会话亲和规则 `client_include`）见 `docs/contracts/phase13-api.md`。
    Round 14 的文本补全接口（`POST /v1/completions`，含 FIM；渠道 `config.supportsCompletions`、模型能力 `completions`、广场协议 `openai.completions`）见 `docs/contracts/phase14-api.md`。

    ## 两棵路由树
    - **控制面** `/api/*`：管理控制台使用，基于 Cookie 会话（`og_session`）认证，带 CSRF 防护，错误统一使用 `Error` 信封。
      未注册的 `/api/*` 路径返回 `404 not_found`（`message` 为“接口不存在”）。
    - **数据面** `/v1/*`：面向 OpenAI / Anthropic 兼容客户端（SDK、Claude Code 等），使用 Gateway Key 认证
      （`og-` 前缀，见 `securitySchemes.gatewayKey` / `gatewayApiKey`），不读取会话 Cookie，也不做 CSRF 检查。
      错误体按入口协议分别使用 OpenAI 或 Anthropic 的错误格式（见 `OpenAIError` / `AnthropicError`）。
    - `/healthz`、`/readyz` 为探针接口；其余路径由内嵌的前端 SPA 处理（不在本契约范围内）。

    ## 通用约定
    - 每个响应都带 `X-OmniGate-Request-Id` 响应头（服务端生成的 UUIDv7，不信任客户端传入的值），
      与控制面错误体中的 `requestId`、审计日志及请求日志中的 `requestId` 一致，排障时请提供该值。
      数据面错误体中**不含**请求 ID，请从响应头读取。
    - 控制面 JSON 响应均带 `Cache-Control: no-store`。
    - 时间字段为 RFC 3339 格式（UTC）。ID 均为 UUID（v7）。
    - **金额一律为十进制字符串**（结算币种，最多 9 位小数，去掉末尾的 0，如 `"0"`、`"12.5"`、`"-0.000002"`），从不使用 JSON 数字（ADR-0007）。
    - 控制面请求体统一严格解码：未知字段会被拒绝（`422 validation_failed`，`message` 含 `unknown field`），
      大小上限 1 MiB；若带 `Content-Type`，必须以 `application/json` 开头。
    - 分页列表使用 `?page=&pageSize=`，返回 `{items, total, page, pageSize}`（`ListMeta`）；`GET /api/keys` 例外，只返回 `{items}`。
    - 需要乐观锁的写操作必须带 `version`，与当前版本不符时返回 `409 version_conflict`。

    ## CSRF 规则（作用于所有 `/api/*` 非安全方法）
    除 `GET`/`HEAD`/`OPTIONS` 外，所有 `/api/*` 请求必须携带请求头 `X-Requested-With: XMLHttpRequest`，
    否则返回 `403 csrf_rejected`。若请求带有 `Origin` 头，其值必须等于 `OMNIGATE_PUBLIC_URL` 的源
    （scheme://host[:port]）或位于 `OMNIGATE_ALLOWED_ORIGINS` 中，否则同样返回 `403 csrf_rejected`。
    CSRF 检查先于会话检查执行：缺少该头的未登录写请求得到的是 `403 csrf_rejected` 而不是 `401`。

    ## 控制面错误码与 HTTP 状态（`httpx.StatusFor`）
    | 错误类别 (apperr.Kind) | HTTP | 出现的 `error.code` |
    |---|---|---|
    | Validation | 422 | `validation_failed`, `base_url_not_allowed`, `redeem_invalid`, `plugin_build_failed`（`details.diagnostics` 为编译诊断）, `route_target_invalid` |
    | Unauthenticated | 401 | `unauthenticated` |
    | Forbidden | 403 | `forbidden`, `csrf_rejected`, `capability_forbidden` |
    | NotFound | 404 | `not_found`, `capability_not_found` |
    | BadGateway | 502 | `upstream_error`（渠道测试 / 模型发现时上游不可达或出错） |
    | Conflict | 409 | `version_conflict`, `last_admin`, `cannot_disable_self`, `secret_unavailable`, `redeem_batch_disabled`, `redeem_not_started`, `redeem_expired`, `redeem_used_up`, `redeem_user_limit`, `plugin_exists`, `plugin_builtin`, `plugin_version_exists`, `plugin_not_approved`, `plugin_disabled`, `plugin_in_use`, `not_pending`, `plan_archived`, `subscription_not_active`（`identity_conflict` 仅在登录回调内部出现，会被转换为重定向；`plan_in_use` 为预留码，当前不会产生） |
    | RateLimited | 429 | `rate_limited` |
    | Internal / 其他 | 500 | `internal_error`（不暴露内部原因，仅记录日志） |

    ## 权限（`authz`）
    每个操作的 `x-required-permission` 扩展字段给出路由级所需权限；`null` 表示无需特定权限
    （是否需要登录见该操作的 `security`）。资源级检查（所有者 / 共享 / 全局）在描述中说明。角色与权限对应关系（代码内置，ADR-0004）：
    - `system_admin`：全部权限（users.read, users.write, audit.read, settings.read, settings.write,
      channels.read, channels.write, channels.manage, models.manage, routes.manage, keys.own,
      plugins.read, plugins.manage, plugins.trust, billing.own, billing.manage, stats.own, stats.all）
    - `channel_admin`：channels.read, channels.write, keys.own, plugins.read, billing.own, stats.own,
      channels.manage, models.manage, routes.manage, plugins.manage, stats.all
    - `user`：channels.read, channels.write, keys.own, plugins.read, billing.own, stats.own
    - `auditor`：users.read, audit.read, settings.read, channels.read, plugins.read, stats.own, stats.all

    所有权限检查都在服务端执行；`GET /api/me` 返回的 `permissions` 仅用于前端控制界面可见性。
    角色与账号状态在每次请求时从数据库重新读取，管理员修改后立即生效；用户被停用后，其所有会话被吊销，
    其所有 Gateway Key 也立即无法调用网关（`403 account_disabled`，Round 6 续）。

    ## 数据面：认证与路由
    - Key 取自 `x-api-key` 头（优先）或 `Authorization: Bearer <key>`（`Bearer ` 区分大小写，后跟一个空格）。
      Key 不存在、已吊销、已停用、已过期 → `401 authentication`。Key 本身有效（已启用、未过期）但所属用户被停用 →
      `403 account_disabled`（Round 6 续，此前为 401），消息为 `account disabled[: <原因>][ (until <RFC 3339>)]`；该检查先于 Key 策略执行。
      停用期限（`disabledUntil`）已过的用户即使后台任务尚未把状态改回 `active`，也立即按启用处理。认证结果在进程内缓存 10 秒，
      通过控制面吊销 / 修改 Key 或修改用户时缓存立即清空。
    - Key 策略：`ipAllowlist` 不匹配 → `403 permission`；`rpm` 超限（进程内令牌桶）→ `429 rate_limited`；
      `allowedModels` 不含请求的模型 → `403 permission`；`allowedChannels` 限定候选渠道。
    - 候选渠道：已启用、配置了该逻辑模型、且调用者可使用（所有者 / `global` / 显式共享；`channels.manage` **不**授予使用他人私有渠道的权限）；
      固定到插件版本的渠道还要求该插件处于启用状态、版本已批准（停用插件后其渠道立即不再参与路由）。
      `/v1/embeddings`、`/v1/images/*` 与 `/v1/audio/*` 只考虑 `openai` 类型的渠道（`channel.Supports`）；`/v1/completions` 只考虑
      `config.supportsCompletions = true` 的 `openai` 渠道（Round 14，`phase14-api.md`）。
      没有候选渠道 → `404 model_not_found`。按 `priority` 降序分组；同一优先级内先按协议匹配度排序（无需转换的直通渠道 → 一步转换 →
      经 Chat 两步转换，Round 4 起，`protocol.ConversionHops`），再按 `weight` 加权随机；处于熔断（open）状态的渠道跳过。
      每个候选渠道使用的上游协议见下文“跨协议兼容”的路由表（`channel.Dialect`）。
    - 渠道档位（`docs/contracts/phase5-api.md` §1）：每个候选渠道相对于调用者属于一档——`own`（调用者自己的渠道，含管理员自己的渠道）、
      `shared`（其他**普通用户**共享给调用者的渠道）、`platform`（所有者为 `system_admin` / `channel_admin`，作用域 global 或共享给调用者）。
      所有者角色取自渠道快照（每 15 秒及修改用户角色后刷新）。尝试顺序为 **own → shared → platform**，每档内部按上述优先级 / 协议匹配度 / 权重排序。
      own / shared 渠道**不计费**：不检查套餐配额、不预留、不扣钱包、不计入套餐用量，请求日志 `charge` / `quotaCharge` 为 `"0"`、`cost` 为 null；
      它们每个最多尝试一次（不受 `maxAttempts` 限制），失败后是否继续按 `gateway.retryOn` 判断。
    - 路由规则（Round 5，`/api/admin/routes`）：按 `position` 找到第一条启用、模型匹配（精确或 `*` 通配）且角色匹配的规则。
      规则**只作用于 platform 档**：`targets` 只会**缩小** platform 档的候选范围（platform 候选 = 上述 platform 渠道 ∩ targets，可覆盖优先级 / 权重），
      `strategy`、`protocolPreference` 决定 platform 档的尝试顺序，`retry` 决定每个模型 platform 档的尝试次数与可换渠道重试的失败类型，
      `fallbackModels` 在本模型**所有档位**都失败（且尚未写出字节）后依次改用其他逻辑模型（回退模型同样按 own → shared → platform 选择，
      重新经过 Key 策略、路由、配额与预留；请求体 `model` 改写为回退模型，按回退模型计价，请求日志 `servedModel` 记录实际模型）。
      没有规则命中时行为同上。可用 `POST /api/admin/routes/preview` 预览（候选带 `tier`）。
    - 没有规则命中时每个模型最多尝试 `gateway.maxAttempts`（系统设置，默认 3）个 platform 渠道，可换渠道重试的失败类型取 `gateway.retryOn`
      （系统设置，默认除 `client_error` 外全部）；一次请求（含所有档位与回退模型）总共不超过 10 次。
      只在**尚未向客户端写出任何字节**时回退。失败类型**只按上游 HTTP 状态码判断，不解析错误信息**：
      连接失败 / 被网络策略拒绝 / 流式在首个事件前读取中断（`network`）、等待响应头超时（渠道 `config.timeoutSeconds`，默认 60 秒）与上游 408（`timeout`）、
      上游 429（`rate_limit`）、上游 401/403（`auth_error`）、上游 404（`not_found`）、上游 5xx、3xx、畸形响应、流式不完整、渠道插件的请求 Hook 失败
      （`server_error`）、上游其他 4xx（`client_error`，默认不重试）。不重试时以对应错误返回（其他 4xx 为 `upstream_bad_request`，状态码透传，422 改为 400）。
    - 熔断：同一渠道连续 3 次健康类失败（上游 404 不计）→ `open` 30 秒 → 放行 1 个探测请求。
      全部候选都处于熔断时返回 `502 upstream_unavailable`。
    - 计费检查延后（Round 5 续）：套餐配额判断与钱包预留推迟到**第一次尝试 platform 档渠道之前**才执行；请求完全由 own / shared 渠道完成时，
      即使余额为 0、套餐用完也能成功。own / shared 尝试都失败而 platform 档被配额或余额拦下时返回 `429` / `402`（同下文）。
      请求日志 `channelTier` 记录实际提供服务的渠道档位（失败请求取最后一次尝试的渠道），只有 platform 档的请求结算与计入配额。
    - 套餐配额（Round 4，`subscription.Decide`）：第一次尝试 platform 渠道之前、钱包预留之前，检查该用户**覆盖该逻辑模型**的有效订阅
      （订阅 `models` 为空或包含该模型，且 `startsAt ≤ now < endsAt`、未取消）。某份订阅所有适用规则（规则 `models` 为空或包含该模型）
      的当前窗口都满足 `used < limit` 时即可用；有多份可用时选 `endsAt` 最早的一份，本次请求**不经过钱包**（不预留、不扣费），
      请求日志记 `subscriptionId`。都不可用时按超额偏好处理（Round 5）：Key 策略的 `quotaOverflow`，为空时取用户的
      `GET /api/billing/preferences`。`wallet` → 照常走钱包；`block`（默认）→ 返回
      `429 quota_exceeded`（带 `Retry-After`）或 `429 quota_exhausted`（不带 `Retry-After`），语义见下文错误表后的说明。
      没有任何覆盖该模型的订阅 → 照常走钱包。请求成功结束后（含客户端中途断开但已产生用量的流式请求）异步把用量计入各规则的窗口；
      失败的请求不计量。配额是**软上限**：并发请求在入账前都能通过检查，可能使用量略超上限，之后的请求会被阻断。
    - 计费：若逻辑模型配置了售价且 `billing.enforce=true`，可用余额（余额 − 预留）> 0 时放行，否则返回 `402 insufficient_balance`。
      放行时按售价预留（请求体估算的输入 token + 请求中的 `max_tokens`；未给 `max_tokens` 时不计输出，embeddings 同样不计输出），
      预留额**不超过可用余额**——估算超过余额不会被拒绝（Round 5）。结束后按实际用量结算，余额最多因进行中的请求变为负数，之后可用余额 ≤ 0 会阻止新请求。失败的请求不收费。由订阅覆盖的请求不预留、不扣费（`charge` 为 0，
      按售价折算的金额记在请求日志的 `quotaCharge`）。详见 `docs/operations/configuration.md`“计费模式”“套餐与周期配额”。
    - 用户组与限额（Round 6，`docs/contracts/phase8-api.md`）：platform 档的售价 = 价格版本的金额 × 该版本按**请求开始时间**命中的分时倍率
      × 用户所在组的 `priceMultiplier`（一次舍入；套餐 `charge` 计量与 `quotaCharge` 同样使用乘过倍率的金额）；成本价只乘它自己的分时倍率，
      不乘组倍率；own / shared 渠道仍然免费。请求日志 `priceMultiplier` 记录本次生效的“组倍率 × 分时倍率”。
      在第一次尝试**任何**渠道之前检查组的 `rpm`（每个实例进程内的令牌桶，多实例时为每实例上限；`429 rate_limited` + `Retry-After`）与
      `rpd`（`429 user_request_limit`，`Retry-After` 为到组时区次日零点的秒数；只统计通过限额检查且至少尝试了一个渠道的请求）；
      在第一次尝试 platform 渠道之前（与套餐 / 钱包检查同一位置，仅对由钱包付费的已定价请求）检查组的 `dailySpend` / `monthlySpend` 与 Key 的
      `spendLimit`：已用 ≥ 上限 → `429 spend_limit_exceeded`（消息说明是哪个限额、何时重置；`Retry-After` 为到窗口结束的秒数，`total` 窗口不带），
      钱包预留额另不超过最小的剩余额度。own / shared 渠道不受消费限额约束，但受 `rpm` / `rpd` 约束。限额为软上限，计数在结算事务中累加。
    - 请求体上限 32 MiB（`/v1/images/*` 与 `/v1/audio/transcriptions`、`/v1/audio/translations` 为 64 MiB；超出 → `413`，类别 `invalid_request`，在联系任何上游之前返回）；非流式上游响应上限 64 MiB；
      流式响应 5 分钟无数据即中止。
    - 未注册的 `/v1/*` 路径（任意方法）返回 `400 invalid_request`（消息 `unknown endpoint <path>`）；已注册路径使用错误的方法返回 `405`（类别 `invalid_request`）。
      这两种情况下，路径以 `/messages` 结尾或带 `anthropic-version` 头时使用 Anthropic 错误格式，否则使用 OpenAI 错误格式。
    - 默认不记录请求 / 响应正文；`/v1/chat/completions`、`/v1/completions`、`/v1/responses`、`/v1/embeddings`、`/v1/images/*`、`/v1/audio/*`、`/v1/messages` 的每个请求（含认证失败的请求）写一条请求日志（见 `GET /api/logs`）；
      日志只记录按请求头识别出的客户端 id 与版本（Round 13，`phase13-api.md`），不记录原始 User-Agent 或其他请求头；
      `/v1/models` 与 `/v1/messages/count_tokens` 不写请求日志、不计费。

    ## 数据面：错误类别与映射（`protocol/errors.go`）
    数据面错误按“类别”分类，再按入口协议渲染。`/v1/chat/completions`、`/v1/completions`、`/v1/responses`、`/v1/embeddings`、`/v1/images/*`、`/v1/audio/*` 以及不带 `anthropic-version` 的 `/v1/models`
    使用 OpenAI 格式 `{"error":{"message","type","param":null,"code"}}`；`/v1/messages` 以及带 `anthropic-version` 的 `/v1/models`
    使用 Anthropic 格式 `{"type":"error","error":{"type","message"}}`。

    | 类别 | HTTP | OpenAI `type` / `code` | Anthropic `error.type` |
    |---|---|---|---|
    | `invalid_request` | 400（请求体过大 413，方法不允许 405） | `invalid_request_error` / `invalid_request` | `invalid_request_error` |
    | `unsupported_parameter` | 400 | `invalid_request_error` / `unsupported_parameter` | `invalid_request_error` |
    | `authentication` | 401 | `invalid_request_error` / `invalid_api_key` | `authentication_error` |
    | `permission` | 403 | `invalid_request_error` / `permission_denied` | `permission_error` |
    | `account_disabled` | 403 | `invalid_request_error` / `account_disabled` | `permission_error` |
    | `model_not_found` | 404 | `invalid_request_error` / `model_not_found` | `not_found_error` |
    | `insufficient_balance` | 402 | `insufficient_quota` / `insufficient_balance` | `permission_error` |
    | `quota_exceeded` | 429（带 `Retry-After`） | `insufficient_quota` / `quota_exceeded` | `rate_limit_error` |
    | `quota_exhausted` | 429（不带 `Retry-After`） | `insufficient_quota` / `quota_exhausted` | `rate_limit_error` |
    | `rate_limited` | 429 | `rate_limit_exceeded` / `rate_limited` | `rate_limit_error` |
    | `user_request_limit` | 429（带 `Retry-After`） | `rate_limit_exceeded` / `user_request_limit` | `rate_limit_error` |
    | `spend_limit_exceeded` | 429（`total` 窗口不带 `Retry-After`） | `insufficient_quota` / `spend_limit_exceeded` | `rate_limit_error` |
    | `upstream_rate_limited` | 429 | `rate_limit_exceeded` / `upstream_rate_limited` | `rate_limit_error` |
    | `upstream_bad_request` | 透传上游 4xx（422 → 400） | `invalid_request_error` / `upstream_bad_request` | `invalid_request_error` |
    | `upstream_authentication` | 502 | `server_error` / `upstream_authentication` | `api_error` |
    | `upstream_unavailable` | 502 | `server_error` / `upstream_unavailable` | `overloaded_error` |
    | `upstream_invalid_response` | 502 | `server_error` / `upstream_invalid_response` | `api_error` |
    | `upstream_timeout` | 504 | `server_error` / `upstream_timeout` | `api_error` |
    | `client_closed` | 499（仅出现在请求日志中） | `server_error` / `client_closed` | `api_error` |
    | `plugin_error` | 502 | `server_error` / `plugin_error` | `api_error` |
    | `internal` | 500 | `server_error` / `internal` | `api_error` |

    `account_disabled`（Round 6 续）：Key 有效但所属用户已被管理员停用，消息含停用原因与到期时间（如
    `account disabled: 违反使用条款 (until 2026-10-15T00:00:00Z)`；没有原因 / 永久停用时省略对应部分）。Key 不存在、已吊销、已停用或已过期仍为 `401 authentication`。

    `rate_limited` 也用于用户组的 `rpm`（Round 6，消息 `user request rate limit exceeded (group "…": N requests per minute)`，带 `Retry-After`）。
    `user_request_limit` / `spend_limit_exceeded`（Round 6，`docs/contracts/phase8-api.md` §2.2）：用户组的每日请求数用完，或用户组每日 / 每月消费、
    API Key 消费上限已达到；消息为英文，说明限额与重置时间（组时区），如
    `daily spend limit of your user group reached (5 / 5); resets at 2026-10-10 00:00 CST`。

    `plugin_error`：渠道插件的请求 Hook 执行失败（异常、超时、返回值非法、输出超限等），消息为
    `channel plugin hook failed: <脱敏原因>`；按可回退的上游失败处理（换下一个候选渠道）并计入该渠道的熔断计数。

    `quota_exceeded` / `quota_exhausted`（套餐配额，`subscription/quota.go`）：消息为中文，包含套餐名、规则名（`label`，缺省为 `id`）与重置时间
    （按规则的 `timezone` 显示，非 calendar 规则用 UTC；不是当天时带日期），如 `套餐「Pro」的「5 小时窗口」额度已用完，将于 18:30 UTC 重置`。
    - 一份订阅只有在它**所有**被超出的规则都重置后才会重新放行；`Retry-After`（整数秒，向上取整，至少 1）取各订阅中最早可放行的时刻，
      因此按 `Retry-After` 重试不会立即再次被同一份订阅阻断。rolling 窗口的放行时刻是最早的若干 5 分钟分桶过期、用量回落到上限以下的时刻。
    - 放行时刻不早于订阅到期时间（`endsAt`）的订阅、以及 `lifetime` 规则用尽的订阅视为不可恢复；所有阻断订阅都不可恢复时返回
      `quota_exhausted`，不带 `Retry-After`（消息以“额度已用完”或“…，订阅到期前不会重置”结尾）。
    - 计量值为 0 的请求（如 `modelWeights` 为 0 的模型、`charge` 计量但模型没有售价）不入账，也不会开启 session 窗口。

    上游错误消息只保留脱敏摘要（前缀 `upstream: `，最长 300 字符，过滤形似密钥的字符串）。流式响应开始后发生的错误以协议格式的
    错误事件结束流：OpenAI 为 `data: {"error":{...}}`，Anthropic 为 `event: error` + `data: {"type":"error",...}`；HTTP 状态仍为 200。

    ## 数据面：跨协议兼容（`protocol/request.go`、`protocol/responses.go`、`protocol/convert.go`、`protocol/stream.go`）
    Round 4 起 Chat Completions、Responses、Messages 三种协议两两互转（请求、非流式响应、流式响应、工具调用、图片）：以 Chat 为中间格式，
    Chat ↔ Messages、Chat ↔ Responses 为直接转换，Messages ↔ Responses 经 Chat 两步组合（流式时串联两个流处理器）。
    同协议请求直通，只改写 `model`，其他字段原样保留（OpenAI Chat 与 Completions 流式另外强制 `stream_options.include_usage=true` 以便计量，
    客户端未请求时网关会过滤掉那条只含 usage 的分片）。`/v1/embeddings`、`/v1/images/*`、`/v1/audio/*` 与 `/v1/completions` 只做直通。

    上游协议的选择（`channel.Dialect(client, model)`，对每个候选渠道分别计算）：

    | 渠道 | 上游协议 |
    |---|---|
    | `anthropic` | 总是 Messages |
    | `openai`，该逻辑模型的映射 `upstreamProtocol = "responses"` | 总是 Responses（适用于只支持 Responses 的模型） |
    | `openai`，`/v1/responses` 请求且渠道 `config.supportsResponses = true` | Responses 直通 |
    | `openai`，其他情况 | Chat Completions |

    | 客户端 \ 上游 | Chat | Responses | Messages |
    |---|---|---|---|
    | `/v1/chat/completions` | 直通 | 转换 | 转换 |
    | `/v1/responses` | 转换 | 直通 | 转换（经 Chat） |
    | `/v1/messages` | 转换 | 转换（经 Chat） | 直通 |

    Responses 相关的转换规则：
    - `previous_response_id`（依赖上游保存的会话状态）在转换时**无论兼容模式如何**都返回 `400 unsupported_parameter`，提示在请求中携带完整的 `input`；
      Responses 直通时原样转发。
    - Responses → Chat：可转换字段 `model, input, instructions, max_output_tokens, temperature, top_p, tools, tool_choice, parallel_tool_calls, stream,
      reasoning, text, user, prompt_cache_key, safety_identifier`（`prompt_cache_key` / `safety_identifier` 原样保留，Round 12；`instructions` 变为 system 消息，`developer` 角色按 system 处理，`text.format` 映射为 `response_format`，
      `reasoning.effort` 映射为 `reasoning_effort`）；中性字段 `store`（任意值）、`metadata` 为空、`truncation="disabled"`、`background=false`、
      `include` 为空；提示类字段 `service_tier`、`max_tool_calls`、`input` 中的 `reasoning` 项
      （告警 `input[].reasoning`）与 `reasoning.summary`；无法转换：非 `function` 工具（`tools[].type=<type>`）、`input_image` 只给 `file_id`、
      其他输入项 / 内容类型等。
    - Chat → Responses：可转换字段 `model, messages, max_tokens, max_completion_tokens, temperature, top_p, stream, stream_options, tools, tool_choice,
      parallel_tool_calls, user, reasoning_effort, response_format, prompt_cache_key, safety_identifier`（`reasoning_effort` 变为
      `reasoning: {effort, summary: "auto"}`；`prompt_cache_key` / `safety_identifier` 原样保留，Round 12）；
      **`stop` 在 Responses 中没有对应参数，按无法转换处理**（strict → 400，lenient → 丢弃并告警）；中性字段 `n=1`、`presence_penalty=0`、
      `frequency_penalty=0`、`logprobs=false`、`store=false`、`metadata` 为空；提示类字段 `service_tier`、
      历史中的 `messages[].reasoning_content`。转换到 Responses 的请求**总是带 `store: false`**，避免上游保存对话。
    - 响应方向：Responses 的 `reasoning` 输出项（摘要）↔ Chat 的 `reasoning_content` ↔ Anthropic `thinking`；`status: "incomplete"` 且原因为
      `max_output_tokens` ↔ `finish_reason: "length"`。转换生成的 Responses 流式事件序列为 `response.created` → `response.in_progress` → …
      → `response.completed`（或 `response.incomplete`）。

    转换时请求字段分四类（以 Chat ↔ Anthropic 为例；Responses 的分类见上）：
    1. **可转换字段**：按协议语义映射。Chat → Anthropic：`model, messages, max_tokens, max_completion_tokens, temperature, top_p, stop,
       stream, stream_options, tools, tool_choice, parallel_tool_calls, user, reasoning_effort`（缺少 max_tokens 时使用 4096）。
       Anthropic → Chat：`model, messages, system, max_tokens, temperature, top_p, stop_sequences, stream, tools, tool_choice, metadata, thinking,
       output_config`（上限字段写为渠道 `config.maxTokensField`）。对话中间的 `role: "system"` 消息（Claude Code 等新版客户端会发送）
       转换为 OpenAI 的 system 消息，保留原位置。`metadata.user_id` 映射为 `user`：不超过 64 字符时原样保留，
       更长时（如 Claude Code 的 JSON 设备 / 会话元数据）替换为稳定的假名 `og-` + SHA-256 前 16 字节的十六进制（共 35 字符），
       避免触发上游长度限制，也不把原始设备标识转发给第三方。
    2. **中性字段**（仅 Chat → Anthropic）：取无操作的默认值时静默忽略，否则按“无法转换”处理：
       `n=1`、`presence_penalty=0`、`frequency_penalty=0`、`logprobs=false`、`store=false`、`metadata` 为空、`response_format.type=text`。
    3. **提示类字段**：只影响成本 / 延迟而不改变语义，**无论兼容模式如何都丢弃**，并列入 `X-OmniGate-Compat-Warnings`。
       Chat → Anthropic：`service_tier`、`prompt_cache_key`、`safety_identifier`、`messages[].name`、历史中的 `messages[].reasoning_content`、
       `tools[].function.strict`、非 `auto` 的 `image_url.detail`；Anthropic → Chat：`service_tier`、`context_management`、`safeguards`、
       所有 `cache_control`、历史 assistant 消息中的 `thinking` / `redacted_thinking` 块、`tool_result.is_error`（内容前加 `[tool error] ` 前缀）。
    4. **无法转换的字段**：其他非 null 顶层字段（如 `seed`、`logit_bias`、`top_k`），以及不支持的内容块类型
       （记为 `content[].type=<type>`）、工具类型（`tools[].type=<type>`，如 Anthropic 服务端工具）、`tool_choice` 形式、`thinking.type`、
       `output_config` 中除 `effort` 以外的键（记为 `output_config.<key>`）等。
       Key 的 `policy.compatMode`：`strict`（默认）→ `400 unsupported_parameter`，消息列出全部字段名与目标协议；
       `lenient` → 丢弃这些字段，与提示类字段一起列入 `X-OmniGate-Compat-Warnings`。

    推理强度映射（近似且确定）：`reasoning_effort` 为 `none` / `minimal` → 不开启 thinking；`low` / `medium` / `high` →
    `thinking.budget_tokens` 2048 / 8192 / 24576；其他取值 → `400 invalid_request`。开启 thinking 时若 `max_tokens ≤ budget`，
    `max_tokens` 改为 `budget + max_tokens`（告警 `max_tokens(raised_for_thinking)`），并移除不等于 1 的 `temperature`
    （告警 `temperature(thinking)`）与 `top_p`（告警 `top_p(thinking)`）。反向：`thinking.type=enabled` 时 `budget_tokens` < 4096 → `low`，
    < 16384 → `medium`，否则 `high`；`adaptive` → `medium`；`disabled` → 不设置。`output_config.effort`（`low` / `medium` / `high`，`max` 按 `high`；
    其他取值 → `400 invalid_request`）优先于上述由 thinking 推出的强度：`thinking` 为 `enabled` / `adaptive` 或未提供时，
    `reasoning_effort` 取该值；`thinking.type=disabled` 时忽略 `effort`。

    ## 数据面：插件请求 Hook（`gateway/gateway.go`、`plugin/runtime.go`）
    渠道固定到声明了 `hooks` 的插件版本时（内置插件 `builtin.openai` / `builtin.anthropic` 没有 Hook，请求热路径上零 JS 调用），网关在完成协议转换、
    构造好上游请求之后、发送之前，在同一个插件运行时内依次执行 manifest 中声明的 `transformRequest`、`signRequest`。
    入参为 `{dialect, path, headers, body}` 与 `ctx`（`capability` 为空字符串）：`dialect` 为上游协议（`openai.chat` / `openai.responses` /
    `openai.embeddings` / `openai.images.generations` / `openai.images.edits` / `openai.images.variations` / `openai.audio.transcriptions` /
    `openai.audio.translations` / `openai.audio.speech` / `openai.completions` / `anthropic.messages`），
    `path` 为相对渠道 `baseUrl` 的默认路径（如 `/chat/completions`、`/responses`、`/embeddings`、`/images/generations`、`/images/edits`、
    `/images/variations`、`/audio/transcriptions`、`/audio/translations`、`/audio/speech`、`/completions`、`/v1/messages`），`headers` 只含渠道 `config.headers`
    （不含网关设置的认证头），`body` 为已解析的上游请求体。
    - 图片接口（Round 6 续）与音频接口：JSON 请求照常执行 `transformRequest` 与 `signRequest`；`multipart/form-data` 请求**只执行 `signRequest`**，
      入参 `body` 为 `{}`，Hook 可以修改 `path` 与请求头，返回的 `body` 被忽略（multipart 正文由网关重新编码后原样发送）。
    - 返回值替换路径、请求头与请求体：`path` 必须以 `/` 开头且不能包含主机（`//`、`://`）；省略 `body` 时保留原请求体；返回的请求头按渠道自定义头
      相同的规则过滤（不合法或被禁止的头被静默丢弃），值中的 `og.secret()` 句柄在发送前由宿主替换为明文。
    - 声明了 `signRequest` 时，网关**不再**自动添加 `Authorization`（openai）/ `x-api-key`（anthropic），改为允许 Hook 返回这两个头；其余头（如
      `anthropic-version`）照常处理。
    - 超时：每个 Hook 50 ms（两个都声明时整体预算 100 ms）。Hook 内也可以调用 `og.fetch`（受 `permissions.network` 限制）。
      Hook 返回值包含整个请求体，其上限按请求体放宽为约 2 倍请求体 + 1 MiB（最大 80 MiB），不受能力输出 256 KiB 上限约束。
    - 失败（抛出异常、超时、返回值非法、输出超限、并发已满）→ 本次尝试以 `502 plugin_error` 失败，按可回退的上游失败处理并计入该渠道的熔断计数；
      超时与内存中断还计入插件的资源违规（同一插件 5 分钟内 3 次 → 自动停用，见 `PATCH /api/plugins/{id}`）。

    ## 数据面：图片接口（Round 6 续，`docs/contracts/phase7-api.md` §1，`gateway/images.go`、`protocol/images.go`）
    - `POST /v1/images/generations`（JSON）、`/v1/images/edits`、`/v1/images/variations`（`multipart/form-data`；三个接口都同样接受 JSON 请求体，
      即 Content-Type 不是 multipart 时按 JSON 解析并原样转发）。只路由到 `openai` 类型渠道，不做协议转换，上游路径为渠道 `baseUrl` +
      `/images/generations`、`/images/edits`、`/images/variations`。请求日志 `inbound` 分别为 `openai.images.generations` / `openai.images.edits` /
      `openai.images.variations`。
    - 网关只改写 `model`（改为渠道的上游模型名）：JSON 改写该字段；multipart 每个 part 原样复制（含 part 头与原始字节，不做传输解码），只替换
      `model` 文本字段的值，使用新的随机 boundary 并发送精确的 `Content-Length`。请求体上限 64 MiB（超出 → `413`，消息
      `request body exceeds 67108864 bytes`，在联系任何上游之前返回）；multipart 中的 `model` / `prompt` / `n` / `stream` 文本字段各限 1 MiB
      （超出 → `400`），缺少 boundary 或格式错误 → `400 invalid_request`，缺少 `model` → `400`（消息 `缺少 model 字段`）。
    - 重试：multipart 正文在解析时缓存一次（8 MiB 以内在内存中，超出部分写入 `$TMPDIR` 下的私有临时文件 `omnigate-image-*.part`，请求结束时删除），
      每次尝试（含换渠道重试与路由规则的回退模型）都从缓存重新编码。路由、档位（own → shared → platform，延后计费）、重试、熔断、
      Key 策略（allowedModels / allowedChannels / IP / RPM）、路由规则、套餐配额与计费规则与其他接口相同；own / shared 渠道同样免费。
    - `stream: true`：按 SSE 逐字节透传上游事件（`image_generation.partial_image` / `image_generation.completed` / `image_edit.partial_image` /
      `image_edit.completed`）；图片张数 = `*.completed` 事件数，用量取完成事件中的 `usage`（多个事件都带 usage 时各字段取最大值）。
      上游对流式请求返回 JSON（如不支持流式的 `dall-e-*`）时按普通 JSON 响应返回。
    - 非流式响应原样返回：图片张数 = `data` 数组长度，用量取 `usage`（`input_tokens`、`output_tokens`、`input_tokens_details.image_tokens`）；
      没有 `usage` 时 token 数记 0（**不估算**），只按 `perImage` 与 `perRequest` 计费。
    - 计价（价格的 `perImage`、`imageInputPerM`）：费用 = `perRequest` + (输入 − 图片输入) × `inputPerM` + 图片输入 × (`imageInputPerM` ?? `inputPerM`)
      + 输出 × `outputPerM` + 缓存读 / 写（同前）+ 图片张数 × `perImage`；成本价按同一公式计算。预留余额 = `perRequest` + `n`（默认 1，限定在 1–100）
      × `perImage` + 估算的文本输入（`prompt` 字节数 / 4 × `inputPerM`），同样按可用余额封顶（可用余额 ≤ 0 时才返回 `402 insufficient_balance`）。
    - 请求日志的 `imageCount` 为输出图片张数，`usage.imageInputTokens` 为输入中的图片 token（`usage.input` 为全部输入）；套餐配额计量 `images` 按输出图片张数计。

    ## 数据面：音频接口（Round 6 续，`docs/contracts/phase9-api.md` §1，`gateway/audio.go`、`protocol/audio.go`）
    - `POST /v1/audio/transcriptions`、`/v1/audio/translations`（`multipart/form-data`，**只接受 multipart**，否则 `400 invalid_request`）与
      `POST /v1/audio/speech`（JSON）。只路由到 `openai` 类型渠道，不做协议转换，上游路径为渠道 `baseUrl` + `/audio/transcriptions`、
      `/audio/translations`、`/audio/speech`；请求日志 `inbound` 分别为 `openai.audio.transcriptions` / `openai.audio.translations` / `openai.audio.speech`。
      该逻辑模型只由 anthropic 渠道提供时返回 `404 model_not_found`（消息以 ` (audio endpoints are served by OpenAI-compatible channels only)` 结尾）。
    - multipart 的处理与图片接口完全相同：只替换 `model` 文本字段，其余 part（`file`、`language`、`prompt`、`response_format`、`temperature`、
      `timestamp_granularities[]`、`include[]`、`chunking_strategy`、`stream` 等）连同 part 头原样转发；请求体上限 64 MiB；正文缓存一次
      （超过 8 MiB 写入 `$TMPDIR/omnigate-audio-*.part`，请求结束时删除），换渠道重试与回退模型从缓存重新编码。`/v1/audio/speech` 的请求体上限同普通接口（32 MiB）。
    - 响应透传：转写 / 翻译的 JSON、`text`、`srt`、`verbose_json`、`vtt` 响应原样返回并透传上游 `Content-Type`；`stream: true` 时按 SSE 透传
      `transcript.text.delta` / `transcript.text.done`。语音合成的二进制音频**边收边发**（每次从上游读到数据立即写出并 flush，不在网关缓冲；
      `Content-Type` 透传），`stream_format: "sse"` 时按 SSE 透传 `speech.audio.delta` / `speech.audio.done`。
    - 重试：响应的第一个字节写给客户端之前，上游错误、连接失败、空响应可以按重试策略换渠道；之后不再重试。二进制音频传输中途上游断开时，
      网关记录日志（`statusCode` 200，`errorClass = upstream_invalid_response`）后**中断与客户端的连接**，客户端因此能发现音频不完整。
    - 计量（依次尝试）：① 响应的 `usage`：`{type: "tokens", input_tokens, output_tokens, input_token_details: {audio_tokens, text_tokens}}` 按 token 计
      （`audio_tokens` 为音频输入；语音合成没有 `output_token_details` 时全部输出 token 都是音频输出），`{type: "duration", seconds}` 按 `perMinute` 计；
      ② `verbose_json` 的 `duration` 按 `perMinute` 计；③ 语音合成：SSE `speech.audio.done` 中的 `usage` 按 token 计，否则按 `input` 的 Unicode 字符数 ×
      `perMCharacters`；④ 都没有（如 `text` / `srt` / `vtt` 响应）时只收 `perRequest`，请求日志 `usageEstimated: true`。音频时长按秒计费，不足一秒按一秒。
    - 计价：费用 = `perRequest` + 文本输入 × `inputPerM` + 音频输入 × (`audioInputPerM` ?? `inputPerM`) + 文本输出 × `outputPerM` + 音频输出 ×
      (`audioOutputPerM` ?? `outputPerM`) + 秒数 × `perMinute` / 60 + 字符数 × `perMCharacters` / 1,000,000（再乘分时倍率与用户组倍率）；成本价按同一公式计算。
      预留余额：语音合成 = `perRequest` + 字符数 × `perMCharacters`；转写 / 翻译 = `perRequest`。
    - 请求日志：`audioSeconds`（计费秒数）、`usageEstimated`、`usage.audioInputTokens`、`usage.audioOutputTokens`、`usage.inputCharacters`；
      套餐配额计量 `audio_seconds` 按计费秒数计。路由、档位、熔断、Key 策略、用户组倍率与限额、分时价格、套餐与计费规则与其他接口相同。

    ## 登录失败重定向
    登录回调失败时跳转到 SPA 页面 `/login?error=<code>`，`<code>` 的取值见 `components.schemas.LoginErrorCode`。
    `account_disabled`（Round 6 续）另带 `reason`（URL 编码的停用原因，空格编码为 `%20`；没有原因时省略）与 `until`
    （RFC 3339 UTC 到期时间；永久停用时省略），如 `/login?error=account_disabled&reason=%E8%BF%9D%E8%A7%84&until=2026-10-15T00:00:00Z`。
servers:
  - url: http://localhost:8080
    description: 本地后端（make dev-server）
  - url: http://localhost:5173
    description: 本地前端开发服务器（Vite 代理 /api 与 /v1 到 8080）
tags:
  - name: probes
    description: 健康检查与就绪探针
  - name: system
    description: 系统信息
  - name: auth
    description: 联邦登录（GitHub OAuth2 适配器 / 通用 OIDC）与登出。OmniGate 不存储密码。
  - name: me
    description: 当前用户与其浏览器会话
  - name: admin
    description: 管理接口（用户、用户组、审计日志）
  - name: channels
    description: |
      上游渠道（`openai` / `anthropic`）：配置、加密凭据、模型映射、可见性（private / shared / global）与健康状态。
      所有者与持有 `channels.manage` 的用户看到完整的 `Channel`；仅能“使用”该渠道的用户（global 或被共享）只看到 `ChannelSummary`。
      每个渠道固定到一个已批准的插件版本（`plugin`），插件声明的原子能力（余额、模型列表等）通过 `/api/channels/{id}/capabilities` 查看与触发。
  - name: plugins
    description: |
      渠道插件（Phase 2）：插件包（manifest v1 + TS/JS 源码）、在线草稿、编译检查、模拟测试、发布为不可变版本、权限审批、ZIP 导入导出。
      `source`：`builtin`（Go 原生协议，不可编辑）、`bundled`（随二进制分发的示例，启动时自动安装 / 更新并自动批准）、
      `upload`（ZIP 导入）、`editor`（在线新建）。读取需要 `plugins.read`，编辑 / 发布 / 启停 / 删除需要 `plugins.manage`，审批需要 `plugins.trust`。
  - name: keys
    description: Gateway Key（`og-` 前缀），供 SDK / CLI 调用 `/v1/*`。明文只在创建 / 轮换时返回一次，服务端只保存 SHA-256 摘要。
  - name: models
    description: 模型目录与价格版本（价格不可修改、不可删除，改价即新增版本）
  - name: logs
    description: 请求日志与统计（不含请求 / 响应正文）
  - name: billing
    description: |
      钱包、账本、兑换码（ADR-0006），以及 Round 4 的套餐（Plan）、订阅（Subscription）与周期配额（`docs/contracts/phase3-api.md`）。
      管理接口位于 `/api/admin/billing/*`；用户可见的套餐目录为 `GET /api/plans`。
  - name: routes
    description: 路由规则（Round 5，`docs/contracts/phase4-api.md` §2）：改变某些模型的渠道选择方式、重试与回退模型。需要 `routes.manage`。
  - name: settings
    description: 系统设置（Round 5，`docs/contracts/phase4-api.md` §3）：可在运行时修改的全局设置。需要 `settings.write`。
  - name: affinity
    description: |
      会话亲和（Round 12，`docs/contracts/phase12-api.md`）：规则是系统设置 `gateway.affinity`；这里是内存中的会话绑定缓存
      （统计 `settings.read`，清空 `settings.write`）。
  - name: notifications
    description: |
      通知（Round 6，`docs/contracts/phase6-api.md`）：站内通知、邮件（SMTP）与 Webhook 投递、用户偏好、
      一键退订，以及告警与上游余额概览。
  - name: plaza
    description: |
      模型资料与模型广场（Round 5 续，`docs/contracts/phase5-api.md` §2–§3）：管理员为逻辑模型补充展示信息（`models.manage`）；
      平台模型广场（可匿名）与“我的模型”。
  - name: gateway
    description: |
      数据面：OpenAI / Anthropic 兼容接口。请求与响应正文遵循上游官方规范，本文件不重复定义：
      [OpenAI Chat Completions](https://platform.openai.com/docs/api-reference/chat)、
      [OpenAI Responses](https://platform.openai.com/docs/api-reference/responses)、
      [OpenAI Embeddings](https://platform.openai.com/docs/api-reference/embeddings)、
      [OpenAI Images](https://platform.openai.com/docs/api-reference/images)、
      [OpenAI Audio](https://platform.openai.com/docs/api-reference/audio)、
      [Anthropic Messages](https://docs.anthropic.com/en/api/messages)。
      认证、路由、错误映射与跨协议兼容规则见文档开头的说明。

security:
  - sessionCookie: []

webhooks:
  notification:
    post:
      tags: [notifications]
      operationId: notificationWebhook
      summary: 通知 Webhook（OmniGate → 用户配置的地址）
      description: |
        `json` 格式的请求体如下；`feishu` / `dingtalk` / `wecom` / `slack` 转换为对应机器人的消息格式（卡片 / Markdown / text）。
        超时 10 秒，经过防 SSRF 拨号器；非 2xx（或机器人接口返回非 0 错误码）视为失败，按 1、5、30 分钟重试 3 次。
      parameters:
        - name: X-OmniGate-Signature
          in: header
          description: "`sha256=<hex HMAC-SHA256(secret, body)>`（设置了密钥时）"
          schema: { type: string }
        - name: X-OmniGate-Event
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: 任意 2xx 表示成功

paths:
  /healthz:
    get:
      tags: [probes]
      operationId: healthz
      summary: 存活探针
      description: 进程存活即返回 200，不访问数据库。Docker 镜像的 HEALTHCHECK 使用该接口。
      security: []
      x-required-permission: null
      responses:
        "200":
          description: 进程存活
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

  /readyz:
    get:
      tags: [probes]
      operationId: readyz
      summary: 就绪探针
      description: |
        在 2 秒超时内 Ping 数据库并检查迁移状态。数据库不可用或存在未执行的迁移（或无法读取迁移状态）时返回 503。
      security: []
      x-required-permission: null
      responses:
        "200":
          description: 数据库可用且无待执行迁移
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, migrations]
                properties:
                  status:
                    type: string
                    const: ready
                  migrations:
                    $ref: "#/components/schemas/MigrationStatus"
              example:
                status: ready
                migrations: { current: 1, latest: 1, pending: 0 }
        "503":
          description: |
            未就绪。`status` 为 `database_unavailable`（此时无 `migrations` 字段）或 `migrations_pending`
            （读取迁移状态失败时 `migrations` 为全 0）。
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [database_unavailable, migrations_pending]
                  migrations:
                    $ref: "#/components/schemas/MigrationStatus"
              examples:
                databaseUnavailable:
                  value: { status: database_unavailable }
                migrationsPending:
                  value:
                    status: migrations_pending
                    migrations: { current: 0, latest: 1, pending: 1 }

  /api/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: 系统信息（公开）
      description: |
        登录页等未登录场景使用。`currency` 为数据库中锁定的结算币种（而非当前环境变量值）。
        `siteName`、`announcement`、`landingEnabled`、`docsUrl`、`publicModelPlaza`、`registrationMode` 取自系统设置（`GET /api/admin/settings`，缓存不超过 5 秒）。
      security: []
      x-required-permission: null
      responses:
        "200":
          description: 系统信息
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
              example:
                name: OmniGate
                version: v0.1.0
                currency: { code: CNY, symbol: "¥", decimals: 2 }
                registrationMode: restricted
                siteName: OmniGate
                announcement: ""
                landingEnabled: true
                docsUrl: ""
                publicModelPlaza: true

  /api/auth/providers:
    get:
      tags: [auth]
      operationId: listAuthProviders
      summary: 已配置的登录方式（公开）
      description: 顺序为 GitHub（若已配置）在前，其后按 `OMNIGATE_AUTH_OIDC` 中的顺序列出 OIDC 提供方。未配置任何提供方时返回空数组。
      security: []
      x-required-permission: null
      responses:
        "200":
          description: 登录方式列表
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthProvider"
              example:
                providers:
                  - { id: github, type: github, displayName: GitHub }
                  - { id: corp, type: oidc, displayName: 公司 SSO }

  /api/auth/{provider}/login:
    get:
      tags: [auth]
      operationId: beginLogin
      summary: 发起登录（浏览器跳转）
      description: |
        浏览器直接导航到该地址（非 XHR）。服务端生成 state、nonce 与 PKCE verifier，用主密钥派生的子密钥加密后写入
        `og_oauth` Cookie（Path=`/api/auth/`，10 分钟，HttpOnly，SameSite=Lax），然后 302 跳转到身份提供方。
        回调地址固定为 `${OMNIGATE_PUBLIC_URL}/api/auth/{provider}/callback`。

        限流：按客户端 IP 前缀（IPv4 /24、IPv6 /48）的令牌桶，突发 30 次、每 2 秒补充 1 次，与回调接口共享，
        仅在单进程内生效。本接口与回调接口都是浏览器跳转，所有失败（未知登录方式、限流、构造授权地址失败）都以 302 跳转到 `/login?error=<code>` 表示，不返回 JSON。
      security: []
      x-required-permission: null
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - name: redirect
          in: query
          required: false
          description: |
            登录成功后跳转的站内路径。仅接受以单个 `/` 开头的同站绝对路径；`//host`、`/\host`、含控制字符、
            以 `/api/` 开头或带 scheme/host 的值一律替换为 `/`。
          schema:
            type: string
            example: /admin/users?page=2
      responses:
        "302":
          description: |
            跳转到身份提供方授权页（同时设置 `og_oauth` Cookie）；失败时跳转到 `/login?error=<code>`：
            未配置该登录方式 → `unknown_provider`；被限流 → `rate_limited`；构造授权地址失败（例如 OIDC 发现文档不可达）→ `oauth_failed`。
          headers:
            Location:
              description: 身份提供方授权地址，或 `/login?error=<LoginErrorCode>`
              schema:
                type: string
            Set-Cookie:
              description: "`og_oauth=<sealed state>; Path=/api/auth/; Max-Age=600; HttpOnly; SameSite=Lax[; Secure]`"
              schema:
                type: string
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"

  /api/auth/{provider}/callback:
    get:
      tags: [auth]
      operationId: loginCallback
      summary: 身份提供方回调（浏览器跳转）
      description: |
        由身份提供方重定向而来。`og_oauth` Cookie 为一次性：无论结果如何都会被清除。处理顺序：
        1. 未知 provider → `/login?error=unknown_provider`。
        2. 限流 → 跳转 `/login?error=rate_limited`。
        3. state Cookie 缺失 / 解密失败 / 过期 / provider 不符 / `state` 参数不符 → `/login?error=state_mismatch`。
        4. 提供方返回 `error` 参数 → `/login?error=oauth_failed`。
        5. 用授权码 + PKCE 换取令牌并获取身份（GitHub：`/user` 与已验证主邮箱；OIDC：校验 id_token 与 nonce），失败 → `oauth_failed`。
        6. 准入判断：已关联账号的身份若账号停用 → `/login?error=account_disabled&reason=<原因>&until=<到期时间>`（Round 6 续：
           `reason` 为 URL 编码的停用原因，空格编码为 `%20`，没有原因时省略；`until` 为 RFC 3339 UTC，永久停用时省略；
           停用期限已过的账号即使后台任务尚未启用也按启用处理，可以登录）；新身份按引导管理员 / 注册模式判断，
           拒绝时为 `registration_closed` 或 `not_allowed`。其余内部错误（含并发注册造成的 `identity_conflict`）→ `oauth_failed`。
        7. 成功：签发会话，设置 `og_session` Cookie，302 跳转到登录时传入的 `redirect`（默认 `/`）。

        每次登录成功写审计 `auth.login`（首次登录另写 `user.create`），拒绝写 `auth.login_denied`。
      security: []
      x-required-permission: null
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - name: code
          in: query
          required: false
          description: 授权码
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: 必须与 `og_oauth` Cookie 中保存的 state 一致
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: 身份提供方返回的错误（例如用户拒绝授权）
          schema:
            type: string
        - name: og_oauth
          in: cookie
          required: false
          description: 登录发起时写入的加密 state Cookie
          schema:
            type: string
      responses:
        "302":
          description: |
            成功时跳转到 `redirect` 目标并设置 `og_session`；失败时跳转到 `/login?error=<code>`，
            `<code>` 取值见 `LoginErrorCode`（`account_disabled` 另带 `reason` / `until` 查询参数）。两种情况都会清除 `og_oauth`。
          headers:
            Location:
              description: 成功为站内路径（默认 `/`）；失败为 `/login?error=<LoginErrorCode>`
              schema:
                type: string
              examples:
                success:
                  value: /admin/users
                denied:
                  value: /login?error=not_allowed
                accountDisabled:
                  summary: 账号被停用（带原因与到期时间）
                  value: /login?error=account_disabled&reason=%E8%BF%9D%E5%8F%8D%E4%BD%BF%E7%94%A8%E6%9D%A1%E6%AC%BE&until=2026-10-15T00:00:00Z
            Set-Cookie:
              description: |
                始终：`og_oauth=; Path=/api/auth/; Max-Age=0`（清除）。
                成功时另有：`og_session=<token>; Path=/; Expires=<now+OMNIGATE_SESSION_TTL>; HttpOnly; SameSite=Lax[; Secure]`。
                被限流时不清除 `og_oauth`。
              schema:
                type: string
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出当前会话
      description: 吊销当前会话（原因 `logout`）并清除 `og_session` Cookie，写审计 `auth.logout`。会话已失效时返回 401 且不清除 Cookie。
      x-required-permission: null
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: 已登出
          headers:
            Set-Cookie:
              description: "`og_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax[; Secure]`"
              schema:
                type: string
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          description: "`not_found`：会话已被并发吊销"
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/me:
    get:
      tags: [me]
      operationId: getMe
      summary: 当前用户与有效权限
      x-required-permission: null
      responses:
        "200":
          description: 当前用户（含已关联的外部身份）与其角色对应的权限列表
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [user, permissions, group]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  permissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Permission"
                  group:
                    $ref: "#/components/schemas/MyGroup"
              example:
                user:
                  id: 0192f0c4-6a2b-7c3d-9e8f-1a2b3c4d5e6f
                  displayName: Alice
                  email: alice@example.com
                  avatarUrl: https://avatars.githubusercontent.com/u/1001
                  role: auditor
                  status: active
                  disabledReason: null
                  disabledUntil: null
                  version: 3
                  createdAt: "2026-10-01T08:00:00Z"
                  lastLoginAt: "2026-10-08T02:15:00Z"
                  identities:
                    - { provider: github, login: alice, email: alice@example.com }
                  group: { id: 01920000-0000-7000-8000-000000000001, name: 默认 }
                permissions: [users.read, audit.read, settings.read, channels.read, plugins.read, stats.own, stats.all]
                group:
                  id: 01920000-0000-7000-8000-000000000001
                  name: 默认
                  priceMultiplier: "1"
                  limits: { rpm: null, rpd: null, dailySpend: null, monthlySpend: null }
                  timezone: Asia/Shanghai
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      summary: 当前用户的有效会话
      description: 仅列出未吊销、未过期且未超过空闲超时的会话，按 `lastSeenAt` 倒序；不分页。`current` 标记发起本请求的会话。
      x-required-permission: null
      responses:
        "200":
