        只包括状态正常且拥有 `billing.own` 的用户；`cards = recipients × quantity`，单批最多 200 000 张。
        `?dryRun=true`：同样校验，只返回人数与张数（`batch: null`，状态码 200），不写数据、不写审计、不发通知。
        正式发放写审计 `reset_card.issue` 并给每位收件人发送通知 `reset_card.issued`。
        错误：`422`（`details` 键 `kind`、`quantity`、`expiresAt`、`planIds`、`note`、`target`；正式发放时没有收件人 → `target`）；
        `target.groupId` / `target.planId` 不存在 → `404 not_found`。
