          + 输出 × `outputPerM` + 缓存读 / 写 + 图片张数 × `perImage`，成本价按同一公式计算。
        - Round 6 续（音频接口，`phase9-api.md` §1.1）：`audioInputPerM` / `audioOutputPerM` 为音频输入 / 输出 token 的单价（省略 / null / 空字符串 =
          按 `inputPerM` / `outputPerM` 计，响应中为 null）；`perMinute` 为每分钟输入音频的价格（按秒计费，不足一秒按一秒）；`perMCharacters` 为每百万
          语音合成输入字符的价格（两者省略 / null / 空字符串 = 0）。
        - `effectiveAt` 缺省为当前时间，不得早于当前时间 1 分钟以上（历史账单不可追溯修改）。
        写审计 `price.create`。
      x-required-permission: models.manage
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceCreateRequest"
            examples:
              sell:
                value: { kind: sell, model: claude-sonnet, inputPerM: "3", outputPerM: "15", cacheReadPerM: "0.3", cacheWritePerM: "3.75" }
              image:
                summary: 图片模型（按张 + token）
                value: { kind: sell, model: gpt-image-1, inputPerM: "5", outputPerM: "40", imageInputPerM: "10", perImage: "0.04" }
              transcription:
                summary: 语音转写（按 token 或按分钟）
                value: { kind: sell, model: gpt-4o-transcribe, inputPerM: "2.5", audioInputPerM: "6", outputPerM: "10", perMinute: "0.006" }
              speech:
                summary: 语音合成（按字符）
                value: { kind: sell, model: tts-1, perMCharacters: "15" }
              cost:
                value: { kind: cost, model: claude-sonnet-4-5, channelId: 0192f0c4-1111-7000-8000-000000000001, inputPerM: "3", outputPerM: "15" }
      responses:
        "201":
          description: 新价格版本
          headers:
            X-OmniGate-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrCsrf"
        "422":
          $ref: "#/components/responses/ValidationFailed"
