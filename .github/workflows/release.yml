# OmniGate 持续集成 / 持续交付：测试 → 构建镜像 → 安全扫描 → 推送 GHCR →（可选）重启雨云应用 / 创建 GitHub Release。
#
# 触发：
#   push 任意分支   测试 + 构建；推送 ghcr.io/<owner>/omnigate:<分支名> 与 :sha-<7位提交号>（main 另加 :latest）
#   push 标签 v*    测试 + 构建；推送 :1.2.3、:1.2、:latest、:sha-<7位>，并创建 GitHub Release（自动生成更新说明）
#   PR 到 main      测试 + 构建（不推送）
#   手动运行        同 push
#
# 镜像只有一个：前端 + 后端 + 内置目录，linux/amd64 与 linux/arm64。不需要任何额外 Secret（GITHUB_TOKEN 推送 GHCR）。
# 可选的雨云（Rainyun RCA）自动部署：在仓库 Secrets 中设置 RAINYUN_API_KEY 与 RAINYUN_OMNIGATE_RCA_APP_ID，
# 未设置时 deploy job 自动跳过（流水线仍为绿色）。

name: Build and Publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 同一分支（含 main）有新提交时取消旧运行，只构建最新的提交；标签发布不互相取消。
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build image
    needs: [ci]
    runs-on: ubuntu-latest
    # Dockerfile 在构建机本机架构上交叉编译 arm64（不经 QEMU 模拟），多架构构建通常 5 分钟左右；卡住时按时失败。
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      version: ${{ steps.vars.outputs.version }}
      semver: ${{ steps.vars.outputs.semver }}
    steps:
      - uses: actions/checkout@v7

      - name: Build info
        id: vars
        run: |
          # 镜像名必须小写（Okysu/OmniGate → ghcr.io/okysu/omnigate）。
          echo "image=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/omnigate" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = tag ]; then version='${{ github.ref_name }}'; else version="sha-${GITHUB_SHA::7}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "semver=${version#v}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=OmniGate
            org.opencontainers.image.description=自托管的统一大模型 API 网关（单镜像：网关 + 管理后台 + 内置价格与套餐目录）
        env:
          # 多架构镜像的 index 也带上 OCI 注解。
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/setup-buildx-action@v4

      # 1) 先构建本机架构并加载到 Docker，用于安全扫描与冒烟检查；通过后才进行多架构构建与推送。
      - name: Build (linux/amd64, for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: omnigate:scan
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha,scope=omnigate
          cache-to: type=gha,mode=max,scope=omnigate

      - name: Smoke test (version, built-in catalog, toolchain)
        run: |
          docker run --rm omnigate:scan version
          docker run --rm omnigate:scan seed export-builtin | python3 -c "import json,sys; c=json.load(sys.stdin); print('built-in catalog:', c['currency'], len(c['prices']), 'prices,', len(c['plans']), 'plans')"
          id=$(docker create omnigate:scan)
          docker cp "$id":/usr/local/bin/omnigate ./omnigate-bin && docker rm "$id"
          got=$(go version ./omnigate-bin | awk '{print $2}')
          want=$(awk '$1 == "toolchain" {print $2}' server/go.mod)
          echo "binary built with $got (minimum $want)"
          test "$(printf '%s\n%s\n' "${want#go}" "${got#go}" | sort -V | head -n1)" = "${want#go}"

      # 发现可修复的 CRITICAL 漏洞时失败（不推送）。操作系统包与 Go 二进制的依赖都会扫描。
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: omnigate:scan
          version: v0.75.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy report (HIGH and CRITICAL, informational)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: omnigate:scan
          version: v0.75.0
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-report.txt
          skip-setup-trivy: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2) 多架构构建（amd64 层直接命中上一步的缓存），附带 SBOM 与 SLSA provenance 证明。
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=omnigate
          cache-to: type=gha,mode=max,scope=omnigate

      - name: Summary
        run: |
          {
            echo "## 镜像"
            if [ "${{ steps.vars.outputs.push }}" = true ]; then echo "已推送（${PLATFORMS}）："; else echo "PR 构建，未推送。标签将会是："; fi
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # v0.x.y-rc.1 这类带后缀的标签标记为预发布。
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            镜像：`docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.semver }}`（linux/amd64、linux/arm64）
            部署：在 deploy/.env 中设置 `OMNIGATE_TAG=${{ needs.build.outputs.semver }}`，然后 `docker compose pull && docker compose up -d`。
            详见 docs/operations/deploy-production.md。

  # 可选：镜像推送成功后重启雨云（Rainyun RCA）应用，使其拉取新镜像。
  # 需要仓库 Secrets：RAINYUN_API_KEY、RAINYUN_OMNIGATE_RCA_APP_ID；未设置时本 job 的步骤全部跳过。
  deploy:
    name: Deploy to Rainyun
    needs: [build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RAINYUN_APP_ID: ${{ secrets.RAINYUN_OMNIGATE_RCA_APP_ID }}
      RAINYUN_API_KEY: ${{ secrets.RAINYUN_API_KEY }}
    steps:
      - name: Check configuration
        if: env.RAINYUN_APP_ID == '' || env.RAINYUN_API_KEY == ''
        run: echo "::notice title=Rainyun deploy skipped::未设置 RAINYUN_API_KEY / RAINYUN_OMNIGATE_RCA_APP_ID，跳过自动部署。"
      - name: Restart Rainyun app
        if: env.RAINYUN_APP_ID != '' && env.RAINYUN_API_KEY != ''
        uses: AkagiYui/rainyun-actions/rca/restart-app@main
        with:
          app-id: ${{ env.RAINYUN_APP_ID }}
          api-key: ${{ env.RAINYUN_API_KEY }}
