# nginx 反向代理：gate.example.com → OmniGate（127.0.0.1:8080），证书来自 Let's Encrypt（certbot）。
#
# 首次申请证书（证书不存在时 443 段会让 nginx -t 失败，所以先只启用 80 段）：
#   sudo mkdir -p /var/www/certbot
#   printf 'server {\n listen 80;\n server_name gate.example.com;\n location /.well-known/acme-challenge/ { root /var/www/certbot; }\n}\n' \
#     | sudo tee /etc/nginx/conf.d/omnigate.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d gate.example.com \
#     --deploy-hook 'systemctl reload nginx'
# 然后换成本文件：
#   sudo cp deploy/nginx/omnigate.conf /etc/nginx/conf.d/omnigate.conf
#   sudo nginx -t && sudo systemctl reload nginx
# 续期由 certbot 自带的 systemd timer / cron 完成（sudo certbot renew --dry-run 验证），续期后 deploy-hook 重载 nginx。
#
# omnigate.env：OMNIGATE_TRUSTED_PROXIES=172.30.88.1（nginx 经 127.0.0.1:8080 端口映射访问容器时的来源地址）。

# WebSocket（Responses WebSocket 模式，GET /v1/responses）需要转发 Upgrade；普通请求保持空 Connection 以复用上游长连接。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name gate.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx ≥ 1.25.1 可改为 "listen 443 ssl;" 加单独一行 "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gate.example.com;

    ssl_certificate     /etc/letsencrypt/live/gate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gate.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:omnigate_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # 与 OmniGate 上限一致：图片编辑、语音转写最大 64 MiB。
    client_max_body_size 64m;

    # 转发带下划线的请求头（Codex CLI 的 Session_id、Thread_id 等）；nginx 默认丢弃它们，
    # 会话亲和与上游号池就认不出会话（docs/contracts/phase12-api.md）。
    underscores_in_headers on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 保留 Host 与 Origin（不要改写，CSRF 校验比较 Origin 与 OMNIGATE_PUBLIC_URL）。
        proxy_set_header Host              $host;
        # 用 $remote_addr 覆盖客户端自带的 X-Forwarded-For，防止伪造（本机就是最外层代理时）。
        # 前面还有 CDN / 负载均衡时改用 $proxy_add_x_forwarded_for，并把它们的地址加入 OMNIGATE_TRUSTED_PROXIES。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 流式响应（SSE、语音合成）：关闭响应缓冲与缓存，否则客户端要等整段回答生成完才收到内容。
        proxy_buffering off;
        proxy_cache off;
        # 不要对 text/event-stream 启用 gzip（gzip_types 默认只含 text/html，保持即可）。

        # 等待上游响应头最长 600 秒（渠道超时上限），流式响应两次事件之间最长 5 分钟；留足余量。
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # 请求体保持默认的缓冲（proxy_request_buffering on）：nginx 收完整个上传再转发，慢客户端不会占住网关连接。
    }
}
